# The gates that were only ever run by hand.
#
# Rite's whole argument is that a rule with no completion test is not a rule. The gates
# existed here for three days and nothing ran them but a human who remembered to — and on
# 2026-09-09 that failed exactly as predicted: scripts/rite-check.py was truncated to zero
# bytes and no gate caught it, because no gate ran.
#
# ALL THREE DECLARED TARGETS RUN as of 2026-09-10. spec/project-standard.yaml declares
# targets [linux, macos, windows] and three rules at `severity: correctness`, and until now
# nothing tested any of them — the only machine that had ever run Rite was one Linux laptop.
# case_sensitive_name_matching says outright that a repo carrying readme.md passes on macOS
# and fails on Linux; a standard whose value is canonical names cannot assert that untested.
#
# WHAT THIS STILL DOES NOT COVER — see d-ci-reports-its-own-coverage:
#   - PyYAML is not installed, so the riteyaml differential test SKIPS on every platform.
#   - test-installed-current.py always skips: a runner has no installed plugin.
# The runner prints both facts on every run. A skip is never folded into green.

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    strategy:
      # fail-fast MUST stay false. The point of a matrix here is to learn what each platform
      # says; cancelling the others the moment one goes red would hide exactly the findings
      # this exists to collect, and leave a portability bug half-diagnosed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Default fetch-depth is sufficient: rite-check.py shells out only to
      # `git show HEAD:` and `git diff HEAD`, neither of which needs history.
      - uses: actions/checkout@v4

      # Keep in step with `python_floor` in .github/gates.yaml — that file is where the
      # supported floor is declared for humans; this is only where it is installed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `python`, not `python3`: setup-python provides it on all three target platforms, so
      # adding the OS matrix later touches `runs-on` and nothing else.
      - name: Run the gates
        run: python .github/run-gates.py
