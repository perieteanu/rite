# What CI runs, and what a skip means for each gate.
#
# This file is the ONE home for the gate list. docs/ARCHITECTURE.md describes the gates in
# prose for a human to read; a second hand-maintained copy inside the runner would be a drift
# surface, which is the failure this project exists to attack. The runner reads this list, and
# reads it with scripts/riteyaml.py — Rite's own parser, exercised in CI on every push.
#
# WRITE DISCIPLINE: rewrite-only. A gate that stops existing is DELETED here, never annotated.
#
# EXIT CODES are a contract shared by every gate: 0 pass, 1 fail, 2 skip. A gate that can skip
# declares `skip_means`, and the runner refuses to fold a skip into green.
#
# `skip_short` is the same fact in one clause, for the sentence README and ARCHITECTURE
# GENERATE from this file. Declaring it here is the point: the gate count was hand-copied into
# four documents and went 9 -> 11 -> 12 -> 13 in a single day, falsifying four or five
# sentences each time (c-gate-count-restated-in-prose). A gate that declares skip_means is a
# gate that can skip, so the skipped COUNT needs no second source either.
---
# The Python version CI runs, and therefore the floor this project supports. Declared HERE
# rather than only inside the workflow, because a version living solely in a workflow step is
# a supported floor that no human-visible file states — a hardcoded value with no home.
# Nothing in this repo declared a floor before 2026-09-10. See d-ci-reports-its-own-coverage.
python_floor: "3.11"

gates:
  - id: standard
    command: [spec/render-standard.py, --check]
    what: "PROJECT-STANDARD.md still matches project-standard.yaml"

  - id: protocol
    command: [spec/render-standard.py, --protocol, --check]
    what: "SESSION-PROTOCOL.md still matches session-protocol.yaml"

  - id: blocks
    command: [spec/render-standard.py, --blocks, --check]
    what: "every rite:generated block still matches its source — the stage table, and the gate counts and list fed from this file"
    # PROJECT-STANDARD.md is generated whole and cannot drift. README.md is prose a human owns
    # that CONTAINS one table the spec owns, so the table is fenced by inert markers and
    # refilled. This gate is half of what retired c-stage-table-duplicated-in-three-places; the
    # other half is stage-table below, because generation cannot catch a copy that is not drift
    # from anything.

  - id: riteyaml
    command: [scripts/test-riteyaml.py]
    what: "riteyaml parses this project's YAML identically to PyYAML"
    skip_short: "PyYAML is its oracle and CI does not install it"
    skip_means: >
      PyYAML is absent, and PyYAML is the ORACLE for this test rather than a dependency of the
      product. CI deliberately does not install it, so riteyaml's correctness claim is NOT
      enforced here. It is enforced on a developer machine, where PyYAML is present.

  - id: hook-shape
    command: [scripts/test-hook-output.py]
    what: "the SessionStart hook nests its verdict under hookSpecificOutput"

  - id: verdicts
    command: [scripts/test-checker-verdicts.py]
    what: "unparseable is RED, absent stays NA, and a false claim is caught"

  - id: portability-rules
    command: [scripts/test-portability-rules.py]
    what: "UTF-8 stdio where a module prints, encoding+errors on every subprocess.run, and no hardcoded python3"

  - id: stage-table
    command: [scripts/test-stage-table-guard.py]
    what: "no document restates the stage mapping outside a rite:generated block"
    # The other half of the same fix. It reads the live, rewrite-only documents only: LOG.md,
    # DECISIONS.yaml and ROADMAP's milestones are append-only records of what was true then,
    # and a gate that fails on a file nobody may legally edit is a gate that gets switched off.

  - id: preflight-port-parity
    command: [scripts/test-preflight-port-parity.py]
    what: "the ported session POST still agrees with preflight.py on status and side"
    skip_short: "a runner has no copy of preflight.py"
    skip_means: >
      ~/projects/claude-preflight/preflight.py is not on this machine. A CI runner never had it,
      and this is the END STATE: the original is Costin's fallback while Rite is on trial, and
      when he retires it this gate skips forever. DELETE IT THEN — a gate that can no longer
      fail is not a gate.

  - id: mirror-port-parity
    command: [scripts/test-mirror-port-parity.py]
    what: "rite's memory mirror still renders identically to the script it ported"
    skip_short: "a runner has no copy of the script Rite ported from"
    skip_means: >
      ~/.claude/scripts/claude-mirror-memory.py is not on this machine, so there is nothing to
      compare against. A CI runner has never had it, and this is also the END STATE: the
      original was kept deliberately as a fallback while rite is on trial, and when it is
      retired this gate skips forever. DELETE IT AT THAT POINT — a gate that can no longer fail
      is not a gate — along with the parity sentence in ~/.claude/commands/mirror-memory.md.
    # Two implementations of one output are alive at once, on purpose. "They agree" was checked
    # twice by hand and by nothing else, which is precisely the kind of claim this project
    # refuses to accept from anyone else. It compares the two GENERATORS and writes nothing.

  - id: watch-discipline
    command: [scripts/test-watch-discipline.py]
    what: "the write-discipline watcher catches rewrites and future timestamps, and is silent otherwise"
    # Silence on success is as load-bearing as the catching: it fires on every Write and Edit,
    # and a watcher that speaks when nothing is wrong is one the user disables within a day.

  - id: copy-attribution
    command: [scripts/test-copy-attribution.py]
    what: "a plan is attributed by authorship — a Write or ExitPlanMode naming it — never by mention"
    # Encodes a defect that shipped for twenty minutes: the first attributor matched any
    # occurrence of the plan's path, and the session BUILDING it had listed the plans directory,
    # so rite's transcript mentioned every plan on the machine. Five of thirteen mis-attributed.
    # Synthetic fixtures only — it never reads real transcripts.

  - id: scaffold
    command: [scripts/test-scaffold.py]
    what: "a scaffolded project opens 0 RED / 0 YELLOW, and the seed never overwrites"

  - id: installed-copy
    command: [scripts/test-installed-current.py]
    what: "the installed plugin matches this working tree, by version and by content"
    skip_short: "a runner has no installed plugin"
    skip_means: >
      Rite is not installed on this machine. A CI runner never has the plugin installed, so
      this gate ALWAYS skips in CI and is enforced only on a developer machine.

  - id: self-check
    command: [scripts/rite-check.py, --exclude-scope=session, --exclude-scope=local_clock]
    what: "rite passes its own standard — 0 RED, every declared claim checked against the tree"
    # local_clock is excluded for a different reason than session, and both are reported as NA
    # rather than dropped. LOG timestamps carry no timezone, so "dated in the future" is only
    # answerable on the machine that wrote them: every runner is UTC and this machine is UTC+3,
    # which made 67 honest entries read as future on the first push. See why_scoped in the spec.
    #
    # session-scoped tests are excluded HERE and nowhere else. Their verdict depends on whether
    # the session running right now has closed, which is unanswerable in a pipeline: the
    # protocol says log as work happens, so the first entry of any session turns
    # written_not_older_than_newest_log_entry RED until /end. That check is live at
    # SessionStart, where the question is "did the LAST session close?" and has an answer.
    # The exclusion is reported as NA on every run, never silently dropped.
