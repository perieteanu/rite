# Rite participation marker. Its PRESENCE is the opt-in signal — an empty file would be just
# as valid, and everything below is optional.
#
# Written by `/rite:init`. Edit it freely; nothing here is generated again.
---
# The project's stage, from [idea, spec, build, polish, shipped, maintain, archived].
#
# THIS LINE DECIDES WHAT THE STANDARD ASKS OF YOU. Each artifact declares the stage it becomes
# required at, and you are not asked for what your stage has not reached:
#
# rite:generated stage-table
#   idea      LOG.md, HANDOFF.md   <- you are here
#   spec      + README.md, CLAUDE.md, docs/MISSION.md, docs/ROADMAP.yaml
#   build     + docs/ARCHITECTURE.md, docs/CONVENTIONS.md, docs/DECISIONS.yaml
#   shipped   + LICENSE
# /rite:generated
#
# Advance it when the project genuinely changes. Nothing expires and nothing nags; the stage
# moves because you say it moved. Run `/rite:preflight` afterwards and the checker will name
# exactly which files it now wants.
#
# DELETING THIS LINE DOES NOT MAKE THE STANDARD LENIENT. With no stage declared, the older and
# stricter behaviour applies and every core document is required at once. Absence is not a
# claim: declaring `idea` is an act, and it is the act that earns the leniency.
stage: idea

# Optional, and unset on purpose. Absent means "the current standard", which is almost always
# what you want. Declaring a version you do not track only earns a YELLOW saying so — Rite
# keeps no old rule sets and never honours a pin.
# standard_version: "1.0.0"

# Optional threshold overrides, unset on purpose. The defaults are admitted guesses, so a
# project whose cadence genuinely differs may widen a window — but never invisibly: any finding
# computed with an override reports the override AND the default alongside it.
# thresholds:
#   roadmap_as_of_days: 60

# Which YAML files Rite reads. By DEFAULT it reads every .yaml/.yml file under your documentation
# directory: broken YAML there is broken whatever your stage says, and a file it cannot parse is a
# file nothing knows the contents of.
#
# Declare more if the files worth checking live elsewhere, and exclude what Rite has no standing
# to judge — a GitHub workflow, a compose file, a generated fixture. Both are reported as a
# counted line, never applied in silence.
#
# In a git repository, files git ignores are not checked at all: telling git not to publish a file
# is a statement that it is not part of what the project claims about itself.
# yaml_check:
#   include:
#     - "config/*.yaml"
#   exclude:
#     - "docs/generated-*.yaml"

# FOR PRE-EXISTING PROJECTS ONLY, and unset here because a project Rite scaffolded has nothing to
# declare — it starts at docs/ with Markdown where the standard names Markdown.
#
# A project built BEFORE this standard may already keep its documents somewhere else, in another
# format. Declaring that stops Rite reporting the layout as a defect on every file, every run, and
# reports the DECLARATION instead — one line, naming what it covers. It is a deferral of migration,
# never a substitute: the standard still says docs/, and still says so.
#
# It excuses LAYOUT ONLY — where a file is and what extension it carries. Nothing about content,
# freshness, structure or integrity is affected, and a format-shaped rule your document satisfies
# anyway is still reported as passing.
#
# `formats` is per artifact and deliberately not a blanket: an artifact you forget to list is still
# reported, so the deferral stays specific to what you actually looked at.
#
# `migrate_by` is optional. Give it a date and the deferral LAPSES when that date passes — every
# finding returns and the missed date is named. Leave it out and the declaration holds
# indefinitely, and the report says in so many words that no date was set.
# legacy_layout:
#   docs_dir: docs-yaml
#   formats:
#     mission: yaml
#     architecture: yaml
#   migrate_by: "2026-12-31"
