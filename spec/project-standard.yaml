# Rite — the project standard (MACHINE FORM, authoritative)
#
# This file is the authority. spec/PROJECT-STANDARD.md is GENERATED from it by
# spec/render-standard.py and must never be hand-edited: `render-standard.py --check`
# fails when the two disagree.
#
# Two layers, marked per item:
#   core   — publishable; true for anyone using Claude Code on any project
#   local  — this machine's conventions; configurable, not part of the public standard
---
schema: rite-project-standard
schema_version: "1.0.0"
as_of: "2026-09-07"
status: draft

meta:
  title: "The fully featured project"
  one_line: >
    What files a project must carry so that a cold agent, or a cold human, can pick it up
    without re-deriving it — and the checks that fail when one of them goes missing or stale.
  why_this_exists: >
    The practice existed for ~12.5 months across 50 projects and was never written down.
    The only prior declaration (ADR d-docs-yaml-self-documenting, 2026-04-24) was scoped to
    a single project, declared five files, and omitted the three that are actually
    universal. Everything else drifted: six naming schemes for one concept, five for
    another. A convention that is imitated rather than specified cannot be checked.
  evidence_base:
    span: "2025-08-22 to 2026-09-07"
    sessions: 462          # floor; prompts.db frozen 2026-04-11, later sessions uncounted
    prompts: 4864          # same floor
    log_entries: 1808
    projects_with_log: 50
    adrs: 230
    sampled_for_structure:
      - hwprivacy          # mature code
      - astrolabe          # code, heavy domain rationale
      - project-tracker    # origin of the convention
      - api.pdf            # richest ADR provenance
      - plumbing           # NON-CODE; only project versioning its core files
      - plan-evacuare      # NON-CODE
  principle: >
    Prefer a check that fails over a discipline that must be remembered. Every artifact here
    declares completion tests for exactly that reason. A standard that passes everything is
    not a standard.

# ── layers ───────────────────────────────────────────────────────────────────
layers:
  core: >
    Publishable. The artifact set, what question each answers, its required structure, and
    its completion tests. Independent of any one person's tooling.
  local: >
    Machine-specific and configurable. Line formats, tag vocabularies, directory naming, and
    integration with a portfolio registry. Rite reads these from config; strangers override
    or ignore them.

# ── stage vocabulary (CORE — Rite's own) ─────────────────────────────────────
# Tiering depends on a project's stage, so Rite must define this itself. A stranger has no
# portfolio registry. Where one exists, it maps onto this list in the local layer.
stage_vocabulary:
  layer: core
  values: [idea, spec, build, polish, shipped, maintain, archived]

  # STAGE IS THE GATING AXIS. Each artifact declares `required_from_stage`; a project declaring
  # an earlier stage is not asked for it, and its file_present reports NA naming the stage
  # rather than RED. `tier` is now a grouping label and no longer decides what is required.
  #
  # Why: measured on 2026-09-10, an empty project declaring `stage: idea` scored 9 RED and 0
  # GREEN, because stage gated exactly ONE artifact (LICENSE) and tier gated everything else.
  # A tool that opens by listing everything you have not done yet is uninstalled the next day —
  # d-stage-gates-the-standard. Under these declarations the same project is asked for two
  # files, both of which the scaffolding creates.
  #
  # `committed_from: spec` was DELETED here on 2026-09-10. It claimed to be "the stage at which
  # Tier 1 becomes required" while the Tier 1 artifacts recorded that this rule had been
  # REPLACED by the .rite.yaml marker — dead metadata contradicting a live rule, on the very
  # axis this redesigns. The per-artifact declarations subsume it. The objection that removed
  # stage-gating on 2026-09-08, that Rite had no reliable way to READ a stage, is void: the
  # marker declares it and the project is the only honest source.
  no_stage_declared: >
    THE THRESHOLDS DO NOT APPLY, and tier-based requirement stands as it did before. Absence is
    not a claim. If a missing declaration meant "require nothing", deleting one line would
    switch the standard off — a hole straight through the product. Declaring `idea` is an act
    and earns the leniency; declaring nothing is not. This also keeps --force runs against
    projects that have never opted in scoring exactly as they do today.

  local_mapping:
    source: "project-tracker projects.yaml -> per-project `stage` field"
    note: "Identical value set today; kept as a mapping so the two can diverge."

# ── provenance header (CORE) ─────────────────────────────────────────────────
# Modeled on plumbing/docs-yaml/, the only project in the corpus that versions its core
# files. Three lines, and they are what make staleness checkable rather than inferred:
# without `as_of` a checker can only guess from mtime, which a reformat or a typo fix resets.
provenance_header:
  layer: core
  required_in: >
    every file in the docs directory — as YAML front matter in a .md, as top-level keys in a
    .yaml. One parser reads both, so the header is form-independent by design.
  keys:
    schema_version:
      type: string
      example: "1.0.0"
      means: "version of THIS file's own shape"
    as_of:
      type: date
      format: "YYYY-MM-DD"
      means: >
        The date this file's claims were last verified against the thing they describe —
        the code, the host, the physical installation. NOT the date it was last edited.
        Touching a typo does not move as_of; re-checking the claims does.
    status:
      type: enum
      values: [draft, current, superseded]
  optional_keys:
    applies_from: "date the described state began (plumbing)"
    basis: "what the verification was performed against (plumbing)"

# ── file format (CORE) ───────────────────────────────────────────────────────
# Prose goes in Markdown, structure goes in YAML, and the provenance header is identical in
# both. The choice is per FILE, not per project — a directory named for a format is a claim
# that goes stale the first time one file inside it changes shape, which is why the canonical
# directory is `docs/` and not `docs-yaml/`.
file_format:
  layer: core
  rule: >
    If a checker must read a FIELD of it, it is YAML. If a human reads it end to end, it is
    Markdown. Nothing is both.
  forms:
    md:
      provenance: "YAML front matter, fenced by --- at the top of the file"
      structure_unit: "H2 heading (`## Name`)"
      tested_by: [required_sections, no_empty_sections, min_content_sections]
      artifacts: [readme, claude_md, log, mission, architecture, conventions, handoff, plan_copy, memory_mirror]
    yaml:
      provenance: "top-level keys"
      structure_unit: "mapping key"
      tested_by: [required_keys_present, entry_required_keys, unique_ids, min_list_items]
      artifacts: [decisions, roadmap, concerns]
    text:
      provenance: "none — and a header would be a defect"
      structure_unit: "n/a — reproduced verbatim"
      tested_by: [min_lines, no_provenance_header]
      artifacts: [license]
      note: >
        Only LICENSE. It is not authored prose, it is third-party text reproduced exactly, so
        neither the Markdown nor the YAML rule applies to it.
  measured_basis: >
    This project's own spec exists in both forms with byte-identical content:
    25287 bytes as YAML, 19275 as Markdown — 24% smaller — because YAML charges a `key:` and
    an indent for every line of prose. The saving reverses for genuinely structured data,
    where Markdown must reinvent nesting that YAML gives for free.
  dependency_note: >
    Markdown needs no parser, degrades gracefully, and cannot fail to load on a bad indent.
    YAML needs PyYAML. That argues for Markdown everywhere EXCEPT where the alternative is
    hand-writing a Markdown-structure parser — trading an installed dependency for a worse
    bespoke one. Hence the split rather than a single answer.

# ── write discipline (CORE) ──────────────────────────────────────────────────
# How a file may legally be changed. Declared per artifact, because "edit the docs" means
# five different things and getting it wrong is silent: an appended roadmap becomes a
# graveyard, a rewritten log destroys the only durable record, an edited plan falsifies what
# was actually approved.
write_discipline:
  layer: core
  values:
    append_only:
      means: "Never rewrite existing content. Only add, at the end."
      correction: "Append a dated correction block; the original stays byte-identical."
      exception: "One-time format migrations, which must themselves be logged."
      tested_by: append_only_preserved
    rewrite_only:
      means: >
        States current truth. Stale content is DELETED, never annotated or accumulated. The
        file must be readable as a statement about now, with no archaeology in it.
      hazard: >
        Accumulation. A rewrite-only file that only grows has silently become append-only and
        stopped being true.
      tested_by: as_of_within_days_of_activity
    write_once:
      means: >
        Frozen at a declared moment. Not appended, not rewritten, not regenerated afterwards.
        There is no source to regenerate it FROM — the file IS the record.
      freeze_point: >
        Named per artifact, because "creation" is ambiguous for anything a human drafts:
        HANDOFF.md freezes at SESSION END (it is drafted and revised freely during the session
        that authors it — otherwise it could never be written iteratively, which is absurd);
        PLAN-*.md freezes at COPY, since tooling produces it whole; ROADMAP `inception`
        freezes at project birth. After the freeze point, a change means a NEW file or a
        DECISIONS entry — never an edit.
      hazard: "Editing one falsifies a record of what was actually agreed, and nothing detects it."
      tested_by: content_stable_after_creation
    free_replace:
      means: "Overwritten wholesale from a declared source. Local edits are discarded by design."
      requires: "A `generated_by` field naming the source and the regeneration command."
      tested_by: regenerates_identically
    mixed:
      means: >
        Entries mutate, but an id ledger inside the file is append-only. Must state which part
        is which.
      note: >
        ROADMAP.yaml and CONCERNS.yaml. Both must name, in the file, which part is which —
        a mixed file that does not say where the line falls is worse than either pure form.
  rule: >
    Every artifact declares exactly one. An artifact with no declared write discipline has no
    rule a check can test, which is the same as having no rule.

# ── tiers ────────────────────────────────────────────────────────────────────
tiers:
  - id: 0
    label: "Always, from creation"
    rule: "Present at every stage, including idea."
    evidence: >
      11/11 sampled projects carry README, CLAUDE.md and LOG.md, including the two carrying
      none of Tier 1. HANDOFF.md was promoted here by user ruling on 2026-09-07, against the
      corpus rather than from it: 0/11 carried one reliably, which is the gap, not the norm.
  - id: 1
    label: "Once committed"
    rule: >
      Required once the project has committed. Since 2026-09-08 the trigger is the PRESENCE OF
      THE .rite.yaml MARKER, not a stage field: opting in IS the act of committing, so Rite
      needs no stage source to enforce Tier 1. This replaced "required from stage `spec`
      onward", which depended on knowing a stage Rite has no reliable way to read.
    evidence: "9/11 sampled; adopted all-or-nothing, never partially."
  - id: 2
    label: "Situational"
    rule: "Not required. When present, the canonical name and shape apply."
  - id: 3
    label: "Generated"
    rule: "Written by tooling. Never hand-edited; edits do not propagate back."

# ── portability (CORE) ───────────────────────────────────────────────────────
# MISSION declares cross-platform as a constraint. These are the rules that make it true
# rather than aspirational. Every one of them was found by asking what breaks on Windows and
# macOS, not by hitting it — so they are predictions, and should be re-checked on first
# contact with a real non-Linux machine.
portability:
  layer: core
  targets: [linux, macos, windows]
  harness_note: >
    VS Code and the terminal differ MORE than Windows and macOS do, but not for file handling
    — only for what a hook can surface. Under entrypoint=claude-vscode only `additionalContext`
    reaches the session (systemMessage/showOutput do nothing, re-verified on 2.1.263), and the
    /plugin TUI is unavailable, so installation must go through the `claude` shell CLI. Design
    output for additionalContext as the lowest common denominator. None of this affects YAML,
    Markdown, or any check.
  rules:

    - id: case_sensitive_name_matching
      severity: correctness
      rule: >
        NEVER use Path.exists() to test for an artifact. List the directory and compare names
        exactly, byte for byte.
      why: >
        macOS (APFS default) and Windows are case-insensitive. Path("README.md").exists()
        returns True for a file actually named readme.md. A project carrying readme.md and
        Claude.md therefore PASSES on macOS and Windows and FAILS on Linux — the same repo,
        two verdicts. For a standard whose entire value is canonical names, that is a
        correctness bug, not a portability nicety. It is also the rule most likely to be
        undone by a well-meaning simplification.

    - id: generated_output_is_lf_only
      severity: correctness
      rule: "Every generated file is written with newline=\"\\n\". Never the platform default."
      why: >
        write_text() with no newline argument translates \n to os.linesep, so a file generated
        on Windows lands as CRLF. The drift gate itself survives, because text-mode reads
        normalize — but the file churns byte-wise across platforms and a diff shows every line
        changed. Applied to render-standard.py on 2026-09-07.

    - id: normalize_before_byte_comparison
      severity: correctness
      rule: >
        Any test comparing a file against a previous revision normalizes line endings first.
        Compare content, never encoding of line breaks.
      why: >
        VS Code on Windows saves CRLF by default. PyYAML parses \r\n without complaint, so
        DECISIONS.yaml still loads — but append_only_preserved compares bytes, and every line
        reads as changed. The integrity test would fail on a file nobody touched.
      rejected_alternative: >
        A .gitattributes with eol=lf. Correct, conventional, and rejected: it is a
        hand-authored 14th file one hour after the inventory was frozen at 13. Normalizing
        inside the comparison achieves the same result with no new file, consistent with the
        ruling that put the /end outcome in HANDOFF rather than a stamp.

    - id: process_output_declares_encoding
      severity: correctness
      rule: >
        Every entry point declares its stdout and stderr as UTF-8 before printing, via
        ritefs.use_utf8_stdio(). Every read of another process's output names BOTH
        encoding="utf-8" AND errors="replace". A byte must not mean different things at the
        two ends of one pipe.
      why: >
        The existing rules cover files. This one covers PIPES, and its absence was found on
        2026-09-10 by the first CI run that was not on Linux. Python selects the console
        codepage for stdout on Windows, so a report containing `·` or `—` is emitted as cp1252
        there and as UTF-8 on Linux and macOS — one program, three byte streams. run-gates.py
        captured a child with encoding="utf-8", got cp1252, and a reader thread died with
        `UnicodeDecodeError: ... byte 0x97`, which is cp1252's em dash. TWO gates reported FAIL
        for a reason having nothing to do with what they test — the worst kind of red, because
        it accuses the wrong component.
      the_quieter_half: >
        MORE IMPORTANT THAN THE CRASH. A parent that decodes with the locale and then searches
        for a literal such as "checks ·" matches by coincidence on cp1252 and silently fails to
        match on cp437 or cp850 — dropping the line rather than raising. That is the failure
        this standard exists to prevent: not an error, an absence that looks like a pass.
        Hence errors="replace" as well: mojibake in a report is a finding a human can see,
        while a crash in the reader is a mystery attributed to the wrong place.
      rejected_alternative: >
        ASCII-only output. It would need no declaration at all, and it is not available: the
        messages are read from YAML documents that are full of em dashes, so the text is
        non-ASCII before any code formats it. The encoding has to be stated, not avoided.
      one_implementation: >
        ritefs.use_utf8_stdio(), same discipline as case_sensitive_name_matching and for the
        same reason — see d-one-implementation-of-a-portability-rule. Ten entry points call
        it. An eleventh that forgets is why the reading half is defensive too.
      checked_by: >
        scripts/test-portability-rules.py, and this rule is the reason that file exists. Within
        an hour of being written down, the rule was found violated at FIVE of the repo's seven
        subprocess.run sites — two of them inside the checker itself — and they were found by
        GREPPING, which is the discipline-instead-of-a-check failure this project exists to
        abolish. The test walks the syntax tree rather than the text, because a substring
        search for "use_utf8_stdio()" also matches its definition and this very sentence.
        Verified retrospectively against the tree at 2a3a82d: it reports exactly those five,
        by file and line.

    - id: shell_only_as_a_launcher
      severity: correctness
      rule: >
        Shell is permitted in exactly ONE place: a launcher shim that locates Python or
        explains why it cannot. Nothing else. No checks, no parsing, no logic.
      why: >
        The shell is the only executor guaranteed to exist — but it is not portable, because
        .sh and .bat are two implementations. "Guaranteed present" and "written once" are
        mutually exclusive, and this rule takes both, by making the guaranteed-but-duplicated
        part as small as it can possibly be.
      shape: >
        ONE POSIX sh script. Try python3, then python, then py. On success exec the real work.
        On failure print what is missing, how to install it, and exit non-zero. That is the
        entire contract.
      shell_selection_measured:
        source: "code.claude.com/docs/en/hooks and /setup, verified 2026-09-07"
        hook_shell_field: >
          A hook may declare `shell: bash | powershell`. It defaults to bash, or to powershell
          on Windows when Git Bash is not installed. In SHELL FORM (no `args`) the command
          string goes to `sh -c` on macOS and Linux, Git Bash on Windows, or PowerShell when
          Git Bash is absent.
        exec_form: >
          When `args` is set, the `shell` field is IGNORED and no shell runs at all — the
          executable is invoked directly. This is the only cross-platform-identical execution
          path, and it eliminates the Git Bash quirks outright.
        cmd_exe_is_never_used: >
          Settled: cmd.exe and .bat play no part in hook execution on any configuration. The
          Windows fallback is PowerShell. A .bat shim would be dead code.
        git_for_windows_is_optional: >
          Recommended, not required — corrected against the docs. An earlier reading of the
          binary treated it as a hard requirement; the error string that suggested it fires
          only when Git Bash is absent AND the PowerShell tool is disabled.
      two_shims_not_one:
        decision: ".sh and .ps1. Never .bat."
        coverage:
          - "Linux -> sh -c -> the .sh shim"
          - "macOS -> sh -c -> the .sh shim"
          - "Windows with Git for Windows (the recommended setup) -> Git Bash -> the .sh shim"
          - "Windows without Git for Windows -> PowerShell -> the .ps1 shim"
        why_not_exec_form_alone: >
          Exec form needs a concrete executable name and there is none that works everywhere:
          macOS has python3 but not python, Debian likewise, Windows has python and py but
          often not python3. Exec form solves the shell problem and not the interpreter
          problem, so a shim is still required.
        why_this_does_not_drift: >
          Each shim has exactly one job — find an interpreter or explain that it cannot — and
          neither contains a check, a parse, or any logic. PowerShell is also a real language,
          unlike batch, so the .ps1 is a direct translation rather than a reimplementation.
        windows_traps_via_git_bash:
          - "Git Bash consumes unquoted backslashes in a command."
          - "Git Bash auto-aliases node to `winpty node.exe`."
          - "CLAUDE_CODE_GIT_BASH_PATH may relocate it; never hardcode a path."
        still_unverified: >
          None of this has run on a real Windows or macOS machine. It is documentation plus
          binary strings, which is better than assumption and worse than a test.

    - id: explicit_utf8_everywhere
      severity: correctness
      rule: "Every read and write names encoding='utf-8'. Never rely on the platform default."
      why: >
        Windows defaults to cp1252. The generated standard contains 171 non-ASCII characters
        (em dash, middle dot, left arrow), and YAML mandates UTF-8 regardless of platform.
        An unqualified open() works on Linux and corrupts on Windows, which is the worst
        possible failure ordering — it passes where it is developed.

    - id: python_invocation_differs
      severity: documentation
      rule: >
        Never hardcode `python3` in documentation or a hook command. On Windows the name is
        `py` or `python`; `python3` is not a standard Windows executable.
      why: "The command printed in a README is the first thing a new user runs, and on Windows this one fails."

    - id: stdlib_only_no_pip_dependencies
      severity: correctness
      rule: >
        Python stdlib only. No pip install, ever, for the base layer. YAML is read by a subset
        parser shipped with Rite.
      why: >
        PyYAML is not installed by default on macOS or Windows, so depending on it would make
        "pip install first" the default first-run experience on two of three target platforms.
        Measured across 1839 lines of this project's own YAML, every construct that makes YAML
        hard to parse is unused — no anchors, aliases, tags, flow mappings, block literals,
        merge keys or complex keys — so the dependency buys almost nothing.
      the_parser_must_refuse: >
        On meeting an anchor, alias, tag, block literal or merge key the parser ERRORS, naming
        the file and line. It never guesses. A hand-rolled parser that silently mis-parses is
        far worse than no parser at all.
      differential_test: >
        Every project YAML file is parsed by both the subset parser and PyYAML, and the
        resulting structures compared; any difference fails. PyYAML stays installed as the
        ORACLE for that test and is never a runtime dependency. If the test cannot be made to
        pass, the decision is reversed rather than the test weakened.

    - id: claude_home_slug_derivation
      severity: open
      rule: "Deriving a project slug from a path is platform-specific and is not yet solved."
      why: >
        Memory directories encode the project path as dashes
        (-home-perieteanu-projects-rite). On Windows that is a drive letter and backslashes.
        Unbuilt today; it lands in the port-mirror-memory work.

# ── verdicts and failure semantics (CORE) ────────────────────────────────────
# What a failing check DOES. Until 2026-09-08 this was undefined, which is a hole in a
# project whose entire product is "a check that fails".
# The vocabulary is INHERITED from claude-preflight, not invented: d-preflight-is-config-not-fork
# makes Rite its upstream, so a second severity scheme would be the drift that decision refuses.
verdicts:
  layer: core
  vocabulary: [GREEN, YELLOW, RED, NA]
  sides: [claude, project, machine]
  side_meaning: >
    Every finding is tagged whose-side-to-fix. This is preflight's one original idea and it
    carries over unchanged. For the project standard almost everything is `project`; `machine`
    and `claude` belong to the session-start checks.

  level_to_severity:
    exists:
      severity: RED
      why: "An artifact required at this tier is missing. Nothing else about the project can be trusted to be checkable."
      note: "A tier-2 artifact that is absent is NA, not RED — optional means optional."
    populated:
      severity: YELLOW
      why: "The file is there but empty, placeholder-filled, or missing a required section. A defect, not a void."
    fresh:
      severity: YELLOW
      why: "It was true once and is not now. Staleness is advisory by nature — treating it as fatal makes the gate fire constantly."
    integrity:
      severity: RED
      why: >
        Something is actively WRONG, not merely old: an append-only file was rewritten, a
        supersedes id resolves to nothing, a generated file no longer matches its source.
        These are the checks that catch a lie rather than a lapse.

  exit_policy:
    default: "exit 1 on any RED; YELLOW and GREEN exit 0"
    configurable: "fail_on: red | yellow | none"
    why_yellow_does_not_fail_by_default: >
      So the gate stays credible. A check that breaks the build every time a document is
      slightly old is the gate that always fails, and it gets switched off within a week —
      the argument this project makes about everything else, applied to itself.
    why_it_can_fail_at_all: >
      A non-zero exit is what lets Rite gate a pre-commit hook or a CI run. That is the
      strongest enforcement available to it, and refusing to ever fail would give it up.

  never_blocks_a_session: >
    Verdicts are REPORTED at session start, never enforced there. The start phase already
    declares must_not: block, prompt, or re-run anything with side effects. Gating belongs to
    an explicitly invoked checker, not to a hook the user did not ask for.

# ── participation (CORE) ─────────────────────────────────────────────────────
# How a project opts in. Without this a non-conforming project fails forever, which is the
# "gate that always fails" problem at product scale — and 40 of this machine's projects are
# deliberately not being migrated.
participation:
  layer: core
  model: opt_in
  marker: ".rite.yaml"
  rule: >
    Rite checks a project ONLY if the marker is present. Everywhere else it is silent — no
    verdict, no nag, no first-run prompt.
  why_opt_in: >
    Migration of existing projects is explicitly opt-in (d-audience-public-standard, and the
    standing don't-migrate rule). A tool that starts reporting on 40 projects nobody asked it
    to check is noise on first contact, and noise is what gets a plugin uninstalled.
  marker_contents:
    minimal: "an empty file is a valid marker — presence is the signal"
    optional_keys: [standard_version, fail_on, thresholds, disabled_checks]

  thresholds:
    rule: >
      Freshness windows are per-project overridable. Structural minimums are NOT. The two are
      different kinds of number and conflating them would let a project define away the
      standard.
    overridable:
      - key: "log.newest_entry_within_days_of_activity"
        default: 30
      - key: "roadmap.as_of_within_days_of_activity"
        default: 60
      - key: "architecture.as_of_within_days_of_activity"
        default: 90
    why_overridable: >
      All three are admitted guesses, never calibrated against a real corpus
      (c-freshness-thresholds-are-guesses), and project cadence genuinely varies. `plumbing`
      changes twice a year; a fixed 60-day roadmap window would fail it permanently and
      teach the user to ignore the tool.
    fixed:
      - min_lines
      - min_entries
      - min_content_sections
      - min_list_items
      - required_sections
      - required_keys_present
      - required_from_stage
    why_fixed: >
      These ARE the standard rather than a calibration of it. A LOG with zero entries is
      broken regardless of taste, and a project that can lower every bar to its own current
      state is not being measured by anything.
    overrides_are_never_silent:
      rule: >
        Any finding computed with an overridden threshold MUST report the override and the
        default alongside it — e.g. "roadmap as_of 210d old (window 365d, overridden from 60)".
      why: >
        An unbounded override is a silent opt-out: set 99999 and the check never fires again,
        with nothing to show it was ever disabled. There is deliberately NO cap, because any
        cap would be as arbitrary as the default it protects. Visibility is the control, not a
        limit — the same principle as "explicit nothing beats absent". A project may widen a
        window; it may not do so invisibly.
    disabled_checks_same_rule: >
      A check silenced via `disabled_checks` is reported as NA with "disabled in .rite.yaml",
      never omitted from the output. A check that vanishes and one that passed must never look
      alike.
  not_an_artifact: >
    `.rite.yaml` is CONFIG, not a documentation artifact, so it does not count against the
    inventory frozen at 13. The inventory covers what a cold human or agent READS to understand
    the project; this file is operational, in the same family as .gitignore or phpstan.neon.
    Recorded explicitly because the freeze exists precisely to stop additions being absorbed
    without argument — see d-verdicts-and-participation.

# ── capabilities (CORE) ──────────────────────────────────────────────────────
# What Rite needs, what it merely USES, and what it does when something is missing.
# The distinction matters: a prerequisite absent means a broken tool; a capability absent
# means a smaller tool that still works.
capabilities:
  layer: core

  prerequisite:
    python3:
      needed_for: "every script — preflight, the checker, the memory mirror, plan copy"
      not_needed_for: "the judgement half. /end, /log and /handoff are Markdown prompts."

  capability_not_prerequisite:
    git:
      enables: [append_only_preserved, milestones_append_only, inception_unchanged, content_stable_after_creation]
      when_absent: "those tests report NA — requires revision history. Never RED, never silently omitted."
      why_not_required: >
        MEASURED 2026-09-08 across 10 sampled projects: SIX are not git repositories, including
        `plumbing` and `usa-beci` — the two non-code projects d-noncode-first-class explicitly
        promises to serve — plus project-tracker, claude-preflight, claude-persistent and rite
        itself. Requiring git would fail 60% of the corpus and break a settled ADR.
      expectation_setting: >
        On most of this machine's projects the integrity tier will read NA. The useful coverage
        for them is exists / populated / fresh. Know that before building the checker rather
        than discovering it at validate-against-real-projects.

  degradation_tiers:
    - have: "neither python nor git"
      works: "the ENTIRE judgement half — /end, /log, /handoff. Markdown prompts; no interpreter."
      note: >
        A CONSEQUENCE, not a selling point. The expected consumer runs Claude Code and almost
        certainly has both python and git already, so Rite states "Requires Python 3" plainly
        and does not advertise degradation — d-goal-is-credibility rules out over-engineering
        toward installs. This tier costs nothing to keep because it was never built: the
        judgement half needs no interpreter as a consequence of commands being Markdown
        prompts. It is what the setup check REPORTS when reality differs from the expectation.
      not_hypothetical: >
        One case is real rather than theoretical — Windows first-run, where python is absent by
        default. That is the situation behind d-never-instruct-installation.
    - have: "python, no git"
      works: "+ preflight verdict, exists / populated / fresh checks, memory mirror, plan copy"
    - have: "python and git"
      works: "+ the integrity tier"

  # ── the setup check ────────────────────────────────────────────────────────
  # Shaped by a real incident, recorded because the lesson is not obvious:
  # a user on Windows 11 was told by an AI coding tool to install Python; the attempt broke
  # his existing Python and pyenv installation, and getting git working was a separate
  # ordeal. The tool caused the damage by INSTRUCTING an install it could not see the
  # consequences of.
  setup_check:
    purpose: "Report which capabilities are present and what each one enables. Nothing else."
    rules:

      - id: never_instruct_installation
        rule: >
          Rite MUST NOT tell a user to install anything, and MUST NOT print a command to paste.
          It reports what is present, what is dormant, and what that costs.
        why: >
          The tool cannot see the machine's existing state — system python, pyenv, conda, the
          Microsoft Store alias, WSL, Git Bash's own interpreter — so any install instruction
          is a guess with the user's environment as the stake. A wrong guess breaks a working
          setup, and the user then owns a problem the tool created.
        instead: >
          Name what is missing and what is unavailable because of it. If the user asks how to
          fix it, link the vendor's own documentation; never a command.

      - id: never_modify_the_environment
        rule: "Never install, never edit PATH, never write to a python, pyenv or git config. Ever."
        why: "Extends never_mutate_claude_home to the whole machine. Detection is read-only by construction."

      - id: probing_must_not_trigger_installs
        rule: >
          On Windows, do NOT invoke bare `python` to test for it. The App Execution Alias
          opens the Microsoft Store.
        why: >
          The DETECTION would itself cause the surprise it is meant to prevent — a Store window
          appearing because a background check ran. Probe with `py -0` or by resolving the
          executable path instead of executing it.

      - id: three_states_not_two
        rule: "Report absent / present-but-broken / working. They are different problems and need different words."
        why: >
          A broken interpreter is the worst state and the most confusing: something IS
          installed, so 'install Python' is wrong advice and will send the user to make it
          worse. Detect by running a trivial program, not by finding a file.
        wording: >
          Absent -> 'not found; the mechanical half is unavailable'.
          Broken -> 'found at <path> but it fails to run'. State the path, state the symptom,
          prescribe nothing.

      - id: pull_not_push
        rule: "The setup report is available on request. It is not shown unprompted more than once."
        why: "Same argument as the nag policy and the rejected timer reminders: a message that is always true stops being read."

# ── inventory freeze (CORE) ──────────────────────────────────────────────────
# The set of artifacts below is FROZEN as of 2026-09-07. Frozen means: this is the complete
# list of files a human or an agent AUTHORS. Adding a 14th requires a DECISIONS entry, not a
# good idea in the moment — the inventory grew by four in one session and would have grown by
# three more if every reasonable suggestion had been taken.
inventory:
  layer: core
  frozen_on: "2026-09-07"
  count: 13
  scope: >
    Human-authored artifacts only. Files PRODUCED BY SCRIPTS are deliberately out of this
    freeze and are specified separately, once their producers exist and their purpose is
    settled. An artifact whose producer does not exist cannot be specified honestly — its
    shape is guesswork dressed as a standard.
  one_exception:
    artifact: memory_mirror
    why: >
      docs/claude-memory.md is script-produced yet declared here, because its producer already
      exists and runs (claude-mirror-memory.py, a PostToolUse hook). Consistent with the rule
      rather than an exception to it: a generated artifact is declarable exactly when its
      producer is real.
  deferred_pending_purpose:
    - id: status_json
      what: "The SessionStart verdict — machine / project / claude"
      status: "deferred — necessity not yet agreed"
      note: "Discussed 2026-09-07 and NOT added. The need is asserted, not established."
    - id: checks_yaml
      what: "Config driving the checks, inherited in shape from claude-preflight"
      status: "deferred — purpose not yet clear"
      note: >
        d-preflight-is-config-not-fork says preflight BECOMES this file, so it will exist. What
        it must contain for a stranger, versus for this machine, is unsettled.
    - id: end_stamp
      what: "A marker that /end ran"
      status: "REJECTED — not deferred"
      note: >
        Ruled out 2026-09-07: /end is a process, and its result is recorded in HANDOFF.md front
        matter (`session_end:`). No new file. This is why the standard has 13 artifacts and not
        14, and the rejection is recorded so it is not helpfully re-proposed.

# ── artifacts ────────────────────────────────────────────────────────────────
artifacts:

  - id: readme
    path: "README.md"
    write_discipline: rewrite_only
    tier: 0
    required_from_stage: spec
    layer: core
    answers: "What is this, and how does a human start?"
    audience: human
    form: md
    structure:
      recommended_sections:
        - "What this is (one paragraph, no preamble)"
        - "Status — stage, and one line of current state"
        - "Install / run"
        - "Credits"
      notes: >
        For a published project this is what the listing renders, so it is the highest-value
        file in the repo and the one most often left stale. README quality outweighs install
        counts for a portfolio artifact.
    tests:
      - level: exists
        rule: file_present
      - level: populated
        rule: min_lines
        value: 8
      - level: populated
        rule: no_placeholders
        patterns: ["TODO", "FIXME", "<fill", "XXX", "Lorem ipsum"]
      # claims_match_stage was REMOVED on 2026-09-08. It required a source for the project's
      # "actual" stage, and the only candidates were .rite.yaml (a second source of truth
      # beside project-tracker's projects.yaml) or the registry itself (which a stranger does
      # not have). Neither was worth a cross-project boundary decision — and the test was
      # redundant: its own justification cited claude-persistent's README asserting "spec —
      # no extension code yet" over a built, running extension, which is a claim about the
      # FILESYSTEM, not about a stage field. claims_match_filesystem covers it. The test was
      # specified as a stage comparison and justified by a filesystem example; removing it is
      # a consolidation, not a loss of coverage. See d-drop-claims-match-stage.
      #
      # ... and that consolidation was never finished. The note above said
      # "claims_match_filesystem covers it" while README did not DECLARE the rule — it was
      # declared on CLAUDE.md alone. On 2026-09-09 README asserted "No plugin, no hooks, no
      # slash commands, no packaging" over a running, installed plugin, and nothing in the
      # standard could have caught it. Declared here 2026-09-09, see d-claim-surface.
      - level: populated
        rule: claims_declared
      - level: integrity
        rule: claims_match_filesystem

  - id: claude_md
    path: "CLAUDE.md"
    write_discipline: rewrite_only
    tier: 0
    required_from_stage: spec
    layer: core
    answers: "What must an agent know before touching this?"
    audience: agent
    form: md
    structure:
      recommended_sections:
        # Drawn from what already recurs across 10 sampled projects.
        - "What this is"
        - "Read first (in this order)"
        - "The one insight the whole project rests on"
        - "Traps that produce plausible-but-wrong output"
        - "Don'ts / firm rules"          # present in 10/10 — the only universal section
        - "Locked findings (do not re-litigate)"
        - "Explicitly NOT built yet"
        - "Relationships"
        - "Response style"
      notes: >
        `Don'ts` appeared in every sampled project and is the load-bearing section.
        `Explicitly NOT built yet` and `Locked findings` are what stop a fresh session
        re-doing settled work; both are cheap and both are usually missing.
    tests:
      - level: exists
        rule: file_present
      - level: populated
        rule: required_sections
        value: ["What this is"]
      - level: populated
        rule: min_lines
        value: 15
      - level: populated
        rule: claims_declared
        means: >
          This document declares a `claims:` block. A core document that asserts nothing
          falsifiable about the tree is not wrong — it is unfalsifiable, which is worse,
          because it cannot be caught being wrong either.
      - level: integrity
        rule: claims_match_filesystem
        means: >
          Every path in `claims.absent` is absent and every path in `claims.present` is
          present. This is the api.pdf doc-rot class: a claim that reads perfectly and is
          flatly wrong. INTEGRITY rather than fresh — a document that is confidently wrong is
          not merely stale, and the level is what decides whether the verdict is loud.
          LIMIT: path-shaped claims only. A claim about BEHAVIOUR ("it writes status.json")
          passes untouched.

  - id: log
    path: "LOG.md"
    write_discipline: append_only
    tier: 0
    required_from_stage: idea
    layer: core
    answers: "What happened, in order?"
    audience: both
    form: md
    structure:
      append_only: true
      line_format_layer: local
      notes: >
        The durable record. Transcripts are pruned by the harness — measured on this machine,
        four weeks of transcripts against ten months of LOG. The log outlives the session
        that produced it, which is the whole argument for writing one.
      file_order_vs_timestamp: >
        File order is insertion order and MAY differ from chronological order. Any consumer
        must sort by parsed timestamp before displaying, ranking, or aggregating.
    tests:
      - level: exists
        rule: file_present
      - level: populated
        rule: min_entries
        value: 1
      - level: populated
        rule: entries_parse
        means: "Every non-blank, non-heading line matches the configured line format."
      - level: fresh
        rule: newest_entry_within_days_of_activity
        value: 30
        means: "Code changed since the last log entry means the session did not close."
      - level: integrity
        rule: append_only_preserved
        means: >
          Existing entries are byte-identical to the previous revision. Only additions are
          legal. Format migrations are the sole exception and must be logged as such.

  - id: mission
    path: "docs/MISSION.md"
    write_discipline: rewrite_only
    tier: 1
    required_from_stage: spec
    layer: core
    answers: "Why does this exist, and what is it deliberately not?"
    audience: both
    form: md
    structure:
      required_sections: ["Mission", "Constraints", "Non-goals"]
      recommended_sections: ["The key insight", "Motivation quotes", "Evidence base", "Honest limit"]
      section_aliases:
        "Non-goals": ["Explicit non-goals", "Scope"]
      notes: >
        `non_goals` is the highest-value key and the most often skipped: it is what stops a
        later session drifting into adjacent rewrites. `motivation_quotes` — verbatim user
        quotes — survives paraphrase drift better than any summary.
    tests:
      - level: exists
        rule: file_present
      - level: populated
        rule: required_sections
      - level: populated
        rule: no_empty_sections
      - level: fresh
        rule: as_of_present

  - id: architecture
    path: "docs/ARCHITECTURE.md"
    write_discipline: rewrite_only
    tier: 1
    required_from_stage: build
    layer: core
    answers: "What lives where, what flows where, and who owns what?"
    audience: both
    form: md
    must_be_current: >
      ARCHITECTURE describes the shape of the thing as it is NOW. Unlike MISSION, which is
      near-static, and DECISIONS, which is a growing record, this file has no legitimate
      stale state — a wrong architecture doc actively misroutes the next session. Rewrite it
      in the same session the shape changes, not at the next audit.
    schema_strictness: loose
    structure:
      required_sections: []
      required_any_of_sections: ["Shape", "Summary", "Layout"]
      required_any_of_waived_when: >
        The project is non-code and its top-level keys ARE the topology. Measured: plumbing's
        ARCHITECTURE has neither `shape` nor `layout` — it has supply_chain, valves,
        loss_budget. Requiring a generic container key would fail it, and non-code projects
        are first-class (d-noncode-first-class). Substance is tested instead.
      recommended_sections: ["Hard boundaries", "Rejected", "Dependencies", "Data flow"]
      section_aliases:
        "Shape": ["Summary"]
        "Hard boundaries": ["Ownership rules", "State ownership"]
      notes: >
        DELIBERATELY the loosest schema in the standard. It was the least standardized file
        in the corpus, and one sampled project's ARCHITECTURE is a physical plumbing topology
        (supply_chain, valves, loss_budget) rather than software. A required-key set narrow
        enough for both is the correct design; pretending to a tight schema here would only
        produce ceremonial compliance.
        `rejected` — designs considered and refused, with why — is what prevents a later
        session re-proposing something already ruled out.
    tests:
      - level: exists
        rule: file_present
      - level: populated
        rule: min_content_sections
        value: 3
        means: >
          At least three H2 sections beyond the title. This replaces a required-key list,
          which cannot span a Rust codebase and a plumbing schematic.
      - level: fresh
        rule: as_of_present
      - level: fresh
        rule: as_of_within_days_of_activity
        value: 90
        means: "Measured against source mtime, never against another document."
      - level: populated
        rule: claims_declared
      - level: integrity
        rule: claims_match_filesystem
        means: >
          The must_be_current artifact, and the one that rotted hardest. On 2026-09-08 it
          omitted the checker entirely; on 2026-09-09 it still called the session-start script
          "planned", said it writes status.json, and said it reads an /end stamp file that
          d-end-outcome-recorded-in-handoff had REJECTED — a rejected design documented as
          live, beside working code.

  - id: conventions
    path: "docs/CONVENTIONS.md"
    write_discipline: rewrite_only
    tier: 1
    required_from_stage: build
    layer: core
    answers: "What formats and vocabulary does this project use?"
    audience: both
    form: md
    structure:
      required_sections: ["Naming"]
      recommended_sections:
        ["File format", "Language", "Logging", "Testing", "No hardcoded values",
         "Append-only", "Vocabulary"]
      section_aliases:
        "Naming": ["App naming", "Naming rules"]
      notes: >
        Required in the core set: the evidence shows the five are adopted as a unit, and
        splitting them risks breaking the habit that made them stick. Where a project has no
        rules of its own beyond the global ones, this file should say exactly that in one
        line rather than sit empty — an explicit "nothing project-specific" is a real answer
        and passes; an empty file does not.
    tests:
      - level: exists
        rule: file_present
      - level: populated
        rule: required_sections
      - level: populated
        rule: no_empty_sections
      - level: fresh
        rule: as_of_present

  - id: decisions
    path: "docs/DECISIONS.yaml"
    write_discipline: append_only
    tier: 1
    required_from_stage: build
    layer: core
    answers: "What is settled, and must not be re-litigated?"
    audience: both
    form: yaml
    structure:
      top_level_key: decisions
      append_only: true
      entry:
        required_keys: [id, date, decision]
        recommended_keys: [title, context, rationale, consequences, status]
        provenance_keys:
          # From api.pdf, where `proposed_by` alone appears 34 times. Records WHO settled a
          # thing, so a later session can tell a user ruling from an agent proposal.
          - proposed_by
          - confirmed_by_user
          - stated_by_user
        lifecycle_keys:
          - supersedes
          - superseded_by
          - revisit_when       # the ONLY sanctioned way to reopen a settled decision
          - reconstructed      # true = rebuilt from code, not a contemporaneous record
          - superseded_advice  # an agent proposal since retracted, kept so it is not re-floated
      correction_discipline: >
        Never edit a past entry. Append a dated correction block to it instead
        (e.g. `measured_reality_2026_08_04:`). This applies append-only WITHIN an entry, and
        is already practiced in two sampled projects.
      staging_area:
        rule: >
          Unsettled proposals do not belong in DECISIONS. They go in a declared staging file
          (CONCERNS.yaml) or an `open:` section. Two projects invented this independently —
          convergent invention, so it is canonized rather than left to taste.
        canonical_path: "docs/CONCERNS.yaml"
        tier: 2
    tests:
      - level: exists
        rule: file_present
      - level: populated
        rule: min_entries
        value: 1
      - level: populated
        rule: entry_required_keys
      - level: populated
        rule: unique_ids
      - level: integrity
        rule: append_only_preserved
      - level: integrity
        rule: no_dangling_supersedes
        means: "Every `supersedes` / `superseded_by` id resolves to an entry in this file."
      - level: fresh
        rule: as_of_present

  - id: roadmap
    path: "docs/ROADMAP.yaml"
    write_discipline: mixed
    tier: 1
    required_from_stage: spec
    layer: core
    answers: "What is next, what is deferred, and how do I restart cold?"
    audience: both
    form: yaml
    structure:
      required_keys: [inception, current_state, near_term, if_revisiting_cold]
      recommended_keys: [mid_term, long_term, deferred_deliberately, milestones]
      forbidden_keys:
        blockers: >
          Deleted 2026-09-07. Every CONCERNS entry carries a `blocks:` field naming what it
          blocks, by id. A second list here was duplication without ids, and it sat empty.
        open_questions: >
          Moved to CONCERNS.yaml, the declared staging area. A roadmap holding open questions
          makes them look scheduled.
      ownership:
        current_state: >
          OWNED here. README carries a one-line mirror — NO LONGER TESTED, since
          claims_match_stage was removed on 2026-09-08 and nothing replaced it; HANDOFF
          references it and must not restate it. Four files claiming current state was the
          measured condition on 2026-09-07 and it is how a README ends up asserting "no
          extension code yet" over a running extension.
        deferred_vs_non_goals: >
          `deferred_deliberately` means "yes, later". MISSION `non_goals` means "never". They
          are not the same list and an item in the wrong one silently changes the answer to
          "should we do this?".
      key_aliases:
        current_state: [current_stage]
        near_term: [next_up, milestones]
        if_revisiting_cold:
          # CANONIZED. This concept was present in every sampled project under FIVE
          # different names — the single largest naming divergence in the corpus. Universal
          # in practice, nameless in the spec, therefore uncheckable.
          - what_to_do_if_revisiting_cold
          - revisiting_cold
          - cold_restart_checklist
      near_term_item:
        required_keys: [id, what]
        recommended_keys: [why, mode, est_minutes]
        notes: "`mode` and `est_minutes` feed portfolio scheduling; see out_of_scope."
      if_revisiting_cold_shape: >
        An ordered list of imperative strings, conventionally ending with a
        "do NOT re-litigate X" line.
      mixed_discipline:
        write_once_parts: [inception]
        rewrite_only_parts: [current_state, near_term, mid_term, long_term, deferred_deliberately, if_revisiting_cold]
        append_only_parts: [milestones]
      inception:
        set: "once, at project birth"
        never: "edited, reordered, or tidied — not even to fix a name that later changed"
        required_keys: [date, goal]
        recommended_keys: [origin, first_near_term, first_mid_term, first_long_term, known_unbuilt_at_inception]
        why: >
          current_state is rewrite-only, so the project's original intent is destroyed the
          first time the roadmap is adjusted. Without a frozen baseline there is nothing to
          compare a milestone against, and drift-from-original is the one thing a LOG cannot
          reconstruct — the log says what happened, never what was intended before it changed.
        re_agreement: >
          If the plan is genuinely re-agreed rather than adjusted, that is a DECISIONS entry.
          It is never an edit to this block. A superseded intent stays readable.
        not_the_same_as_plan_copy: >
          PLAN-*.md is an ARCHIVE: tooling copies whatever ~/.claude/plans produced for one
          piece of work, many times over a project's life. `inception` is the project's own
          founding intent, written once, in the project's own words. Different origin,
          different scope, different count.
      completion_rule: >
        A finished near_term item is DELETED from near_term, never marked done in place and
        never left to accumulate. Closing it appends ONE entry to `milestones`. The item stops
        being a plan and becomes a fact, and it changes section rather than growing a status
        field.
      two_grains_of_history: >
        LOG.md and `milestones` are not duplicates, they are different resolutions of the same
        past. LOG records every choice and every implementation step, at session granularity —
        1808 entries across 50 projects. `milestones` records only what a near_term item
        DELIVERED, at development granularity. The log answers "what happened on the 7th";
        milestones answers "what has this project actually shipped". Neither can be derived
        from the other cheaply: the log is too fine to skim, and milestones are too coarse to
        debug from.
      milestone_entry:
        required_keys: [id, what, closed]
        recommended_keys: [log_ref, note]
        notes: >
          `id` is the near_term id it closes, which is what makes the deletion traceable.
          `closed` is a date. `log_ref` is the LOG.md timestamp carrying the detail.
      not_a_timeline: >
        `milestones` is a flat append-only list and must stay one. It is NOT lanes, nodes,
        edges, branches, progress or slippages — that is EVOLUTION.yaml, it renders a
        timeline, it answers a scheduling question, and it belongs to project-tracker. This
        is the nearest point at which Rite could drift into that product by accident, so the
        boundary is stated at the point of temptation rather than only in DECISIONS. See
        out_of_scope `evolution` and d-evolution-out-of-scope.
    tests:
      - level: exists
        rule: file_present
      - level: populated
        rule: required_keys_present
      - level: populated
        rule: min_list_items
        key: if_revisiting_cold
        value: 2
      - level: populated
        rule: inception_present
        means: "A project with no recorded founding intent has no baseline; drift is unmeasurable from the first edit."
      - level: integrity
        rule: inception_unchanged
        means: >
          The `inception` block is byte-identical to its first committed form. This is the
          write-once zone of a mixed file, and it is the one people tidy without noticing.
      - level: fresh
        rule: as_of_present
      - level: fresh
        rule: as_of_within_days_of_activity
        value: 60
        means: "A roadmap staler than the code is the most misleading file in the set."
      - level: integrity
        rule: deleted_ids_appear_in_milestones
        means: >
          Every near_term `id` present in the previous revision and absent from this one must
          appear as a `milestones` entry. This is what makes deletion safe rather than lossy —
          the item is not erased, it is promoted.
      - level: integrity
        rule: milestones_append_only
        means: "The append-only half of a mixed file. Existing entries stay byte-identical."
      - level: integrity
        rule: no_done_markers
        means: >
          A near_term item carrying done/completed/finished status is a rewrite-only file
          being used as an append-only one. Delete it and log it instead.
      - level: populated
        rule: claims_declared
      - level: integrity
        rule: claims_match_filesystem
        means: >
          ROADMAP owns `current_state`, so it owns the project's most consequential claim about
          its own tree — and on 2026-09-09 that claim read "Still NO hooks, commands or skills.
          Not a git repo." against a running plugin in a repo with ten commits. The claims block
          is what makes the sentence testable; the sentence itself stays prose.

  - id: handoff
    path: "HANDOFF.md"
    write_discipline: write_once
    tier: 0
    required_from_stage: idea
    layer: core
    answers: "What must the next session know that the docs do not say?"
    audience: agent
    form: md
    structure:
      genres:
        # Three distinct shapes found in the corpus. The standard names them rather than
        # forcing one, because they serve different situations.
        - id: state
          means: "Where things stand mid-work. Sections: pick up here, what is running, traps, deliberately not done."
        - id: prompt
          means: "A literal copy-paste block to open the next session with, plus commentary outside it."
        - id: task_brief
          means: "A scoped assignment: goal, parts, definition of done, already-settled list."
        - id: none
          means: >
            An explicit statement that there is nothing to hand off, and why — work closed
            cleanly, or the next step is fully described by ROADMAP near_term. This is a REAL
            answer and it passes. It is not the absence of a handoff; it is the assertion that
            none is needed, made by someone who considered the question.
      required_frontmatter:
        genre: "one of the ids above"
        written: "YYYY-MM-DD"
        expires: "YYYY-MM-DD — a DATE, always. Required."
        status: "live | spent"
        session_end: "written | updated | carried_forward | none — the outcome the closing session recorded"
      session_end_rule:
        mandatory: true
        means: >
          The FILE always exists — tier 0, from the first session onward. Every session must
          end having recorded one of four outcomes. "Nobody thought about it" is not one of
          them, and is the failure this rule exists to catch.
        recorded_in: >
          This file's own front matter, as `session_end: <outcome>` alongside `written:`. There
          is deliberately NO separate stamp file — /end is a process, and its result belongs in
          the artifact the process is about.
        outcomes:
          written: "A new handoff replaces the previous one."
          updated: "The live handoff is superseded by a rewritten one covering this session too."
          carried_forward: "The live handoff still holds, unchanged, deliberately — recorded as a decision, not as silence."
          none: "genre `none` — an explicit written statement that there is nothing to hand off."
        explicit_nothing_beats_absent: >
          A handoff saying "nothing to hand off" and a missing handoff look identical from the
          next session's side, except one proves somebody decided and the other proves nothing.
          Same principle as CONVENTIONS, where an explicit "nothing project-specific" passes
          and an empty file does not. It is a general rule of this standard, stated twice
          because it is the one people talk themselves out of.
        read_at_session_start: >
          A live handoff MUST be surfaced at session start, before any work. An expired or
          spent one must fail loudly and name the file rather than being quietly ignored.
        note: >
          This is a SESSION-PROTOCOL requirement stated here because it constrains the
          artifact. It is the first hard requirement of Rite's second half, and it came from
          the user, not from this spec.
      expires_must_be_a_date:
        rule: >
          `expires` is ALWAYS a date. A condition may accompany it in prose — "when the checker
          runs, or 2026-12-07, whichever comes first" — but the date is what the check reads and
          it is never optional.
        why: >
          The spec previously permitted "a date OR a condition", and a condition is not
          machine-evaluable, which alone made not_expired unimplementable. It was a rule looser
          than anybody's actual practice: every handoff written in this project carries both,
          and MEASURED across the sampled corpus, no HANDOFF carried any expiry marker at all.
          Narrowing it to match what people already do costs nothing and makes the test run.
        changed: "2026-09-08 — narrowing only. Nothing that existed becomes invalid."
      expiry_rule: >
        MANDATORY, and the clearest gap this standard closes. No HANDOFF in the entire
        sampled corpus carried any expiry, spent, consumed or valid_until marker. The failure
        is live today: claude-persistent/HANDOFF.md is described as "spent" in a sibling file
        and still sits in the project root reading as authoritative. A spent handoff is worse
        than no handoff, because it is confidently wrong.
    tests:
      - level: exists
        rule: file_present
      - level: populated
        rule: required_frontmatter_present
      - level: fresh
        rule: not_expired
        means: "status:spent or a past `expires` date must fail, loudly, and name the file."
        implementable: true
      - level: integrity
        rule: session_end_decision_recorded
        means: >
          The last session closed with one of the four outcomes, declared in this file's own
          front matter as `session_end`. NO separate stamp file: the outcome is recorded here,
          by user ruling on 2026-09-07, specifically to avoid inventing a file for it.
      - level: integrity
        rule: written_not_older_than_newest_log_entry
        scope: session
        scope_why: >
          THE ONLY TEST WHOSE VERDICT DEPENDS ON WHETHER THE CURRENT SESSION HAS CLOSED, and
          therefore the only one that is RED by design for the whole working life of a session.
          The protocol tells you to log as work happens; the first entry written makes this
          test fail, and nothing clears it but /end. That is correct at SessionStart, where the
          question asked is "did the last session close?" — and wrong in CI, which runs at
          whatever arbitrary mid-session moment someone pushes. A gate that is red by design
          most of the time is the gate that gets switched off, so CI excludes this scope with
          --exclude-scope=session. Excluded is NOT silent: it reports NA naming the exclusion,
          because a check that vanished and a check that passed must never look alike.
          Added 2026-09-10 after CI went red on a genuinely open session. See
          d-session-scope-excluded-from-ci.
        means: >
          This is what makes the previous test real without a stamp. A session that worked and
          then closed without touching the handoff leaves `written:` older than the newest
          LOG.md entry — detectable from two files that already exist. "Nobody thought about
          it" and "someone decided none was needed" are no longer indistinguishable: the first
          leaves a stale date, the second leaves a current one saying so.

  - id: plan_copy
    path: "docs/PLAN-YYYY-MM-DD-<slug>.md"
    write_discipline: write_once
    tier: 2
    layer: core
    answers: "What was the agreed plan for a piece of work?"
    audience: both
    form: md
    structure:
      canonical_name: "PLAN-<ISO date>-<kebab slug>.md"
      source: "~/.claude/plans/*.md"
      notes: >
        Plans are written outside the project, in a directory the workspace cannot see, under
        harness-generated names carrying no project attribution
        (e.g. cheeky-seeking-clock.md). They are lost when the session ends unless copied.
        Two of eight plans on this machine had been manually renamed to add the project —
        a workaround for exactly this gap.
      attribution_problem: >
        Memory directories encode the project in their path; the plans directory does not.
        Recovering plan -> project therefore needs mtime/session correlation or content
        inspection. This is the only genuinely hard part of automating the copy.
    tests:
      - level: exists
        rule: optional
      - level: populated
        rule: filename_matches_canonical
      - level: fresh
        rule: source_plans_all_copied
        means: "A plan in ~/.claude/plans attributable to this project with no copy here fails."

  - id: concerns
    path: "docs/CONCERNS.yaml"
    write_discipline: mixed
    tier: 2
    layer: core
    answers: "What is proposed or worrying but NOT yet settled?"
    audience: both
    form: yaml
    structure:
      top_level_keys: [concerns, retired_ids]
      entry:
        required_keys: [id, title, status]
        recommended_keys: [severity, what, blocks, proposal, opened]
      notes: >
        The staging area that keeps DECISIONS honest. Without it, unsettled proposals either
        pollute DECISIONS (and get treated as settled) or vanish.
    tests:
      - level: exists
        rule: optional
      - level: populated
        rule: entry_required_keys
      - level: populated
        rule: unique_ids

  - id: license
    path: "LICENSE"
    write_discipline: write_once
    tier: 2
    form: text
    layer: core
    answers: "Under what terms may this be used?"
    audience: human
    required_from_stage: shipped
    structure:
      verbatim: true
      no_provenance_header: >
        The ONLY artifact that must NOT carry schema_version/as_of/status. A license is
        third-party text reproduced exactly; editing it — including to add a header — changes
        its legal meaning and can invalidate it. The exception is stated here rather than left
        to judgement, because every other file in the standard requires the header.
      notes: >
        Tier 2 rather than tier 0 because most tracked projects are private and never publish.
        It becomes required at stage `shipped`, which means a project that publishes without
        one FAILS — visibly, by design. Rite itself currently fails this check, and that is
        left visible rather than papered over.
      freeze_point: "at license choice. Re-licensing is a DECISIONS entry plus new file content, never an edit."
    tests:
      # `rule: required_from_stage` was REMOVED here on 2026-09-10, as a consolidation rather
      # than a loss. The engine now gates every artifact on required_from_stage, so file_present
      # already reports "not required before stage shipped" — this test asserted the same fact
      # a second time, in a second place, which is how two sources of truth begin. Same
      # reasoning as d-drop-claims-match-stage.
      - level: exists
        rule: file_present
      - level: populated
        rule: min_lines
        value: 5
      - level: integrity
        rule: no_provenance_header
        means: "A provenance header in LICENSE is a defect, not a compliance win."

  - id: memory_mirror
    path: "docs/claude-memory.md"
    write_discipline: free_replace
    tier: 3
    layer: local
    answers: "What does the agent durably remember about this project?"
    audience: human
    form: md
    structure:
      generated_by: "claude-mirror-memory.py (PostToolUse hook)"
      read_only: true
      cardinality: single_file
      why_single_file: >
        One file, never a directory of them, even though the SOURCE is one file per memory.
        A mirror is not a source: fanning it out doubles the sync surface, because deletions
        must then be reconciled and an orphaned mirror file is a lie that still reads as
        truth. One file is one atomic write that cannot half-fail, and the audit use — "what
        does the agent remember about this project" — is read end to end. Contrast PLAN
        copies, which ARE many files, because each is a frozen dated snapshot rather than a
        live mirror. Cardinality follows write discipline: free_replace -> one file,
        write_once -> many.
      notes: >
        Functional source stays in ~/.claude/projects/<slug>/memory/. This mirror exists
        because a workspace rooted at the project cannot reach ~/.claude, which makes agent
        memory unauditable from the repo. Edits here do not propagate back.
    tests:
      - level: exists
        rule: optional
      - level: fresh
        rule: mirror_not_stale
        means: "Newest memory file newer than the mirror's last sync fails."

# ── explicitly out of scope ──────────────────────────────────────────────────
# Named boundaries, so a later session does not re-litigate them.
out_of_scope:
  - id: evolution
    artifact: "docs/*-EVOLUTION.yaml"
    owner: project-tracker
    why: >
      It answers "what can I tackle tonight?" — a portfolio and scheduling question, not
      "what must an agent know before touching this project?". Its schema confirms it:
      lanes, nodes, edges, branches, progress, slippages is a timeline-renderer format.
      It is the only file in the corpus with a fully declared schema and it belongs to a
      different product. Rite neither requires, folds, nor renames it.
    note: >
      Its `vocabulary:` enum block stays with project-tracker too. Rite defines its own
      stage_vocabulary above precisely so tiering does not depend on a registry a stranger
      will not have.
  - id: portfolio_registry
    artifact: "projects.yaml, next-steps.yaml, show-portfolio, seed-projects"
    owner: project-tracker
    status: "out — revisitable"
    why: >
      project-tracker answers "what should I touch tonight?" — cross-project scheduling,
      ranked by cognitive mode rather than difficulty. Rite answers "did this session close
      properly?" for ONE project. Different questions, different scopes, different lifetimes.
      A per-project standard cannot depend on a cross-project registry a stranger will not have.
    future: >
      Integration is possible but NOT assumed, and must not be arrived at incrementally.
      It requires its own dedicated session. Until then Rite reads the registry only as
      optional auto-detected enrichment and never requires, writes, or reshapes it.

  - id: self_profiling
    artifact: "ai-collab-profile/, ai-collab-interaction/, prompts.db, prompts-corpus.jsonl"
    owner: "Costin — personal"
    status: "out — permanently"
    why: >
      A longitudinal profile of how Costin works with Claude: 4864 prompts, 462 sessions,
      2.72M characters of his own words. It is a THIRD goal, distinct from both scheduling
      and session discipline, and it is his alone.
    rule: >
      Rite must NEVER read, ingest, derive from, or ship anything from this corpus. Not as a
      feature, not as enrichment, not as an optional auto-detected layer, not as an example
      in documentation. This is a privacy boundary on personal data, not a scoping preference,
      and it does not soften because Rite is published. If a future feature would benefit from
      session-behaviour data, it is refused, not negotiated.
  - id: session_protocol
    why: >
      The session start/end protocol is Rite's companion piece and gets its own spec.
      This document defines the TARGET STATE; the protocol defines when it is written.

# ── local layer (configurable; not part of the public standard) ──────────────
local:
  docs_dir:
    default: "docs"
    alternatives: ["docs-yaml", "doc", "documentation"]
    note: >
      Format-neutral by rule. A directory named for a file format becomes a false claim the
      moment one file inside it changes form — the exact class of stale statement Rite exists
      to catch. Renamed docs-yaml -> docs on 2026-09-07 for that reason.
  log_line_format:
    format: "DD-MM-YYYY HH:MM[:SS] | DDD | <short_name> | [TYPE] <description>"
    seconds: >
      OPTIONAL, added 2026-09-08. Additive rather than a migration: minute-precision entries
      remain valid and are re-emitted byte-identically, so no append-only exception is needed.
      Parsers must accept both forms and PRESERVE the precision they read — re-emitting a
      minute entry with :00 would be a mass rewrite of 1800+ append-only lines.
    why_seconds: >
      The previous convention required entries from one session to be at least a minute apart,
      which mandates inventing spacing whenever several things happen in the same minute. That
      rule produced roughly thirty fabricated timestamps on 2026-09-07. Seconds let entries be
      simply true, so the spacing rule was deleted rather than obeyed.
    date_order: "European — deliberate, matches locale"
    day_of_week: "English 3-letter, fixed width, locale-independent"
    generation_warning: >
      System locale is ro_RO; `date +%a` emits 'Jo', 'Lun'. Force English with LC_ALL=C.
    tag_vocabulary: [work, note, fix, decide, pivot, add, defer, drop, done]
  registry:
    source: "~/projects/project-tracker/projects.yaml"
    provides: [stage, status, short_name, group]
    absent_behavior: "stage falls back to inference; registry-dependent checks skip"
  timestamp_discipline: >
    Always the machine clock, read PER ENTRY — never extrapolated from an earlier reading.
    Never invent, round, or approximate. There is no minimum spacing: entries carry the time
    they were written even when several share a second, and ties are broken by file order.
