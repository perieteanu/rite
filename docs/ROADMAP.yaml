  - id: claim-surface
    what: "claims_match_filesystem implemented via a declared claim surface; c-unimplementable-tests reaches zero"
    closed: "2026-09-09"
    log_ref: "09-09-2026 23:13:08"
    note: >
      Not a near_term item — it came out of deferred_deliberately, where it had sat since
      2026-09-08 as "Machine-readable doc claims". Recorded here anyway, on the same footing as
      project-standard-written, because milestones is the coarse record of what this project
      delivered and leaving this out would misrepresent the week.
      The find that reshaped it: the rule had been declared on CLAUDE.md ALONE, so none of the
      four doc-rot failures of 08-09/09-09 could have been caught even with it fully
      implemented. Verified retrospectively against the tree at 71edd82.
      Its declared limit demonstrated itself within the hour: the claims block passed GREEN
      while every number in current_state was stale. It checks paths, not counts.

  - id: ci-runs-the-gates
    what: "main pushed to a private remote; CI runs the seven gates and reports its own coverage"
    closed: "2026-09-10"
    log_ref: "10-09-2026"
    note: >
      Not a near_term item — near_term was empty by design, and this came from the HANDOFF's
      recommendation rather than from a queue. Recorded here on the same footing as
      claim-surface, because milestones is the coarse record of what this project delivered.
      The gate count was WRONG in every document that stated it: six was the number everyone
      repeated, including the handoff, while rite-check.py against this project has been a
      seventh gate all along and is the one that catches doc rot.
      Two predictions were written before running and both held. The claim surface fired the
      moment .github/workflows existed, naming FOUR files — the handoff had said three, so the
      correction was proved by the checker rather than argued. And the runner's first real run
      exited 1 on a genuine failure, which is better evidence than the planted break the plan
      had scheduled; the planted test was dropped as redundant.
      Deliberately narrow, by Costin's call: ubuntu only and no PyYAML in CI. Two of seven
      gates therefore skip on a runner, and the runner says so on every run instead of showing
      an unqualified green.

  - id: ci-portability-matrix
    what: "The gates run on ubuntu, macos and windows; a fourth portability rule came out of it"
    closed: "2026-09-10"
    log_ref: "10-09-2026"
    note: >
      Costin put this ahead of setup-hook-scaffolding, and the ordering was vindicated within
      the hour. Until today the only machine that had ever run Rite was one Linux laptop, and
      the spec had asserted [linux, macos, windows] with three severity:correctness rules that
      nothing tested.
      BOTH outcomes were worth having. macOS passed first time — the first EVIDENCE that
      case_sensitive_name_matching holds on a case-insensitive filesystem rather than a claim
      that it should. Windows failed first time, on a real bug: entry points wrote `·` and `—`
      in the console codepage, so a parent decoding with encoding="utf-8" died on byte 0x97
      (cp1252's em dash) and TWO gates were reported FAIL for a fault in neither.
      The prediction written beforehand was directionally right and mechanically backwards —
      UnicodeEncodeError was expected, UnicodeDecodeError happened — which is the argument for
      writing predictions down: a vague expectation would have been scored as correct.
      It exposed a hole in the standard, not just in the code: the portability rules covered
      FILES and said nothing about PIPES. process_output_declares_encoding is the fourth rule,
      with one implementation in ritefs.use_utf8_stdio() and nine callers.
      Two claims of mine were corrected in the process. The hook's JSON was never at risk —
      json.dump escapes non-ASCII by default — and the quieter defect found while checking that
      is the more dangerous one: a parent matching the literal "checks ·" after a locale decode
      works by coincidence on cp1252 and silently drops the line on cp437, an absence that
      reads as a pass.
      hooks/rite.ps1 executed for the first time anywhere, and passed.

  - id: setup-hook-scaffolding
    what: "template/ seed set plus /rite:init, so adopting Rite opens on green instead of RED"
    closed: "2026-09-10"
    log_ref: "10-09-2026"
    note: >
      Both halves landed the same day, and the first half made the second small. The
      stage->requirement mapping — the part recorded as "STILL NOT SPECIFIED" and the reason
      this item was not small — became d-stage-is-the-gating-axis, taking a day-one project from
      9 RED to 2. The seed set then only had to reach those two.
      /rite:init writes exactly three files and REFUSES to write more, which is the design
      rather than a limitation: `idea` is the only stage a machine can satisfy honestly, because
      a log with one true entry and a genre:none handoff are finished documents, while a seeded
      MISSION.md is a lie that passes file_present. d-scaffold-only-what-can-be-honest.
      The deliverable as originally written asked for "seeded docs/" — that was dropped
      deliberately, not overlooked.
      Its completion test could not live where the requirement was written: template/LOG.md is
      not at a canonical path, so the checker never sees it. scripts/test-scaffold.py scaffolds
      into a temp directory and checks the RESULT, and it failed on its first run — the original
      template carried a prose preamble that entries_parse counted as nine broken entries, so
      every project Rite seeded would have opened on a YELLOW of Rite's own making.

  - id: readme-for-a-stranger
    what: "README rewritten for someone who is not us, and the report made readable while doing it"
    closed: "2026-09-10"
    log_ref: "10-09-2026 10:23:52"
    note: >
      It now leads with what Rite DOES rather than what the repository contains: a real sample
      verdict, install commands verified against the shipped binary rather than recalled, the
      stage table so a newcomer sees two files asked of them instead of thirteen, and an Honest
      limits section naming the Claude-Code-only constraint, the uncalibrated freshness windows
      and the seven unimplemented tests.
      THE VALUABLE PART WAS A DEFECT IT EXPOSED. Writing an honest example meant generating real
      output instead of a plausible one, and the real output was 54 lines conveying ONE finding
      — 46 of them "not required before stage X". Stage gating had taken RED from 9 to 0 and
      replaced it with a wall of NA, which is half a fix by the standard d-stage-gates-the-
      standard sets. Collapsed to 15 lines, counted and named rather than dropped.
      A fabricated example would have shown the tidy output I imagined and the defect would have
      shipped. That is the whole argument for evidence over assertion, landing on its author.

near_term:
  label: "The ordered path from PRIVATE to PUBLIC"
  # Filled 2026-09-10, having been empty on purpose since 2026-09-09. It is not a queue of
  # whatever came to hand: it is the sequence that decides what a stranger meets, ordered by
  # WHAT BREAKS WHEN SOMEONE WHO IS NOT THE AUTHOR ARRIVES, not by effort. Publishing itself is
  # one setting on a repository; everything above it is what makes that setting defensible.
  # Order chosen by Costin 2026-09-10, matrix before scaffolding.
  candidates:
    - id: publish-github
      what: "Flip the repository to public"
      why: "MOVED FROM mid_term. One setting. Everything above exists to make it defensible."
      unblocked_2026_09_10: >
        BOTH blockers are settled and neither needed code beyond a check.
        c-standard-version-policy is retired as settled by
        d-standard-version-declared-never-honoured: a project may declare standard_version, a
        mismatch is YELLOW, and Rite never runs an old rule set.
        The stage question is settled by d-stage-advances-when-the-repo-goes-public: stage moves
        to `shipped` in the SAME commit that flips visibility, which is exactly when the LICENSE
        check should fire. So the publishing commit is not a one-line visibility change — it
        also advances the stage and turns that check live.
      still_needs: "readme-for-a-stranger, above. setup-hook-scaffolding closed 2026-09-10."
      checklist: >
        THE PUBLISHING COMMIT DOES THREE THINGS AT ONCE, and writing them down is the point of
        this block — none is hard, and any one of them forgotten is embarrassing in public.
        1. Flip the repository to public. That is the only irreversible half: main is published
        in FULL, LOG.md included, per d-publish-main-in-full-no-export.
        2. Set `stage: shipped` in .rite.yaml, in the SAME commit —
        d-stage-advances-when-the-repo-goes-public. Not before, because declaring `shipped`
        while private would be lying to our own checker.
        3. Which turns the LICENSE check LIVE, since LICENSE is required_from_stage: shipped.
        It currently reports NA. Confirm it goes GREEN and not RED before pushing.
        Then: re-run the gates, and expect CI to go green on a public repo with unmetered
        Actions minutes — which is when ci-portability-matrix stops costing anything.
      before_you_flip: >
        Both blockers are settled (above) and the scaffolding exists. What remains is
        readme-for-a-stranger: the README still reads as notes between author and agent and no
        line tells anyone how to add the marketplace. That is the first thing a visitor meets.
      free_upside: "Actions minutes are unmetered on public repositories, so ci-portability-matrix gets cheaper the moment this happens."

mid_term:
  # ci-portability-matrix, setup-hook-scaffolding and publish-github were MOVED to near_term on
  # 2026-09-10 as the ordered path to public. They are not listed twice.

  # ── the continuous layer (accepted 2026-09-08; see d-continuous-watcher-layer) ──
  - id: watcher-write-discipline
    what: "PostToolUse watcher on Write|Edit — flag any change to an existing line in an append-only file"
    why: >
      100% hit rate on this project's own real failures: a milestones entry inserted mid-list,
      and ~30 LOG entries with extrapolated timestamps. It is also the only home for
      c-log-timestamps-must-be-machine-read, whose check has nowhere to run today.
    mechanism: "JSON stdout with additionalContext — plain text is discarded on tool events"
    must: "silent on success; it injects into Claude's context on every write"
  - id: watcher-precompact-distiller
    what: "Distil the log at PreCompact, before context is compacted away"
    why: >
      The highest-value moment in a session: the project's founding measurement — whatever is
      not distilled is gone — happening INSIDE a session rather than between them.
    unverified: "needs hook type prompt or agent, since distilling is judgement. Not yet confirmed for this event."
  - id: watcher-plan-copy-on-create
    what: "Copy a plan the moment it appears in ~/.claude/plans, via FileChanged"
    why: >
      CLOSES c-plan-attribution. That problem is only hard retroactively — a plan copied at
      creation belongs to the project the session is in. Attribution by timing, not by content
      inspection.
    unverified: "that FileChanged watches paths outside the project root"
    user_note: "accepted conditionally — will be tested before it is trusted"
  - id: watcher-unlogged-change
    what: "Flag material change with no LOG entry — files written since the last entry"
    why: >
      The user's 'distil after 3 prompts' idea with a trigger that carries information. A prompt
      count is a clock in disguise; unlogged file writes are a real discrepancy.
  - id: session-metrics-from-transcript
    what: "Derive tokens, duration, message and tool counts from transcript_path"
    why: >
      Free and exact — the hook receives transcript_path on stdin and every message carries
      usage. Measured live on 2026-09-08: 558K output, 77M cache-read, 951 messages, no API
      call. The strongest argument for the claude-persistent port.
  - id: watcher-cwd-changed
    what: "Flag a mid-session project switch via CwdChanged"
    why: "Rite assumes one project per session and has never said so. Cheap, and it makes an unstated assumption visible."
  - id: status-json-as-flag-accumulator
    what: "Give status.json a purpose: hold watcher flags between firings"
    why: "A continuous watcher needs somewhere to accumulate. May be what resolves the deferral in the inventory block."
    condition: "ONLY if the purpose proves itself in use. Deferred until then, by the user's call."

  - id: port-preflight
    what: "Port preflight.py into Rite as the engine; reduce ~/projects/claude-preflight to a checks.yaml"
    why: "744 proven lines. The generalisation is mostly done — the machine-specific checks are already toggles."
  - id: port-mirror-memory
    what: "Port claude-mirror-memory.py; extend the same tool to plan copying"
    why: "Plans are the identical problem with a different source dir. One tool, not two."
  - id: plugin-packaging
    what: ".claude-plugin/marketplace.json at repo root, plugins/ layout, LICENSE, git init"
long_term:
  - id: vscode-viewer
    what: "Revive claude-persistent's extension as the optional persistent surface"
    why: "Only after the plugin ships and works alone. It is the upgrade, never the entry point."
  - id: official-marketplace
    what: "Submit to anthropics/claude-plugins-official external_plugins/"
    why: "Quality-gated, and a far better CV line than a self-hosted repo."

deferred_deliberately:
  - what: "Stale-on-touch — flag docs whose as_of predates a source change"
    why: >
