      genuinely hard part", proposing mtime correlation or content inspection. Session
      transcripts record a plan as a TOOL INPUT, so authorship is exact and neither was needed.
      THE FIRST ATTRIBUTOR WAS STILL WRONG, and that is the part worth remembering. Matching the
      plan's path as a string mis-attributed five of thirteen plans, because the session BUILDING
      it had run `ls ~/.claude/plans/` and its transcript therefore mentioned every plan on the
      machine. The act of measuring changed what was measured, and it was caught only because
      the numbers disagreed with a shell measurement taken twenty minutes earlier.
      THREE MORE DECLARED TESTS ARE NOW IMPLEMENTED — filename_matches_canonical,
      source_plans_all_copied and mirror_not_stale — taking coverage from 57 of 64 to 61 of 66,
      and all three were proved to FAIL before being trusted. Two of them were UNREACHABLE
      rather than merely unwritten until path_pattern existed, which is why
      c-pattern-paths-are-matched-literally had to be settled first.
      The memory port is byte-compatible with the script it replaces: regenerated output differs
      from the global hook's only in the clock. The global hook is deliberately left running
      beside it until the port is proven.

  - id: plugin-packaging
    what: ".claude-plugin/ manifests, LICENSE and a git repo — the plugin is installable and advertises itself"
    closed: "2026-09-10"
    log_ref: "10-09-2026"
    note: >
      CLOSED RETROSPECTIVELY, and that is the finding rather than the work. Every deliverable it
      named — marketplace.json at the repo root, plugin.json, LICENSE, git init — has existed
      since 2026-09-08, and the item sat in mid_term for two days while the project it described
      was published, ported and gated. Nobody looked.
      It was found by /rite:update's step 3, which asks whether anything actually finished, on
      the checkpoint command's first real run. That is the step most likely to be a no-op and it
      was not one — which is the argument for executing a step rather than reasoning about
      whether it applies.
      The "plugins/ layout" clause of the deliverable was never needed: Rite is one plugin at
      its own root advertising itself with `"source": "."`, and the plugins/ subdirectory form
      is for a marketplace listing OTHER repositories. Dropped as misconceived, not as skipped.

  - id: port-preflight
    what: "The session POST becomes Rite's engine; preflight becomes a config, with `command:` checks for the personal ones"
    closed: "2026-09-10"
    log_ref: "10-09-2026"
    note: >
      d-preflight-is-config-not-fork settled the shape on 2026-09-07 and it waited three days.
      A PORT, not a reimplementation: check bodies carried verbatim, the transformation surgical
      — swap PyYAML for riteyaml, name every encoding, guard /proc and df, drop what is
      superseded. Eleven checks ship; three do not, and each has a reason recorded beside the
      registry so a later session does not restore them as omissions.
      THE ONE PLAUSIBLE BLOCKER WAS GONE BEFORE STARTING: riteyaml already parsed the real
      checks.yaml identically to PyYAML, verified with PyYAML as oracle. And 748 lines contained
      exactly THREE machine-specific literals, so the decision's claim that the generalisation
      had happened accidentally held up.
      `command:` checks are what make the 2026-09-07 decision executable rather than aspirational
      — without them tracker_registered forces project-tracker's file format into the published
      engine. Proved both ways: exit 2 gives RED with the detail line, a missing command gives
      YELLOW and no traceback.
      TWO GATES CORRECTED THE WORK WHILE IT HAPPENED. The AST rule caught a subprocess.run
      without encoding. The hook-shape gate rejected running the POST without a .rite.yaml
      marker — `participation` is not negotiable by a port — which became
      c-session-post-is-gated-by-participation rather than a quiet exception.
      Costin's preflight keeps running beside it, as the mirror does. Retiring it is his call.

  - id: watcher-write-discipline
    what: "The first of the eight watchers: append-only rewrites and future timestamps reported as they happen"
    closed: "2026-09-10"
    log_ref: "10-09-2026"
    note: >
      Chosen first of the eight because it is the only one with a MEASURED hit rate rather than
      a plausible rationale — 100% on this project's own real failures, which is what the item
      already recorded.
      It closes the gap the protocol's honest_limits named: every implemented completion test is
      an end-of-session test, so a session could rewrite an append-only file at 14:00 and the
      standard stayed green until it closed. /rite:update made the record correctable on demand;
      this makes one class of damage report itself.
      IT ALSO ABSORBED c-log-timestamps-must-be-machine-read, open since 2026-09-08 with nowhere
      for its check to run. Two items, one build, one predicate — riterules.log_future_timestamps
      is shared by the watcher and by the new no_future_timestamps rule, because two copies would
      be free to disagree about what "future" means.
      scripts/riterules.py was extracted to make that sharing possible: git_show, zone_of and
      git_removed_lines moved out of rite-check.py unchanged, so the watcher measures
      append-only violations with the same predicate the checker does.
      SILENCE ON SUCCESS IS A CONTRACT, not politeness. It fires on every Write and Edit, and a
      watcher that speaks when nothing is wrong is one the user disables within a day.

