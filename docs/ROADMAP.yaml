  - id: validate-against-real-projects
    what: "The checker run against three outside projects, with predictions written first"
    closed: "2026-09-09"
    log_ref: "09-09-2026 21:0x"
    note: >
      The standard DISCRIMINATES — claude-persistent 7 RED / 11 GREEN, hwprivacy 2 RED / 21
      GREEN, plumbing 1 RED / 20 GREEN — which was the acceptance condition. But the run's value
