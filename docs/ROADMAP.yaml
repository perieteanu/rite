  - "Run `python3 spec/render-standard.py --check` first. If it fails, someone hand-edited the generated Markdown; fix by regenerating, not by editing."
  - "Read spec/PROJECT-STANDARD.md to see the standard as a reader sees it. Edit spec/project-standard.yaml if it needs changing — never the .md."
  - "Check whether the plugin still does not exist. If hooks/ or commands/ appeared, this file is stale — trust the filesystem, not this line."
  - "Do NOT re-litigate: the name (d-name-rite), plugin-not-extension (d-plugin-is-the-product), preflight-as-config-not-fork (d-preflight-is-config-not-fork), EVOLUTION being out of scope (d-evolution-out-of-scope), or credibility-over-adoption (d-goal-is-credibility)."
  - "Do NOT re-research licensing or trademark. It is done, verdict GO: ~/projects/claude-persistent/docs-yaml/RESEARCH-licensing-delivery.yaml."
  - "The next real piece of work is the session protocol spec, not code."
