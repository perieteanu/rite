# Settled decisions. Append, never rewrite. Supersede by linking ids.
# Do NOT re-litigate anything here. Unsettled items go to CONCERNS.yaml.
---
schema_version: "1.0.0"
as_of: "2026-09-07"
status: current

decisions:

  - id: d-name-rite
    date: "2026-09-07"
    title: "Project is named Rite"
    context: >
      Needs a distinct, non-"Claude"-led mark per the trademark research. Candidates ranked:
      Cairn (rejected on sound), Waymark, Varde, Blaze, Fingerpost, HASP, CHART, LATCH.
    decision: "Rite — Record, Inspect, Track, Enforce."
    rationale:
      - "Rites are performed at thresholds, which is exactly what a session start and end are."
      - "The expansion is honest rather than reverse-engineered; each verb is a real operation."
      - "Four letters, no trademark shadow, no slang trap."
    consequences:
      - "Known cost: spoken aloud it is a homophone of right/write. Accepted."
      - "Descriptor in all listings: 'a companion for Claude Code' (nominative use)."
      - "Every listing carries: Unofficial. Not affiliated with, endorsed by, or sponsored by Anthropic."
    chosen_by_user: true
    revisit_when: "The GitHub or plugin namespace turns out to be taken."

  - id: d-plugin-is-the-product
    date: "2026-09-07"
    title: "Rite is a Claude Code plugin; the VS Code extension is an optional viewer"
    context: >
      claude-persistent was designed with the extension as the product and a plugin as its
      data source. Reviewing the built code reversed that: the extension derives everything
      real from the transcript itself, and the plugin contributed one string.
    decision: "Ship ONE plugin containing hooks, commands and skills. The extension is optional and ships later."
    rationale:
      - "A plugin cannot draw UI — but the differentiated half is the checking, not the surface."
      - "Eight incumbents already ship status-bar monitors; none have preflight behind them."
      - "A plugin installs with a git push. No registry, account, review, or fee."
    consequences:
      - "claude-persistent is demoted to optional viewer; its own docs still claim otherwise and need correcting."
      - "health-probe is dropped: verdict and source are hardcoded constants, entrypoint is redundant, transcript_path is derivable."
    proposed_by: claude
    confirmed_by_user: true

  - id: d-preflight-is-config-not-fork
    date: "2026-09-07"
    title: "claude-preflight becomes a config of Rite, never a fork"
    context: >
      preflight is 744 lines of working, months-proven code, but hardcoded to one machine
      (/mnt/storage, the psr extension, projects.yaml).
    decision: "Rite is the upstream engine. Costin's preflight shrinks to his own checks.yaml plus checks too personal to publish."
    rationale:
      - "checks.yaml already makes the machine-specific checks toggles — the generalisation work was done accidentally."
      - "One codebase means nothing to drift."
      - "Forking would recreate, in code, the exact doc-rot this project exists to catch."
    consequences:
      - "preflight keeps the right to hardcode, because it stays a config rather than becoming the product."
    proposed_by: claude
    confirmed_by_user: true

  - id: d-audience-public-standard
    date: "2026-09-07"
    title: "The standard is written for publication; local conventions become config"
    decision: "Two marked layers in one document — core (publishable) and local (this machine)."
    consequences:
      - "EU date order, [TYPE] vocabulary, short_name, registry integration and docs-yaml/ naming all move to the local layer."
      - "Rite defines its own stage vocabulary, because a stranger has no portfolio registry to borrow one from."
    chosen_by_user: true

  - id: d-evolution-out-of-scope
    date: "2026-09-07"
    title: "EVOLUTION.yaml belongs to project-tracker and is explicitly out of scope"
    context: >
      An earlier answer in the same session was to fold it into DECISIONS. The user corrected
      it: EVOLUTION answers "what can I tackle tonight?" — a scheduling question.
    decision: "Rite neither requires, folds, renames, nor checks EVOLUTION.yaml. Named as an out-of-scope boundary in the spec."
    rationale:
      - "Its schema — lanes, nodes, edges, branches, progress, slippages — is a timeline renderer."
      - "It is the only file in the corpus with a fully declared schema, and it serves a different product."
    consequences:
      - "Its vocabulary enum block stays with project-tracker; Rite defines its own stage vocabulary instead."
      - "The 8 EVOLUTION naming schemes across 12 projects are project-tracker's to fix, not Rite's."
    superseded_advice: >
      Claude initially recommended folding branches/pivots into DECISIONS entry types. Retracted
      on the user's correction. Recorded so it is not re-floated.
    stated_by_user: true

  - id: d-conventions-stays-required
    date: "2026-09-07"
    title: "CONVENTIONS.yaml stays in the required five"
    context: "Claude proposed demoting it to 'earned' to avoid ceremonial empty files."
    decision: "Keep all five as one required unit."
    rationale:
      - "The evidence shows the five are adopted all-or-nothing, never partially; splitting risks breaking the habit."
    consequences:
      - "Mitigation: a project with no rules of its own must SAY so in one line. An explicit 'nothing project-specific' passes; an empty file does not."
    chosen_by_user: true

  - id: d-noncode-first-class
    date: "2026-09-07"
    title: "Non-code projects are first-class in the standard"
    decision: "The standard covers any tracked project — a plumbing schematic as readily as a Rust codebase."
    rationale:
      - "plumbing, plan-evacuare and usa-beci already adopted the set unprompted."
      - "It is the proof the standard is not overfit to web development — most competing specs have three repos in one language."
      - "plumbing is also the ONLY project versioning its core files, and the source of the provenance header."
    consequences:
      - "ARCHITECTURE.yaml keeps the loosest required-key set in the standard, by design, so a physical topology passes."
    chosen_by_user: true

  - id: d-provenance-header-required
    date: "2026-09-07"
    title: "Every docs-yaml/*.yaml carries schema_version, as_of, status"
    context: >
      Only 9 files in the whole corpus declared a schema_version, and plumbing — the non-code
      project — was the only one versioning its core five.
    decision: "A three-line provenance header is mandatory."
    rationale:
      - "Without as_of, a checker can only guess freshness from mtime, which a reformat or typo fix resets."
      - "It is what makes level-3 (freshness) completion tests possible at all, and it is the cheapest addition in the standard."
    consequences:
      - "as_of means 'last verified against the thing described', NOT 'last edited'. Collapsing the two turns the tests into mtime theatre."
    proposed_by: claude
    confirmed_by_user: true

  - id: d-spec-generated-and-gated
    date: "2026-09-07"
    title: "The human form of the spec is generated from the machine form, and drift is gated"
    decision: "PROJECT-STANDARD.md is generated by render-standard.py; --check exits 1 on drift."
    rationale:
      - "Maintaining both by hand would make this spec its own first doc-rot casualty."
      - "It applies the project's own principle to the project itself on day one."
    consequences:
      - "Generated output must contain no timestamp or other run-varying value, or the gate fails constantly and gets switched off."
      - "Verified failing (hand-edit -> exit 1) and passing (regenerate -> exit 0) on 2026-09-07."
    proposed_by: claude
    confirmed_by_user: true

  - id: d-log-ownership-split
    date: "2026-09-07"
    title: "Rite owns the LOG.md contract; project-tracker owns registration and consumption"
    context: >
      project-tracker's ARCHITECTURE.yaml already declares LOG.md a per-project artifact that
      seed-projects.py creates and requires. Rite's Tier 0 also claims it.
    decision: >
      Rite defines the CONTRACT — it must exist, be append-only, and its entries must parse.
      project-tracker CREATES it on registration and READS it for portfolio ranking. Neither
      owns the other's half.
    rationale:
      - "A standard and a consumer of that standard are different roles; the overlap is only apparent."
    consequences:
      - "project-tracker's ARCHITECTURE.yaml will need updating to reference the standard rather than restate it. Not done here — out of this plan's scope."
    proposed_by: claude
    confirmed_by_user: false
    revisit_when: "project-tracker is next opened."

  - id: d-goal-is-credibility
    date: "2026-09-07"
    title: "Optimise for credibility, not adoption"
    context: "The blocking question carried over from claude-persistent's publishing handoff."
    decision: "One clear idea, an honest README, negative findings left in, no over-engineering toward installs."
    rationale:
      - "There is no distribution channel and the idea is niche by construction."
      - "These repos are portfolio artifacts shown to recruiters; an excellent README outweighs install counts."
      - "Optimising for adoption would push toward the generic status-bar lane the incumbents already own."
    proposed_by: claude
    confirmed_by_user: true

  - id: d-project-tracker-stays-separate
    date: "2026-09-07"
    title: "project-tracker is out of scope; integration only after a dedicated session"
    context: >
      Both projects touch LOG.md and both are session-adjacent, so drifting into merging them
      would be easy and would happen by accident rather than by decision.
    decision: >
      Rite does not absorb, require, or reshape project-tracker. It answers a different
      question — "what should I touch tonight?" versus "did this session close properly?".
      Rite may read the registry as optional auto-detected enrichment; nothing more.
    rationale:
      - "Different question, different scope (cross-project vs one project), different lifetime."
      - "A stranger installing Rite has no registry, so it can never be a dependency."
    consequences:
      - "Integration remains possible but must NOT be arrived at incrementally — it needs its own thorough session."
      - "d-log-ownership-split already splits LOG.md: Rite owns the contract, project-tracker creates and consumes."
    stated_by_user: true
    revisit_when: "A dedicated session is opened for exactly this question."

  - id: d-profiling-never-integrated
    date: "2026-09-07"
    title: "Self-profiling is permanently out of scope — privacy boundary, not a scoping preference"
    context: >
      ai-collab-profile/ is a longitudinal profile of how Costin works with Claude: 4864
      prompts, 462 sessions, 2.72M characters of his own words. Claude had been treating it
      as evidence for a measurement question rather than as a standing goal of its own.
    decision: >
      Rite must NEVER read, ingest, derive from, or ship anything from that corpus — not as a
      feature, not as enrichment, not as an optional layer, not as a documentation example.
    rationale:
      - "It is personal data and it is his alone."
      - "It is a THIRD goal, distinct from scheduling and from session discipline."
      - "Rite is intended for publication; a boundary that softens on publication is not a boundary."
    consequences:
      - "If a future feature would benefit from session-behaviour data, it is refused, not negotiated."
      - "Rite's end-session capture is designed for the project's own docs only."
    stated_by_user: true

  - id: d-docs-dir-and-format-split
    date: "2026-09-07"
    title: "Docs directory is `docs/`; prose is Markdown, structure is YAML, per file"
    context: >
      The directory was named docs-yaml/ and every core file was .yaml, including three that
      are almost entirely paragraphs. Measured on this project's own spec, which exists in
      both forms with byte-identical content: 25287 bytes as YAML against 19275 as Markdown,
      24% smaller, because YAML charges a `key:` and an indent for every line of prose.
      Markdown additionally needs no parser and cannot fail to load on a bad indent, whereas
      YAML requires PyYAML.
    decision: >
      Rename docs-yaml/ to docs/. Convert MISSION, ARCHITECTURE and CONVENTIONS to Markdown
      with YAML front matter. Keep DECISIONS and ROADMAP as YAML. The form is chosen per FILE
      by one test: if a checker must read a field of it, it is YAML; if a human reads it end
      to end, it is Markdown.
    rationale:
      - "A directory named for a file format is a claim that goes stale the first time one file inside it changes shape — the exact failure class this project exists to catch."
      - "DECISIONS and ROADMAP carry repeated entries whose fields the completion tests read (unique_ids, no_dangling_supersedes, entry_required_keys, min_list_items). Scraping those out of headings would mean hand-writing a Markdown-structure parser to avoid a dependency that is already installed — trading a good dependency for a worse bespoke one."
      - "The provenance header survives the split unchanged: YAML front matter in a .md, top-level keys in a .yaml. One parser reads both, so no test was lost."
    consequences:
      - "Spec tests for MISSION/ARCHITECTURE/CONVENTIONS move from key-based rules to section-based ones: required_keys_present -> required_sections, no_empty_values -> no_empty_sections, min_content_keys -> min_content_sections. An H2 scan is as deterministic as a mapping lookup, so nothing became unimplementable."
      - "Every artifact in the spec now carries an explicit `form:` field, and a new core `file_format:` block states the rule."
      - "local.docs_dir default moves from docs-yaml to docs; docs-yaml stays listed as an accepted alternative, because the 11 existing projects use it and migration is opt-in (see d-audience-public-standard)."
      - "d-provenance-header-required is amended in scope, not overturned: it said 'every docs-yaml/*.yaml' and now reads 'every file in the docs directory, in whichever form it takes'."
      - "as_of was NOT advanced on the three converted files. A format conversion is not a re-verification of their claims."
    amends: d-provenance-header-required
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true

  - id: d-write-discipline-declared-per-artifact
    date: "2026-09-07"
    title: "Every artifact declares one write discipline: append_only, rewrite_only, write_once, free_replace or mixed"
    context: >
      Before this, the spec declared a write rule for 2 of 12 artifacts (LOG and DECISIONS,
      both append_only) plus read_only on the memory mirror. Nine artifacts had no declared
      rule, which means nine files had nothing a check could ever test. "Edit the docs" was
      covering five genuinely different operations.
    decision: >
      A required `write_discipline` field on every artifact, from a closed five-value
      vocabulary, rendered into the human form as its own table.
    rationale:
      - "An artifact with no declared write discipline has no rule a check can test, which is the same as having no rule."
      - "The failure modes are silent and different in each direction: an appended roadmap becomes a graveyard, a rewritten log destroys the only durable record, an edited plan falsifies what was actually approved."
      - "write_once was missing from the obvious taxonomy and is the one that covers HANDOFF and PLAN. free_replace says 'overwrite freely, the source is elsewhere'; write_once says 'overwrite is forbidden, there IS no source'. Collapsing them loses the only two files where an edit is undetectable."
    consequences:
      - "Three new integrity tests are implied — content_stable_after_creation, regenerates_identically, milestones_append_only — and they land in the same bucket as append_only_preserved: they need revision history. Tracked as c-unimplementable-tests, not solved here."
      - "CONVENTIONS.md gained the full per-file table; CLAUDE.md gained the short version as a trap."
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true

  - id: d-roadmap-mixed-with-milestones
    date: "2026-09-07"
    title: "ROADMAP is mixed: the body is rewrite-only, `milestones` is append-only"
    context: >
      Deleting a finished near_term item was correct — a roadmap that accumulates done items
      becomes a second, non-append-only record of the past that competes with LOG.md and wins
      the race to be wrong. But the user pushed back that deletion loses the development path,
      and he was right that LOG alone does not give it back at a useful grain.
    decision: >
      Closing a near_term item DELETES it from near_term and APPENDS one entry to a new
      `milestones` list: id, what, closed, optional log_ref. ROADMAP's write discipline
      becomes `mixed`, and the file must state internally where the line falls.
    rationale:
      - "LOG.md and milestones are two RESOLUTIONS of the same past, not two copies. The log records every choice and implementation step; milestones record only what a near_term item delivered. Neither is cheaply derivable from the other — the log is too fine to skim, milestones too coarse to debug from."
      - "The item changes SECTION rather than growing a status field, so the rewrite-only half stays a statement about the future only."
      - "It makes deletion traceable: deleted_ids_appear_in_milestones is a real integrity test, where deletion into the log alone was not checkable."
    consequences:
      - "milestones is a FLAT LIST and must stay one. Lanes, nodes, edges, branches, progress and slippages is EVOLUTION.yaml — a timeline renderer answering a scheduling question, owned by project-tracker. This is the nearest point at which Rite can drift into that product by accident, so the boundary is now restated at the point of temptation, not only in d-evolution-out-of-scope."
      - "ROADMAP.open_questions was moved out to the new docs/CONCERNS.yaml; it was duplicating the staging area's job."
      - "The LOG side of the link stays one-directional and manual — logged as c-log-has-no-item-ids."
    stated_by_user: true
    confirmed_by_user: true

  - id: d-handoff-tier-0-always-present
    date: "2026-09-07"
    title: "HANDOFF.md is Tier 0 — it always exists, and 'nothing to hand off' is written down"
    context: >
      The spec had HANDOFF at tier 2 (situational). The user ruled that a handoff must always
      exist, and that a session with nothing to hand off says so in the file.
    decision: >
      HANDOFF.md moves to tier 0. A new genre `none` states explicitly that there is nothing to
      hand off, and why. Every session ends having recorded one of four outcomes: written,
      updated, carried_forward, none.
    rationale:
      - "A handoff saying 'nothing to hand off' and a missing handoff look identical from the next session's side, except that one proves somebody decided and the other proves nothing."
      - "The mandatory thing is the DECISION, not the prose — which is what makes it checkable. 'Must have a handoff' is not testable; 'must have recorded one of four outcomes' is."
      - "Same principle already settled for CONVENTIONS in d-conventions-stays-required: an explicit 'nothing project-specific' passes, an empty file does not. Stated twice on purpose — it is the rule people talk themselves out of."
    consequences:
      - "Promoted against the corpus rather than from it: 0/11 sampled projects carried a handoff reliably and none carried an expiry. That is the gap this closes, not a practice being described."
      - "session_end_decision_recorded must check the /end stamp, not the file: a session that wrote nothing and decided nothing is indistinguishable, on the file alone, from one that correctly decided none was needed."
      - "This is the first hard requirement of Rite's second half — the session protocol — and it arrived from the user, not from the standard."
    stated_by_user: true

  - id: d-roadmap-inception-write-once
    date: "2026-09-07"
    title: "ROADMAP gains a write-once `inception` block; `blockers` deleted; current_state gets one owner"
    context: >
      The user asked whether ROADMAP earns its place at all, given how many files appeared to
      track the same things. The audit found roughly half of it duplicated: `blockers` was
      empty and every CONCERNS entry already carries a `blocks:` field; `current_state` had
      four claimants (ROADMAP, README, HANDOFF, CLAUDE.md "Explicitly NOT built yet");
      `if_revisiting_cold` overlapped the newly-mandatory HANDOFF; `open_questions` had already
      moved to CONCERNS.
    decision: >
      Keep ROADMAP, thinner. Delete `blockers`. Declare current_state OWNED by ROADMAP, with
      README carrying a one-line mirror and HANDOFF referencing rather than restating. Add a
      write-once `inception` block recording the project's founding intent. ROADMAP becomes a
      three-zone mixed file: inception write-once, body rewrite-only, milestones append-only.
    rationale:
      - "near_term cannot be delegated to project-tracker's next-steps.yaml: a stranger installing Rite has no registry, so delegating would make Rite depend on it, which d-project-tracker-stays-separate forbids. That alone forces ROADMAP to exist."
      - "if_revisiting_cold is NOT HANDOFF. HANDOFF is momentary and expires; the cold-restart checklist is durable — 'run render-standard.py --check first' is true forever. Durable instructions in an expiring write-once file are lost at the next handoff. It is also the most-adopted concept in the corpus, present in every sampled project under five different names."
      - "current_state is rewrite-only, so the project's original intent is destroyed the first time the roadmap is adjusted. Drift-from-original is the one thing LOG.md cannot reconstruct: the log says what happened, never what was intended before it changed."
      - "A separate frozen file for the same purpose would be a 13th artifact whose only job is to hold the same content, older — which is the pattern this project exists to prevent. A zone inside the file it belongs to cannot drift from it."
    consequences:
      - "ROADMAP required_keys gains `inception`; `blockers` and `open_questions` are named in a new `forbidden_keys` block so a future session does not helpfully re-add them."
      - "`write_once` gained an explicit `freeze_point`, because 'frozen at creation' is ambiguous for anything a human drafts. HANDOFF freezes at SESSION END, PLAN at COPY, inception at project birth. Without this, a handoff could never be drafted iteratively."
      - "Two new tests implied — inception_present and inception_unchanged — the latter needing revision history, so it joins c-unimplementable-tests."
      - "PLAN-*.md is explicitly NOT the project plan: it is an archive copy of a ~/.claude/plans file, produced by tooling, many per project. Recorded because Claude conflated the two in conversation and the user corrected it."
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true

  - id: d-inventory-frozen-at-13
    date: "2026-09-07"
    title: "The artifact inventory is frozen at 13; script-produced files are specified separately"
    context: >
      The inventory grew from 12 to 13 in one session and would have grown to 16 if every
      reasonable suggestion had been taken — a status file, a checks config, and a stamp
      marking that /end ran. Each was individually defensible. Together they would have
      doubled the standard's surface in an evening.
    decision: >
      Freeze the human-authored artifact list at 13. Adding a 14th requires a DECISIONS entry.
      Files produced by scripts are OUT of the freeze and get specified separately, once their
      producers exist and their purpose is settled.
    rationale:
      - "An artifact whose producer does not exist cannot be specified honestly — its shape is guesswork dressed as a standard. This is the same error as declaring tests that cannot run, which the project already has six of."
      - "docs/claude-memory.md stays declared despite being script-produced, because its producer already exists and runs. That is the rule applied, not an exception to it."
      - "A standard that grows whenever a good idea appears has no edge, and cannot be learned."
    consequences:
      - "LICENSE added as the 13th — tier 2, required from stage `shipped`, write_once, and the ONLY artifact forbidden a provenance header, because a license is third-party text reproduced verbatim and editing it changes its legal meaning."
      - "rite itself now fails its own standard at stage `shipped`. Left visible on purpose."
      - "status.json deferred: necessity asserted, not established. checks.yaml deferred: it will exist per d-preflight-is-config-not-fork, but what it must contain for a stranger versus for this machine is unsettled."
      - "A `text` form was added alongside md and yaml, for LICENSE alone."
    stated_by_user: true

  - id: d-end-outcome-recorded-in-handoff
    date: "2026-09-07"
    title: "/end is a process; its outcome is recorded in HANDOFF front matter, not in a stamp file"
    context: >
      ARCHITECTURE describes SessionEnd stamping whether /end ran, and the next SessionStart
      reading that stamp — the mechanism by which the loop closes. Claude proposed a dedicated
      stamp file and argued the check could not work without one, because a session that wrote
      nothing and a session that correctly decided nothing was needed look identical on the
      file alone.
    decision: >
      No stamp file. HANDOFF.md front matter carries `session_end: written | updated |
      carried_forward | none`. /end is a process, and its result belongs in the artifact the
      process is about.
    rationale:
      - "Avoids inventing a file. The inventory had just been frozen for exactly this reason."
      - "Claude's objection is answered by two files that already exist: if HANDOFF `written:` is older than the newest LOG.md entry, the session worked and then closed without touching the handoff. Stale date means nobody thought about it; current date saying `none` means someone decided. They are no longer indistinguishable."
      - "It also removes a file that would have had to be gitignored, and therefore invisible to exactly the cold agent it was meant to inform."
    consequences:
      - "New test `written_not_older_than_newest_log_entry` — checkable today, with no revision history and no new artifact. It does NOT join c-unimplementable-tests."
      - "`session_end` becomes required front matter on HANDOFF; this project's own handoff carries it as of 2026-09-07."
      - "The stamp file is recorded as REJECTED rather than deferred, so it is not helpfully re-proposed."
    stated_by_user: true

  - id: d-portability-rules-are-normative
    date: "2026-09-07"
    title: "Cross-platform behaviour is specified as eight normative rules, not left to MISSION's constraint line"
    context: >
      MISSION declared "cross-platform, no assumption of Linux, bash, or VS Code" from day one,
      but nothing said what that meant operationally. Asking what actually breaks on Windows
      and macOS produced eight concrete rules, one of which is a correctness bug rather than a
      portability nicety.
    decision: "A `portability:` block in the spec, mirrored as a CONVENTIONS section; eight rules, each with its reason."
    rationale:
      - "case_sensitive_name_matching is the load-bearing one: macOS and Windows are case-insensitive, so Path('README.md').exists() is True for readme.md. The same repo gets two different verdicts depending on the machine — fatal for a standard whose entire value is canonical names."
      - "PyYAML is not installed by default on macOS or Windows. Graceful degradation is therefore the DEFAULT first-run path on two of three targets, not an edge case."
      - "The harness splits the field harder than the OS does — VS Code on Windows resembles VS Code on macOS more than either resembles its own terminal — but only for what a hook can surface, never for file handling."
    consequences:
      - "render-standard.py now writes newline='\\n'. Found by inspection, not by failure — no non-Linux machine has run this yet."
      - "README gained the Windows invocation and the pip line; `python3` in documentation is now a declared defect."
      - "A .gitattributes with eol=lf was REJECTED in favour of normalizing inside the comparison — it would have been a hand-authored 14th file an hour after the inventory was frozen, and the /end ruling had just set the precedent for not inventing files."
      - "All eight are PREDICTIONS. None has met a real Windows or macOS machine. Recorded as such so a later session does not read them as verified."
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true

  - id: d-python-is-the-runtime
    date: "2026-09-07"
    title: "Python is Rite's runtime — chosen, not inherited; Node evaluated and refused"
    context: >
      Python appeared as an assumption in four files and in zero decisions, having been
      inherited from preflight.py, claude-mirror-memory.py and hookdedup.py. Claude raised what
      looked like a strong counter-argument: Node is guaranteed present on any machine running
      Claude Code, because Claude Code is a Node application.
    decision: "Python 3 is the runtime. Node is refused."
    rationale:
      - >
        The counter-argument was MEASURED FALSE. The claude CLI on this machine is
        ~/.local/share/claude/versions/2.1.260 — a 205 MB self-contained ELF binary linking
        only libc, librt, libpthread and libdl. No libnode, not an npm package. Claude Code
        bundles its own runtime, so a machine can run it with no node on PATH at all. The
        VS Code extension does not change this: it is platform-specific, declares zero
        dependencies, and runs in VS Code's extension host, which never puts node on a hook's
        PATH.
      - "With Node not guaranteed either, there is no availability edge. On Debian both python3 and nodejs are Priority: optional — measured, not assumed."
      - "So the pre-existing grounds decide it: 744 proven lines of preflight.py, and d-preflight-is-config-not-fork, which makes those lines the engine. Porting to Node would recreate the two-codebases-drift problem that decision exists to prevent."
    consequences:
      - "Python is documented as a HARD prerequisite in ARCHITECTURE, with per-platform install cost, rather than as a bare dependency line."
      - "The outermost prerequisite cannot report on itself: if Python is absent the hook fails at the shell level, and under entrypoint=claude-vscode the user may see nothing. It therefore belongs in the README's install section, not in a runtime check."
      - "Shipping a self-contained binary was considered and refused as absurd for a few hundred KB of file checks — but it is what Anthropic did, and it names the real trade: zero prerequisites requires bringing your own runtime."
      - "What survives is the install-step count, the only lever actually in our control. Tracked as c-vendor-pyyaml."
    reconstructed: false
    proposed_by: claude
    confirmed_by_user: false
    revisit_when: "Claude Code's distribution changes, or a Windows/macOS user reports the install chain as a real barrier."

  - id: d-two-shims-sh-and-ps1
    date: "2026-09-07"
    title: "The launcher shim is .sh + .ps1; cmd.exe/.bat is never involved"
    context: >
      The question was which shell Claude Code invokes for a hook on Windows and macOS. It was
      answered in three stages, and the first two were both wrong in different directions.
      Claude first asserted a .sh/.bat pair from general Windows knowledge. Reading the 2.1.260
      binary then suggested a single .sh, because Windows routes through Git Bash — but that
      reading treated Git for Windows as a hard requirement. The official documentation,
      fetched on the user's instruction to spend tokens on a web search, settled it.
    decision: "Ship two launcher shims, .sh and .ps1. Never .bat."
    rationale:
      - "MEASURED, from code.claude.com/docs/en/hooks: a hook's `shell` field accepts bash or powershell and 'defaults to bash, or to powershell on Windows when Git Bash isn't installed'. Shell form passes the command to `sh -c` on macOS and Linux, Git Bash on Windows, or PowerShell when Git Bash is absent."
      - "cmd.exe is never the hook shell on any configuration, so a .bat would be dead code. The Windows fallback is PowerShell."
      - "From code.claude.com/docs/en/setup: Git for Windows is OPTIONAL and recommended, not required. The binary's error string that implied otherwise fires only when Git Bash is absent AND the PowerShell tool is disabled."
      - "Exec form (setting `args`) bypasses the shell entirely on every platform and would remove the Git Bash quirks — but it needs a concrete executable name, and none works everywhere: macOS has python3 but not python, Debian likewise, Windows has python and py but often not python3. It solves the shell problem, not the interpreter problem."
      - "The two shims cannot meaningfully drift: one job each, no check, parse or logic, and PowerShell is a real language, so the .ps1 is a translation rather than a reimplementation. This is materially unlike a .bat, which could not do the job at all."
    consequences:
      - "The 'guaranteed present versus written once' framing was wrong on both halves. Shell is not guaranteed to be POSIX (PowerShell path), and the duplication is two small translations rather than two implementations."
      - "Windows traps recorded where the path runs through Git Bash: unquoted backslashes are consumed, `node` is auto-aliased to `winpty node.exe`, and CLAUDE_CODE_GIT_BASH_PATH may relocate it."
      - "Exec form is recorded as the escape hatch to prefer wherever a concrete interpreter path is already known."
      - "STILL UNVERIFIED on real hardware. This is documentation plus binary strings — better than assumption, worse than a test. Nothing here has run on Windows or macOS."
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true
    supersedes_advice: >
      Two earlier answers in the same session, both retracted: '.sh and .bat' (from general
      knowledge, wrong about cmd.exe) and 'one .sh, no .bat' (from binary strings, wrong that
      Git for Windows is required). Recorded so neither is re-floated.

  - id: d-stdlib-only-yaml-subset
    date: "2026-09-07"
    title: "Rite reads YAML with a stdlib-only subset parser; PyYAML is dropped as a dependency"
    context: >
      The user proposed dropping Python entirely and writing the scripts as .sh with a Windows
      counterpart, to reduce prerequisites. That was refused — PowerShell has no built-in YAML
      cmdlet (an open PowerShell issue asks for ConvertFrom-Yaml; every implementation is a
      PSGallery module), POSIX sh cannot parse YAML or JSON without jq, and two shell
      implementations of the CHECKS would be two copies of the core logic, which is the exact
      drift d-preflight-is-config-not-fork refuses. But the underlying goal — fewer
      prerequisites — was right, and shell was the wrong lever.
    decision: >
      Write a stdlib-only parser for the YAML subset the project actually uses. Drop PyYAML.
      Python becomes Rite's single declared prerequisite, with nothing to pip install.
    rationale:
      - >
        MEASURED across 1839 lines of the project's own YAML: anchors (0), aliases (0), tags
        (0), flow mappings (0), block literals (0), merge keys (0), complex keys (0). Every
        construct that makes YAML genuinely hard to parse is unused. What IS used: block
        mappings and sequences, plain/single/double-quoted scalars, folded blocks (151),
        flow sequences of scalars (50), comments and --- to skip, nesting to 6 levels.
        Estimated 150-250 lines.
      - "It removes the prerequisite instead of duplicating the codebase — the same goal the shell proposal was reaching for, without the drift."
      - "It also makes the pyyaml_absence_degrades_loudly portability rule unnecessary: there is nothing left to be absent."
    consequences:
      - "The parser MUST REFUSE, not guess. On meeting an anchor, alias, tag, block literal or merge key it errors and names the file and line. A hand-rolled parser that silently mis-parses is far worse than none."
      - "Completion test is DIFFERENTIAL: parse every project file with both the subset parser and PyYAML, compare the resulting structures, fail on any difference. PyYAML stays installed on this machine as the ORACLE, not as a runtime dependency. The test is written and run while the oracle is still available."
      - "Install cost: Linux 0, macOS 0-1, Windows 1. Python is the only remaining prerequisite and is surfaced at preflight rather than assumed."
      - "c-vendor-pyyaml is retired as superseded — vendoring solves a smaller version of the same problem."
      - "ARCHITECTURE dependencies change from 'Python 3 (stdlib + PyYAML)' to 'Python 3 - stdlib only'."
    risk: >
      This is new, unproven code replacing a mature library. The differential test is what
      makes it defensible; without it this decision would be reckless. If the test cannot be
      made to pass on all five files, the decision is reversed rather than the test weakened.
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true
    widened_2026_09_09: >
      THE MEASUREMENT WAS A SAMPLE OF ONE. This entry rests on "measured: the project uses no
      anchors, aliases, tags, flow mappings, block literals or merge keys" — true of rite,
      false of the wild. The first run against outside projects (2026-09-09) found block
      literals in hwprivacy and flow mappings in plumbing, and the subset was widened rather
      than the projects blamed.
      ADDED, each proven against PyYAML as oracle before shipping: block literals (| |- |+),
      folded chomping (>- >+), flow mappings including nested and empty, and multi-line plain
      scalars.
      FIXED, all pre-existing and all SILENT — the parser returned a wrong value without
      raising: floats were read as strings; folded blank lines lost a newline next to a
      more-indented run; a block sequence at its key's own indentation was read as an empty
      value and dropped the whole list; a flow collection as a sequence item was mis-read as a
      mapping. The last was caught by the widened test itself, on the tree that wrote it.
      UNCHANGED: stdlib only, PyYAML imported nowhere, refuse-rather-than-guess. Anchors,
      aliases, tags, merge keys and complex keys are still refused, and the differential test
      remains the correctness claim — it now proves 14 in-subset constructs as well as the
      documents.
      RESULT: 13 of 13 valid YAML files across hwprivacy, plumbing and claude-persistent parse
      identically to PyYAML. Before: 4 refused outright and 3 more parsed to the wrong value.
      Version bumped 0.1.3 -> 0.2.0; a changed subset is not a patch.

  - id: d-plugin-components-are-mostly-prompts
    date: "2026-09-08"
    title: "Rite's judgement half is Markdown prompts, not code; only the mechanical half needs Python"
    context: >
      The question was how skill and plugin internals are executed. Checked against
      code.claude.com/docs/en/plugins-reference rather than answered from memory.
    finding: >
      Skills (SKILL.md), commands (.md) and agents (.md + frontmatter) are PROMPTS that Claude
      interprets — not executable code. Hooks are JSON configuration whose type may be command,
      http, mcp_tool, prompt or agent. Scripts are the only genuinely executable component, and
      they are invoked BY hooks or referenced by skills, never run directly by the user.
    decision: >
      /end, /log and /handoff are commands — Markdown prompts requiring no interpreter.
      preflight, the checker, mirror-memory and plan copy are scripts and require Python.
    rationale:
      - "It coincides exactly with the judgement/mechanical boundary ARCHITECTURE already draws. That boundary was forced by SessionEnd having no turns left; that it also separates 'prompt' from 'executable' is a happy accident, not a design."
      - "It makes degradation real rather than theoretical: with no Python the entire judgement half still works, and only preflight, the checker and the mirror are lost. That is a usable product without the prerequisite, instead of nothing running."
    consequences:
      - "d-python-is-the-runtime is NARROWED, not overturned: Rite's SCRIPTS need Python. Rite does not."
      - "Hooks reference plugin files as \"${CLAUDE_PLUGIN_ROOT}\"/scripts/... — the documented variable, which also satisfies the no-hardcoded-paths rule."
      - "No Rite command may DEPEND on inline shell execution: the settings schema carries disableSkillShellExecution, which strips it from skills and commands from user, project and plugin sources."
      - "Hook types `prompt` and `agent` exist and were not previously known. Not used yet; recorded because they may matter for SessionStart, which does have turns."
    amends: d-python-is-the-runtime
    proposed_by: claude
    confirmed_by_user: false

  - id: d-session-protocol-shape
    date: "2026-09-08"
    title: "Session protocol: four rulings that fix its shape"
    context: >
      Before writing the session-protocol spec, four judgement calls were put to the user
      because each changes the shape of the whole document rather than a detail.
    decision: >
      1. SKIPPED /end — the next session NAGS ONCE and then lets it go.
      2. MINIMUM SESSION — none. The full ritual runs every session regardless of size.
      3. LOG CADENCE — continuous during the session, with a distilling pass at /end.
      4. START FRAME — out of scope for now. Ship the end half; start-session stays preflight
         plus the handoff.
    rationale:
      - "Nag-once keeps the signal honest without becoming a warning that never clears — a gate that always fails gets switched off within a week, which is the project's own standing argument."
      - "Continuous logging was validated in practice on 2026-09-07: 85 entries written as events happened. The /end pass exists to catch gaps and entries that turned out wrong, which continuous logging alone never does."
      - "Dropping the start frame keeps the first spec small and targets the actual gap. Preflight already covers session start; the end half is what has never existed."
    consequences:
      - "No threshold config is needed anywhere, which removes a calibration problem before it starts."
      - "c-ai-collab-interaction-boundary stops blocking: the start frame is deferred, so session-frame.yaml is not needed for this spec. trust_level remains the one idea worth carrying if the start half is ever built."
    dissent_recorded: >
      Claude recommended a measured threshold for the minimum session and argued that ceremony
      which does not scale down gets abandoned on a quick fix. The user chose the full ritual
      every time. Recorded so that IF the protocol is later skipped in practice, the cause is
      already written down rather than rediscovered.
    stated_by_user: true

  - id: d-continuous-watcher-layer
    date: "2026-09-08"
    title: "A third checking layer: continuous watchers via command hooks"
    context: >
      The user asked whether hooks of type command could run during the session flow as a
      mechanical second channel — something that watches the project and raises flags for
      Claude without depending on Claude. Everything Rite had until now depends on someone
      remembering: preflight fires at a boundary, /end fires only if typed, docs get updated if
      the agent does not forget.
    decision: >
      Yes, and it becomes a declared third layer. Eight watchers accepted into mid_term; four
      proposals rejected outright and recorded in ARCHITECTURE so they are not re-floated.
    rationale:
      - "Command hooks are executed by the harness with no involvement from Claude and no action from the user. That makes this the only mechanically reliable layer, and the right one to police the two that are not."
      - "The write-discipline watcher has a 100% hit rate against this project's own real failures — a milestones entry inserted mid-list, and roughly thirty LOG entries with extrapolated timestamps, both found by luck rather than by check."
      - "It gives c-log-timestamps-must-be-machine-read a home. That check exists on paper and has nowhere to run, because the checker only runs at session boundaries."
      - "Plan-copy on creation CLOSES c-plan-attribution: the problem is only hard retroactively. A plan copied when it appears belongs to the project the session is in."
    mechanics_verified_2026_09_08:
      - "On tool events, plain-text stdout goes to the debug log only — invisible to Claude AND the user. A watcher MUST emit JSON with additionalContext."
      - "additionalContext reaches Claude; systemMessage reaches the user. Two fields, two audiences."
      - "systemMessage does nothing on this machine (0 refs in 2.1.263), so the user-facing channel is dead here and the Claude-facing one is not."
      - "Exit code 2 blocks the action and delivers the reason to Claude — the escalation from observation to enforcement is one exit code away."
      - "Session metrics are free and exact from transcript_path; usage against the 5-hour limit is NOT on disk and cannot be derived."
    consequences:
      - "Watchers must be SILENT on success: additionalContext on PostToolUse injects into Claude's context on every write, so a chatty watcher spends the scarce resource the work needs."
      - "Watchers observe and report; they never edit. Same boundary as never_mutate_claude_home."
      - "Two opportunities were considered and NOT taken — machine-readable claims (the route out of c-unimplementable-tests) and stale-on-touch. Both recorded in deferred_deliberately rather than dropped."
      - "status.json is accepted only conditionally: it may be where flags accumulate between firings, but the purpose must prove itself first. The inventory stays frozen at 13."
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true

  - id: d-log-seconds-optional
    date: "2026-09-08"
    title: "LOG timestamps gain optional seconds; the >=1-minute spacing rule is deleted"
    context: >
      The user asked whether minute resolution was enough. The honest answer was not "I need
      seconds" but that the existing convention contained a defect: CONVENTIONS required
      entries from one session to be at least a minute apart, which MANDATES inventing spacing
      whenever several things happen inside the same minute. That rule produced roughly thirty
      fabricated timestamps on 2026-09-07 — the rule written to keep the log honest was the
      rule forcing the lie.
    decision: >
      Seconds become OPTIONAL in the format: "%d-%m-%Y %H:%M" or "%d-%m-%Y %H:%M:%S". The
      spacing rule is deleted. Milliseconds are refused.
    rationale:
      - "Additive rather than a migration: 1808 existing entries across 50 projects stay valid and are re-emitted byte-identically, so append-only is never violated and the format-migration exception is never invoked."
      - "It removes a rule that required fabrication, which is a better reason than need."
      - "It closes a 60-second blind spot in the accepted watcher check 'no LOG entry newer than the file's own mtime' — at minute resolution an entry at 13:50:59 and an mtime of 13:50:01 both read as 13:50."
      - "Milliseconds refused as false precision: a human-authored log entry has no millisecond meaning, and precision beyond meaning is the same failure as the usage gauge rejected the same day."
    the_blocker_found_first: >
      seed-projects.py REWRITES every project's LOG.md from its own parse and silently drops
      unparseable lines. Adopting seconds before updating that parser would have deleted every
      seconds-format entry with no error. Demonstrated, not predicted: the round-trip test run
      against the pre-patch parser drops 3 of 5 sample lines. Parser first, format second.
    implementation:
      - "seed-projects.py — parse_ts() accepts both forms; parse_existing_log returns a had_seconds flag; fmt_entry PRESERVES the precision it was given, so nothing existing is rewritten."
      - "show-portfolio.py — accepts both forms."
      - "preflight.py — regex already tolerated a trailing :SS by ignoring it; now captures it, making last_log_age exact instead of rounded down."
      - "project-tracker/test-log-roundtrip.py — new. Asserts both precisions survive parse-and-rewrite byte-identically. Loads only function definitions via AST, because importing seed-projects.py executes it and writes the registry."
      - "project-tracker/CLAUDE.md — records the format, the preserve-precision requirement, and that any parser change must pass the test."
    verified:
      - "test-log-roundtrip.py PASSES on the patched parser and FAILS on the backup (3 of 5 lines dropped)."
      - "End-to-end: three seconds-precision entries appended to rite's real LOG.md, then a full seed-projects run over all 51 projects — rite's LOG.md came back byte-identical."
    cross_project: >
      This touches project-tracker, which owns the parser, and claude-preflight. Done with the
      user's explicit instruction to implement rather than scope.
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true

  - id: d-verdicts-and-participation
    date: "2026-09-08"
    title: "Failure semantics defined; participation is opt-in by a .rite.yaml marker"
    context: >
      A spec audit found that nothing said what a failing check DOES — a hole in a project
      whose entire product is "a check that fails" — and nothing said how a project opts in,
      so a non-conforming project would fail forever.
    decision: >
      Verdicts are GREEN / YELLOW / RED / NA with whose-side-to-fix tagging, INHERITED from
      claude-preflight rather than invented. Test levels map to severity: exists and integrity
      are RED, populated and fresh are YELLOW. Exit 1 on any RED; YELLOW exits 0; `fail_on`
      overrides. Participation is OPT-IN via a `.rite.yaml` marker — Rite is silent in any
      project without one.
    rationale:
      - "The vocabulary is not a choice: d-preflight-is-config-not-fork makes Rite preflight's upstream, so a second severity scheme would be exactly the drift that decision refuses."
      - "The level mapping falls out of what the levels mean. `integrity` catches a LIE — an append-only file rewritten, a supersedes id resolving to nothing — while `fresh` catches a LAPSE. A lie is RED; a lapse is YELLOW."
      - "YELLOW must not fail the exit code by default, or the gate fires on every slightly-old document and gets switched off within a week — this project's own standing argument, applied to itself."
      - "It must be able to fail at all, because a non-zero exit is what lets Rite gate a pre-commit hook or a CI run. That is the strongest enforcement available to it."
      - "Opt-in matches the standing rule that migration of the 11 existing projects is separate and opt-in. A tool that starts reporting on 40 projects nobody asked it to check is noise on first contact, and noise gets a plugin uninstalled."
    consequences:
      - "Verdicts are REPORTED at session start, never enforced there — the start phase already declares must_not: block. Gating belongs to an explicitly invoked checker."
      - "`.rite.yaml` is declared CONFIG, not a documentation artifact, so it does not count against the inventory frozen at 13. The inventory covers what a cold reader reads to understand the project; this file is operational, like .gitignore. Stated explicitly BECAUSE the freeze exists to stop additions being absorbed without argument — the freeze worked."
      - "An empty .rite.yaml is a valid marker: presence is the signal. Optional keys are standard_version, fail_on, thresholds, disabled_checks."
    corrections_made_in_the_same_pass:
      - "ARCHITECTURE listed /next among the planned commands. It writes to next-steps.yaml, which d-project-tracker-stays-separate forbids Rite owning. Removed, with the reason recorded inline so it is not re-added."
      - >
        Claude claimed the spec contained 10 'hardcoded values' violating MISSION. OVERSTATED —
        they live in spec/project-standard.yaml, which is human-visible YAML, not baked into
        code. The real defect is narrower: there is no OVERRIDE, so a stranger who wants a
        different window must edit the standard itself and their copy drifts from upstream.
        And only three of the ten are genuinely tunable — the freshness windows 30/60/90, which
        c-freshness-thresholds-are-guesses already admits are uncalibrated. The structural
        minimums (min_lines, min_entries, min_content_sections, min_list_items) are the standard
        and are not tunable: a LOG with zero entries is broken regardless of taste.
    open: "Whether the three freshness windows become per-project overridable via .rite.yaml. Not yet ruled."
    resolved_2026_09_08: >
      RULED: yes, overridable. Only the three freshness windows — log 30, roadmap 60,
      architecture 90 — and only those. The structural minimums stay fixed, because a project
      able to lower every bar to its own current state is not being measured by anything.
      Claude added one condition the user did not ask for and would defend: an override is
      NEVER SILENT. Any finding computed with an overridden window must report the override
      and the default beside it, and a check silenced via `disabled_checks` reports as NA with
      the reason rather than vanishing. There is deliberately NO cap on an override — any cap
      would be as arbitrary as the default it protects — so visibility is the control instead
      of a limit. Without that, setting 99999 disables a check permanently with nothing to show
      it ever existed, which is the same failure as a document that quietly stops being true.
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true

  - id: d-git-is-a-capability-not-a-prerequisite
    date: "2026-09-08"
    title: "git is a capability; missing it degrades the integrity tier to NA, never to failure"
    context: >
      Five declared tests need revision history — append_only_preserved (x2),
      milestones_append_only, inception_unchanged, content_stable_after_creation — and Claude
      was about to recommend making git a second prerequisite so they could run.
    decision: >
      git is a CAPABILITY, not a prerequisite. Absent, those tests report
      "NA — requires revision history": never RED, never silently omitted.
    rationale:
      - >
        MEASURED across 10 sampled projects: SIX are not git repositories — plumbing, usa-beci,
        claude-preflight, claude-persistent, project-tracker, and rite itself. plumbing and
        usa-beci are the non-code projects d-noncode-first-class explicitly promises to serve.
        Requiring git would fail 60% of the corpus and break a settled ADR.
      - "The NA-with-reason machinery already exists — it was specified the same day for disabled_checks — so this needs no new concept."
    correction_2026_09_08: >
      The rationale above CONFLATES two things and the user caught it. `git --version` returns
      2.47.3 on this machine — the TOOL is installed. What is missing is that six project
      DIRECTORIES are not repositories. Requiring git-the-tool would be a reasonable assumption
      about a Claude Code user; requiring every project to be under version control would not,
      and that is the real reason the integrity tier cannot be mandatory. The decision stands;
      the reasoning as first written was imprecise, and a later session reading it would have
      drawn the wrong lesson about what may be assumed of a user's machine.
    consequences:
      - "Three degradation tiers are now declared. With NEITHER python nor git, the ENTIRE judgement half still works, because /end, /log and /handoff are Markdown prompts needing no interpreter. The zero-prerequisite tier is not empty and it is the DIFFERENTIATED half — status-bar monitors are the commodity, a session-end protocol is not."
      - "Expectation set before building: on most of this machine's projects the integrity tier will read NA, and the useful coverage is exists / populated / fresh."
      - "rite itself should still `git init` — it is going to be published and cannot currently verify its own append-only discipline. That is rite-the-project, not rite-the-standard."
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true

  - id: d-never-instruct-installation
    date: "2026-09-08"
    title: "The setup check reports capabilities; it never tells the user to install anything"
    context: >
      The user described a real incident: his boss, on Windows 11, was told by an AI coding
      tool to install Python. The attempt broke his existing Python and pyenv installation, and
      getting git working afterwards was a separate ordeal. The damage was caused BY the tool's
      instruction.
    decision: >
      Rite reports which capabilities are present and what each enables. It never instructs an
      installation, never prints a command to paste, and never modifies the environment.
    rationale:
      - >
        The tool cannot see the machine's existing state — system python, pyenv, conda, the
        Microsoft Store alias, WSL, Git Bash's own interpreter — so any install instruction is
        a guess with the user's working environment as the stake. A wrong guess breaks a setup
        that was fine, and the user then owns a problem the tool created.
      - "If the user asks how to fix something, link the vendor's documentation. Never a command."
    rules_that_follow:
      - "never_modify_the_environment — no installs, no PATH edits, no writes to python/pyenv/git config. Extends never_mutate_claude_home from ~/.claude to the whole machine."
      - >
        probing_must_not_trigger_installs — on Windows, do NOT invoke bare `python` to test for
        it: the App Execution Alias opens the Microsoft Store. The DETECTION would cause the
        surprise it exists to prevent. Probe with `py -0` or resolve the path without executing.
      - >
        three_states_not_two — report absent / present-but-broken / working. Broken is the
        worst state and the most confusing, because something IS installed, so "install Python"
        is actively wrong advice that sends the user to make it worse. Detect by running a
        trivial program, not by finding a file. Say "found at <path> but it fails to run";
        state the path and the symptom, prescribe nothing.
      - "pull_not_push — the report is available on request, not shown unprompted more than once. Same argument as the nag policy and the rejected timer reminders."
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true

  - id: d-drop-claims-match-stage
    date: "2026-09-08"
    title: "claims_match_stage is dropped rather than solved"
    context: >
      The test needed a source for the project's "actual" stage. The candidates were
      .rite.yaml — a second source of truth beside project-tracker's projects.yaml, which
      already carries a `stage` field — or the registry itself, which a stranger installing
      Rite does not have. Claude offered four routes and recommended treating a disagreement
      between the two as its own finding.
    decision: "Drop the test. Do not add a stage field to .rite.yaml for it."
    rationale:
      - >
        It was REDUNDANT, which neither of us noticed while framing the options. Its own
        justification cites claude-persistent's README asserting "spec — no extension code yet"
        over a built, running extension — that is a claim about the FILESYSTEM, not about a
        stage field. claims_match_filesystem covers it. The test was specified as a stage
        comparison and justified by a filesystem example, so removing it is a consolidation
        rather than lost coverage.
      - "It avoids a project-tracker boundary decision, which d-project-tracker-stays-separate says must never be arrived at incrementally — and adding a stage field in passing is exactly arriving at it incrementally."
    consequences:
      - >
        Tier 1's trigger CHANGED as a direct result. It read "required from stage `spec`
        onward", which depended on a stage Rite has no reliable way to read. It is now the
        PRESENCE OF THE .rite.yaml MARKER: opting in is the act of committing. Rite therefore
        needs no stage source to enforce Tier 1 at all — the participation model absorbed the
        requirement.
      - >
        LICENSE still declares required_from_stage: shipped, and that is now the ONLY remaining
        consumer of a stage value. It is not resolved here. Until it is, that check cannot run
        for a project that does not declare a stage somewhere. Recorded rather than papered over.
      - "README's one-line current_state mirror is no longer tested by anything. The ownership rule stands; the enforcement is gone. Stated explicitly in the spec and in CONVENTIONS so it is not assumed to be checked."
      - "Four documents referenced the removed test and were all corrected in the same pass — spec, ROADMAP, CONVENTIONS and CONCERNS. A dangling reference to a deleted test is precisely what no_dangling_supersedes exists to catch, one level up."
    stated_by_user: true
    proposed_by: claude
    confirmed_by_user: true

  - id: d-plugin-layout-root-is-the-plugin
    date: "2026-09-08"
    title: "The repo root IS the plugin; skills, not commands; nag state lives in CLAUDE_PLUGIN_DATA"
    context: >
      Building the plugin shell required four structural calls that the specs did not cover.
    decision: >
      The repo root is the plugin (.claude-plugin/plugin.json), and it advertises itself as a
      one-plugin marketplace with "source": ".". Components are skills/<name>/SKILL.md, not
      commands/. Nag state lives in ${CLAUDE_PLUGIN_DATA}. PostToolUse is deliberately not
      shipped.
    rationale:
      - >
        ROOT-AS-PLUGIN: the proven local pattern (claude-persistent) nests plugins under
        plugins/<name>/, but Rite cannot copy it — the checker needs spec/project-standard.yaml
        at RUNTIME, and the plugin is COPIED into the install cache, so a nested plugin would
        have to contain scripts/ and spec/ too, i.e. most of the repo. Root-as-plugin avoids
        duplicating them.
      - >
        SKILLS OVER COMMANDS: the plugins reference states commands/*.md is the legacy form and
        both load identically. Skills give /rite:<name> and support
        disable-model-invocation, which is what keeps /end and /handoff user-only — Claude must
        never decide a session is over. /log is deliberately BOTH-invocable, so "log
        continuously" becomes something the harness can surface rather than a discipline to
        remember.
      - >
        NAG STATE: this resolves the contradiction recorded in the protocol's honest_limits.
        HANDOFF front matter was the obvious home and the wrong one — it is write_once and
        freezes at session end, so a SessionStart write would violate its own discipline.
        ${CLAUDE_PLUGIN_DATA} is the plugin's own storage, which never_mutate_claude_home
        already names as its ONE declared exception. Not a project artifact, so the inventory
        stays frozen at 13.
      - >
        POSTTOOLUSE OMITTED: the plan called for it, reusing
        ~/.claude/scripts/claude-mirror-memory.py. That is Costin's script, not Rite's. A plugin
        hook depending on a file only one machine has is broken by design for everyone else,
        and on this machine it would double-fire against the entry already in settings.json.
        It belongs to port-mirror-memory. Deviation from the approved plan, recorded rather
        than silently dropped.
    consequences:
      - "'source': '.' has NO precedent — every string source in the official marketplace is ./plugins/<name>. UNVERIFIED until `claude plugin marketplace add` is run. If rejected, the fallback is plugins/rite/ with scripts/ and spec/ moved and their paths updated."
      - "The locked finding in CLAUDE.md conflated a plugin with a marketplace. Corrected: a plugin is .claude-plugin/plugin.json at its own root; a marketplace is marketplace.json listing plugins by source path. Rite is both."
      - "Skill names log, preflight and handoff collide with Costin's existing ~/.claude/commands/. The docs are self-contradictory about precedence, so it must be TESTED after install; the fallback is renaming Rite's skills rather than letting them shadow his."
      - "Rite ships no PostToolUse hook, so on this machine there is no duplication with the existing settings.json entries. Coexistence, not replacement — the switchover belongs to port-preflight."
    verified:
      - "SessionStart hook runs end to end and emits valid JSON with additionalContext carrying a real verdict."
      - "Shim with no interpreter on PATH: names what is unavailable, names what still works, exits 1, and prints NO install command — grep-checked for apt/brew/winget/pip/curl-pipe patterns."
      - "Handoff detection: written: backdated to 2026-09-01 against a log running to 2026-09-08 produced both the checker RED and the nag. Second run dropped the nag and kept the RED."
    not_verified: "Nothing has been installed. The plugin has never been loaded by the harness."
    verified_2026_09_08: >
      not_verified above is now SPENT, and its three open questions are answered by the live
      session it was waiting for. Recorded here rather than by editing the line, which stands.
        - "source": "." WORKS. Marketplace loaded, plugin installed as rite@rite.
        - THE COLLISION DID NOT HAPPEN. Plugin skills are namespaced — /rite:log, /rite:preflight,
          /rite:handoff, /rite:end — so Costin's own /log and /preflight are untouched and the
          fallback of renaming Rite's skills is not needed. disable-model-invocation behaves as
          intended: end and handoff are hidden from the model and still offered to the user.
        - The claim "SessionStart hook runs end to end and emits valid JSON with
          additionalContext carrying a real verdict" was TRUE AND USELESS. It emitted valid JSON
          the harness does not read. Verifying a hook by running it by hand cannot catch this;
          only a live session can. See d-hook-output-shape-is-a-contract.
    proposed_by: claude
    confirmed_by_user: false

  - id: d-hook-output-shape-is-a-contract
    date: "2026-09-08"
    title: "A hook's output SHAPE is a contract, pinned by a test; and a local plugin is only as current as its version"
    context: >
      Rite's first live SessionStart hook ran, exited 0, emitted valid JSON, was logged by the
      harness as `success` — and reached nobody. It emitted a top-level `additionalContext`;
      the harness reads `hookSpecificOutput.additionalContext` and silently ignores anything
      else. Nothing failed. The previous session had verified the hook by running it by hand
      and recorded it as working, which it was, uselessly.
    decision: >
      The envelope is a contract and is pinned by scripts/test-hook-output.py, which asserts
      SHAPE and not content. Separately: a version bump in .claude-plugin/plugin.json is a
      required step of changing Rite, because `claude plugin update` is version-gated.
    rationale:
      - >
        SHAPE, NOT CONTENT: a verdict that is correct and unreadable is worth nothing, and only
        the shape distinguishes the two. Asserting the text would couple the test to the
        project's own check results and make it fail for the wrong reasons.
      - >
        THROUGH THE SHIM, NOT THE MODULE: the test invokes hooks/rite.sh with a payload on
        stdin, which is what actually runs, and covers the shim's action dispatch for free.
      - >
        IT WAS PROVEN RED BEFORE IT WAS TRUSTED GREEN. Run against the code as it stood, it
        reports 2 failures and exits 1; after the fix it passes. A gate that has never failed
        is not known to be a gate — this project's own standing rule, applied to itself.
      - >
        THE VERSION BUMP IS NOT HYGIENE: the install cache is a real copy, not a symlink, and
        `claude plugin update rite` answered "already at the latest version" against edited
        source. Without a bump, every test runs the previous install. This was discovered only
        because the fix appeared not to work.
    consequences:
      - "Any future hook Rite ships must be covered by the same shape assertion. A hook that is exercised only by hand is not verified, however carefully it is run."
      - "Editing Rite now has a release step. Whether the checker should enforce it — cache version vs repo version — is open as c-installed-copy-can-be-stale."
      - "The lesson generalises past hooks: `success` from a third-party harness means it did not crash, not that it did anything. Prefer an observation of the effect over a report of the attempt."
    verified:
      - "2 FAILED / exit 1 against the pre-fix code; PASS after. Both directions run this session."
      - "Plugin updated 0.1.0 -> 0.1.1; install cache now diffs clean against the repo."
      - "effortLevel: max survived `claude plugin update` — the 08-09 drop happened on `install`, and the two are not the same operation."
    proposed_by: claude
    confirmed_by_user: false

  - id: d-one-implementation-of-a-portability-rule
    date: "2026-09-09"
    title: "Case-exact lookup moves to scripts/ritefs.py; every marker test routes through it"
    context: >
      rite-check.py carried exists_exactly(), written specifically because macOS and Windows
      are case-insensitive and a repo must not get two verdicts on two platforms. It was then
      not used by the checker's own opt-in test, nor by either hook — all three found the
      .rite.yaml marker with Path.exists(). Raised as c-marker-lookup-not-case-exact.
    decision: >
      It is a bug, not an exemption. The predicate moves to scripts/ritefs.py as the single
      implementation; rite-check.py delegates to it, and rite_session_start, rite_session_end
      and rite-check all find the marker via ritefs.marker_present().
    rationale:
      - >
        The exemption argument — the marker is the author's file, so its spelling is their
        problem — fails on the standard's own terms. Opt-in decides whether ANY checking
        happens; getting it platform-dependent means a project is checked on Linux and
        invisible on a Mac. That is the exact outcome case_sensitive_name_matching exists to
        forbid, at the one point where it matters most.
      - >
        A rule implemented in one file and ignored in three is not a rule. The fix is not to
        copy the helper around but to leave one implementation with no second place to drift to.
    consequences:
      - "scripts/ritefs.py is a new module, stdlib only, no new dependency."
      - "A project carrying .Rite.yaml no longer opts in anywhere, consistently."
    proposed_by: claude
    confirmed_by_user: true

  - id: d-installed-copy-checked-by-test-not-by-rule
    date: "2026-09-09"
    title: "Cache-vs-working-tree drift is a TEST of Rite, not a rule of the standard"
    context: >
      c-installed-copy-can-be-stale: the install cache is a real copy and `claude plugin update`
      is version-gated, so editing source changes nothing until the version is bumped. It cost a
      real debugging detour on 2026-09-08.
    decision: >
      scripts/test-installed-current.py checks it: version match plus a content diff of the
      executable surface (scripts, skills, hooks, .claude-plugin). It skips with exit 2 where
      Rite is not installed. It is NOT a rite-check.py rule.
    rationale:
      - >
        WHY A CHECK AT ALL: the alternative was documenting the version bump as a release step
        in CONVENTIONS. That is a rule with no completion test, which is the precise thing this
        project exists to replace. Writing it down would have been the comfortable wrong answer.
      - >
        WHY NOT IN rite-check.py: the checker's subject is a PROJECT's conformance to the
        standard, and no other consumer of the standard ships a plugin. A delivery check there
        would make the checker partly about Rite itself, which nobody else can use.
      - >
        CONTENT AS WELL AS VERSION: an equal version with unequal bytes is the worse failure,
        because it looks current. Documents are excluded — a stale LOG.md in the cache is untidy,
        not broken, and failing on it would train people to ignore the test.
    verified:
      - "Written against a dirty tree and FAILED immediately with 5 real findings — the ritefs refactor was not installed. Bumped 0.1.1 -> 0.1.2, updated, PASS."
      - "effortLevel: max survived a second `claude plugin update`, consistent with the 08-09 finding that only `install` dropped it."
    consequences:
      - "Editing Rite now has an enforced release step: bump, update, and the test says so if you forget."
    proposed_by: claude
    confirmed_by_user: true

  - id: d-unparseable-is-red-absent-is-na
    date: "2026-09-09"
    title: "A file Rite cannot parse is RED and names the construct; a file the project never wrote stays NA"
    context: >
      c-na-conflates-absent-with-unparseable. Until today both reported
      "NA — file absent or unparseable". NA reads as nothing-to-see, so the checker stayed calm
      while knowing nothing. On 2026-09-09 it buried four real parser refusals across two
      projects, nine NA lines deep, and made a written prediction untestable: the run appeared
      to prove the parser never choked, and only calling riteyaml.load() by hand showed
      otherwise.
    decision: >
      parse_failure() is the single place that asks whether a PRESENT artifact can be read. A
      failure emits one RED naming the offending construct and line, the artifact's remaining
      tests are not run, and a single line states how many were skipped. Absence is untouched
      and still answered by the exists tests. An unparseable .rite.yaml is reported too, rather
      than silently falling back to defaults.
    rationale:
      - >
        THE TWO FACTS ARE ABOUT DIFFERENT SUBJECTS. Absent is a fact about the project, and
        often fine. Unparseable is a fact about RITE — it means the checker cannot do its job —
        and a tool must never report its own blindness in the same register as someone else's
        optional missing file.
      - >
        ONE CAUSE, ONE FINDING. Nine NA lines for a single unreadable file is noise that
        trains people to skim. The cascade is replaced by one RED plus one accounting line, so
        the skipped checks are stated rather than vanishing.
      - >
        THE MARKER MATTERS MOST. A .rite.yaml that fails to parse silently dropped every
        threshold and override. Running on defaults while the project believes its overrides
        apply is worse than not running: the verdict is wrong AND confident.
    verified:
      - "Proven red before trusted green: 3 failures against the pre-fix checker, PASS after."
      - "scripts/test-checker-verdicts.py — the checker's FIRST test. It had none."
      - "No change to rite (0 RED) or to hwprivacy / plumbing / claude-persistent, whose declared artifacts all parse. The fix fires only where something is genuinely unreadable."
    consequences:
      - "A project whose ROADMAP Rite cannot read now fails loudly instead of scoring well by omission."
      - "`parseable` is a precondition rather than a declared test, so it is reported without being in the spec's test list. If that proves confusing, declaring it is the fix — but the artifact inventory stays frozen at 13 either way."
    proposed_by: claude
    confirmed_by_user: true

  - id: d-single-harness-on-purpose
    date: "2026-09-09"
    title: "Rite targets Claude Code and no other harness — the constraint IS the product"
    context: >
      Held from the start and NEVER WRITTEN DOWN, which surfaced only when a competitor's design
      turned on it. Reading spscream/ai-floppy (c-prior-art-ai-floppy) showed a plugin that
      supports Claude Code and Cursor, ships no hooks at all, and says why in its own spec:
      "Cursor's hooks are not drop-in — camelCase event names, permission in place of
      permissionDecision, a flat output shape accepted beside the nested one, and some events
      absent entirely."
    decision: >
      Claude Code only. Not Cursor, not a generic coding-agent abstraction, not a portable
      subset. Recorded as a MISSION non-goal.
    rationale:
      - >
        THE CAPABILITY IS THE PRODUCT. What Rite sells is a check that fires whether or not you
        remember to run it. That requires a harness that runs a SessionStart hook and reads
        hookSpecificOutput.additionalContext. Cross-harness support means shipping only what
        the harnesses share, and this capability is not in the intersection — demonstrated, not
        assumed: the one plugin that took that route ended up with zero hooks.
      - >
        THE TRADE IS VISIBLE IN THE COMPETITOR. Their breadth cost them the mechanism; taking
        their route would cost Rite the same thing, in exchange for reach into an editor the
        author does not use. That is trading the only structural advantage for adoption, which
        d-goal-is-credibility already says is not the goal.
      - >
        AN UNWRITTEN ASSUMPTION IS NOT A DECISION. This was obvious to its author and invisible
        to everyone else, including to the next session. It is exactly the class of thing this
        project exists to convert into something a cold reader can find.
    consequences:
      - "Rite may use any Claude Code hook event without checking portability to another agent."
      - "A future request for Cursor or Copilot support is answered by this entry, not re-argued."
      - "Cross-platform still means OS — Linux, macOS, Windows — which is unchanged and still enforced. It never meant cross-harness, and the two were easy to confuse while only one was written down."
    chosen_by_user: true
    proposed_by: user

  - id: d-audience-is-the-author-not-a-market
    date: "2026-09-09"
    title: "Rite is built for its author, for people who already think this way, and as a portfolio artifact"
    context: >
      A prior-art find (spscream/ai-floppy) was surfaced as a competitive concern at high
      severity, with a proposed positioning sentence to defend the differentiator. The user
      rejected the framing outright.
    decision: >
      Rite has no market to defend. It is built for its author, for people who already think
      this way or want to, and as a portfolio artifact. Prior art, overlap and similar projects
      are NOT concerns and do not get concern entries.
    rationale:
      - >
        It is the operative form of d-goal-is-credibility, which already ruled out mass
        adoption. Credibility comes from one clear idea honestly executed with the negative
        findings left in — none of which is affected by someone else building something
        adjacent.
      - >
        A tool built to be used by its author every day has a completion test its author feels
        directly. A tool built to win a comparison starts optimising for the comparison, and
        the first casualty is the honest README that d-goal-is-credibility depends on.
      - >
        Concern entries are for things that require a decision. "Someone else built something
        similar" requires none, so filing it as a concern was a category error — it manufactured
        an obligation to respond where none exists.
    consequences:
      - "Do NOT open concerns for prior art, competitors or overlap. If a specific TECHNIQUE in another project is worth borrowing, that is a roadmap item on its own merits, named for the technique, never for the project it came from."
      - "The README needs no comparison section, no positioning paragraph, and no differentiator claim aimed at anyone."
      - "Technical facts learned from reading another project stay in LOG as facts. The ai-floppy reading is kept on that basis, including its unverified PreCompact lead."
    chosen_by_user: true
    proposed_by: user

  - id: d-status-json-dropped-not-deferred
    date: "2026-09-09"
    title: "status.json is dropped, not deferred; an artifact with no consumer is the mirror of a test that cannot run"
    context: >
      status.json was the second deliverable of checker-implementation and the only thing
      holding that item open. d-artifact-inventory deferred it on 2026-09-07 with the exact
      words "necessity asserted, not established". Two days and a working checker later,
      nothing had established it.
    decision: >
      Dropped from checker-implementation, which closes without it. Not added to the artifact
      inventory, which stays frozen at 13. If a consumer ever appears, it ships with that
      consumer as part of its work.
    rationale:
      - >
        EVERY CANDIDATE CONSUMER IS UNBUILT. The VS Code viewer is demoted to optional and does
        not exist; the watcher flag accumulator was accepted only on the condition that "the
        purpose proves itself in use", which cannot happen before the watchers exist; and the
        measured-counterpart-to-current_state job belongs to claims_match_filesystem, which
        needs a machine-readable claim surface rather than a JSON file.
      - >
        WHAT IT WAS FOR ALREADY WORKS. The SessionStart verdict reaches the model live, observed
        on 2026-09-09. A file carrying the same verdict adds a second surface that must be kept
        true, with nothing reading it and nothing checking it — this project's own failure mode,
        shipped voluntarily.
      - >
        THE SPEC ALREADY ARGUES THIS, IN ONE DIRECTION ONLY: "an artifact whose producer does not
        exist is the same error as a test that cannot run." The mirror holds and is now stated —
        an artifact whose CONSUMER does not exist is the same error.
      - >
        DROPPED, NOT DEFERRED, ON PURPOSE. Deferral keeps an obligation alive and quietly blocks
        an item, which is what happened here for two days. Dropping states that nothing is owed
        until something asks for it.
    consequences:
      - "checker-implementation closes, which empties near_term."
      - "The shape recorded in CLAUDE.md — tier 3, free_replace, generated, carrying its measurement time, the one file where a clock is mandatory — is preserved as a note for whoever eventually needs it. It is a sketch, not a commitment."
      - "mid_term status-json-as-flag-accumulator still stands on its own conditional terms; it is now the only route by which this file could return."
    chosen_by_user: true
    proposed_by: claude

  - id: d-claim-surface
    date: "2026-09-09"
    title: "Documents declare machine-checkable claims; claims_match_filesystem becomes real, and RED"
    context: >
      claims_match_filesystem was the last test parked in c-unimplementable-tests and the
      highest-value one in the standard. It exists for the api.pdf doc-rot class: a claim that
      reads perfectly and is flatly wrong. It bit FOUR times in two days — ARCHITECTURE,
      .rite.yaml with CONCERNS, ROADMAP.current_state, README — every instance caught by a
      human noticing, which is the mechanism this project exists to argue does not work.
    decision: >
      A document declares a `claims:` mapping of `absent:` and `present:` path lists. Two
      rules read it: claims_declared (level populated, YELLOW) fires when a core document
      declares nothing; claims_match_filesystem (level integrity, RED) fires when a declared
      claim is false, and NA when there is nothing to verify. Declared on readme, claude_md,
      architecture and roadmap.
    rationale:
      - >
        THE SCOPE WAS AS WRONG AS THE IMPLEMENTATION, and that was the find that reshaped the
        work. The rule was declared on CLAUDE.md ALONE. Not one of the four failures was in
        CLAUDE.md, so a fully implemented rule would have caught NONE of them. The README
        artifact even carried a comment saying "claims_match_filesystem covers it" while never
        declaring the rule — a consolidation recorded as done and never performed.
      - >
        PROSE IS NOT PARSED, DELIBERATELY. The obvious design — read paths out of a "not built"
        section — was tried against the real documents and rejected: ARCHITECTURE's own
        not-built block lists `hooks/` and `scripts/`, both of which EXIST, with the annotation
        naming what is missing inside them. That rule fires a false positive on day one, and a
        check that cries wolf is switched off within a week.
      - >
        TWO RULES BECAUSE SEVERITY COMES FROM THE LEVEL. The engine overrides a rule's returned
        severity with LEVEL_SEVERITY, so one rule cannot answer YELLOW for "nothing declared"
        and RED for "a declaration is false". Splitting them is what the existing machinery
        already supports, and it separates two genuinely different questions.
      - >
        INTEGRITY, NOT FRESH. The rule sat at level fresh, which caps it at YELLOW. A document
        that is confidently wrong is not merely stale, and the level is the only thing that
        decides whether the verdict is loud.
      - >
        WHY IT DOES NOT SIMPLY MOVE THE ROT: prose is vague and unfalsifiable ("no plugin"); a
        path is not. The discipline it creates is one sentence long — when you write that
        something does not exist, name it.
    consequences:
      - "First rule whose configuration comes from the ARTIFACT BEING CHECKED rather than from the standard. Every other rule reads test['value'] or art['structure']. Deliberate: the claims a project makes about its own tree are the project's to state."
      - "TWO LOCATIONS. The provenance header is required only in the docs directory, so README.md and CLAUDE.md carry none — and YAML front matter atop a README is rendered by the forge on the landing page, degrading the file the standard itself calls the highest-value one in the repo. Root-level Markdown therefore uses an HTML comment, `<!-- rite:claims ... -->`, which renders as nothing. Same parser, same shape."
      - "LIMIT, written into the spec rather than left to be discovered: path-shaped claims only. ARCHITECTURE's 'writes status.json' is a claim about BEHAVIOUR and passes untouched. Three of the four failures were path-shaped; the fourth was not."
      - "The other 11 projects gain YELLOW from claims_declared and nothing else. Verified: RED and GREEN counts on hwprivacy, plumbing and claude-persistent are unchanged."
      - "Coverage 49/57 -> 57/64. Version 0.3.0: a new rule in the standard is not a patch."
    verified:
      - "Proven red before green: all 10 new assertions failed against the pre-change checker."
      - "A planted lie fires: `absent: [scripts/rite-check.py]` in README produced RED naming the path and the direction."
      - "THE RETROSPECTIVE TEST. The tree at 71edd82 was extracted, README's own sentence — 'No plugin, no hooks, no slash commands' — transcribed into a claims block, and today's checker run against it: RED naming .claude-plugin/plugin.json, hooks/hooks.json and skills/end/SKILL.md. It catches the failure that motivated it."
    chosen_by_user: true
    proposed_by: claude

  - id: d-publish-main-in-full-no-export
    date: "2026-09-09"
    title: "The repository is published whole; the curated export is dropped before being built"
    context: >
      The ask was a dedicated folder holding curated COPIES of the publishable files, kept
      fresh by a sync script that would eventually also publish, carrying only "the right
      amount of the history of this plugin making".
    decision: >
      No export folder, no sync script, no second copy. `main` is published in full — LOG.md,
      docs/, HANDOFF.md and all. What the end user gets as a clean starting point is a
      `template/` directory of seed files shipped INSIDE the public repo, which is
      setup-hook-scaffolding.
    rationale:
      - >
        THE PREMISE WAS FALSE. The design assumed the development record could be kept back
        while the plugin was published. GitHub visibility is per-REPOSITORY, never per-branch:
        a public repo has every branch public, there is no private branch and no hidden
        worktree. Two separate repositories is the only split that exists, and that is two
        things to keep in sync — the drift problem this project exists to attack.
      - >
        AND THE USER THEN REMOVED THE REASON. Costin chose to publish main in full anyway, on
        the grounds that it is everything a developer would want to see. Once nothing is being
        hidden, an export is not a filter — it is a second copy of the same files with no job.
      - >
        WHAT SURVIVES IS BETTER AND ALREADY PLANNED. A seed set — seeded docs/, a genre:none
        HANDOFF, an empty-but-valid LOG — is a PRODUCT FEATURE rather than a release mechanism,
        and it was already on the roadmap as setup-hook-scaffolding, never connected to this.
        Built once, it serves both.
      - >
        The publishable/private distinction would also have needed its own completion test, or
        it becomes exactly the kind of discipline that fails quietly. Not building it removes
        that obligation rather than deferring it.
    consequences:
      - "Publishing means publishing the full LOG, including the 2026-09-09 entry about truncating scripts/rite-check.py to zero bytes. Kept deliberately: negative findings staying in is what MISSION claims, and the log is where that claim is either true or empty."
      - "Root-as-plugin already copies the whole repo into the install cache, so the install and the publish now show the same thing. One surface, not two."
      - "No `.export/`, no orphan branch, no worktree, no push refspec guard. None of it is needed."
    chosen_by_user: true
    proposed_by: user

  - id: d-stage-gates-the-standard
    date: "2026-09-09"
    title: "`stage` becomes the gating axis: a day-one project is not shown a screen of RED"
    context: >
      Raised by Costin on being told what a fresh install would report: "i did not imagine that
      immediately after install plugin will start and report all red. it should be some flag
      defined that the project just started". A real design fault — a tool that opens by
      listing everything you have not done yet gets uninstalled the next day.
    decision: >
      The flag already exists and was doing almost nothing: `stage:` in .rite.yaml, vocabulary
      [idea, spec, build, polish, shipped, maintain, archived]. It becomes the axis that gates
      what the standard requires. A scaffolded project starts at `idea` and is asked almost
      nothing; requirements switch on as the stage advances.
    rationale:
      - >
        NOTHING EXPIRES AND NOTHING NAGS. A grace PERIOD would be a clock, and a clock that runs
        out produces a warning nobody asked for — the gate that gets switched off. A stage
        changes when the human says the project changed, which is a real act rather than a chore
        to remember.
      - >
        IT GIVES stage A JOB. On 2026-09-09 it was noted that stage had exactly one consumer,
        the LICENSE check, and that a concept kept alive by a single caller is usually
        under-used or should be inlined. This is the answer: under-used.
      - >
        A DAY-ONE PROJECT HAS NOTHING TO BE STALE AGAINST. The freshness tier compares docs to
        source mtime; at stage `idea` there is often no source. Gating by stage removes a class
        of degenerate verdicts rather than tuning thresholds around them.
    consequences:
      - "Which requirement switches on at which stage is NOT yet specified. That is the work, and it belongs with setup-hook-scaffolding so the seed set and the gating are designed against each other."
      - "d-drop-claims-match-stage stands: this is about what the standard REQUIRES at a stage, not about inferring a project's actual stage from its prose."
    chosen_by_user: true
    proposed_by: user

  - id: d-ci-reports-its-own-coverage
    date: "2026-09-10"
    title: "CI runs the gates and states what it did not run; a skip is never folded into green"
    context: >
      Seven gates existed and nothing ran them but a human who remembered to. On 2026-09-09
      that failed exactly as this project predicts rules fail: scripts/rite-check.py was
      truncated to zero bytes and no gate caught it, because no gate ran. HANDOFF.md named CI
      as the next move for that reason.
    decision: >
      .github/workflows/gates.yml runs every gate on every push, through .github/run-gates.py,
      which reads the gate list from .github/gates.yaml using Rite's own riteyaml parser. The
      runner distinguishes exit 0 pass / 1 fail / 2 SKIP and PRINTS ITS COVERAGE — "5 of 7
      gates ran" plus the names of the two that did not — rather than reporting an unqualified
      green. A gate that exits 2 without declaring `skip_means` in the gate list is treated as
      a FAILURE.
    rationale:
      - >
        THIS IS rite-check.py's OWN RULE, ONE LEVEL UP. The checker already refuses to let a
        rule it cannot implement look like a rule that passed: it reports NA, never silence.
        The gates deserve the same treatment, because a green badge covering five sevenths of
        what it appears to cover is precisely the plausible-but-wrong artifact this project
        exists to prevent. That is also why a chain of `run:` steps was rejected — a shell
        chain has two answers and must either fail on a skip or swallow it.
      - >
        PyYAML IS AN ORACLE, NOT A DEPENDENCY, AND CI DOES NOT INSTALL IT. Costin's call.
        test-riteyaml.py therefore SKIPS in CI, and riteyaml's correctness claim is enforced
        only on a developer machine. Written down because the alternative reading is
        catastrophic: a future session that sees `pip install pyyaml` in a workflow would
        conclude d-stdlib-only-yaml-subset had been abandoned, and one that sees it missing
        would "fix" the oversight. Neither is right. The gap is declared, not hidden.
      - >
        test-installed-current.py can NEVER pass in CI — a runner has no installed plugin — so
        it always skips there. That is a permanent, structural gap rather than a temporary one,
        and it is the clearest case for why skips had to be visible.
      - >
        UBUNTU ONLY, ALSO COSTIN'S CALL, and it leaves the sharpest gap in the repo: the spec
        declares targets [linux, macos, windows] and three rules at severity:correctness, and
        none of them is tested by anything. Recorded as ci-portability-matrix in ROADMAP
        mid_term so it is a declared gap rather than an omission.
      - >
        THE GATE LIST HAS ONE HOME. docs/ARCHITECTURE.md describes the gates for a human; it
        does not define them. A second hand-maintained copy inside the runner would be a drift
        surface, which is the failure this project attacks. Reading the list with riteyaml also
        exercises the parser in CI on every push, at no cost.
      - >
        THE SUPPORTED PYTHON FLOOR IS DECLARED IN .github/gates.yaml, not only in the workflow.
        Nothing in this repo declared a floor before today. A version pinned solely in a
        workflow step is a supported floor that no human-visible file states, which is a
        hardcoded value with no home.
    consequences:
      - "CI plumbing lives in .github/, outside the four paths test-installed-current.py compares, so it never forces a plugin version bump. The plugin stays at 0.3.0."
      - "The first run of the runner failed, correctly: .github/workflows existing made claims_match_filesystem RED in FOUR documents. The claim updates had to ship in the same commit as the workflow, or CI would have been born red. HANDOFF.md said three files; it was four."
      - "Five of seven gates is now a number in the README and in ROADMAP current_state. It goes stale the day the matrix lands, and claims_match_filesystem will not catch it — it checks paths, not counts."
      - "Nothing is published. The repo is private; this decision is about running the gates, not about releasing."
    chosen_by_user: true
    proposed_by: claude

  - id: d-session-scope-excluded-from-ci
    date: "2026-09-10"
    title: "A test may declare `scope: session`; CI excludes that scope, and says it did"
    context: >
      CI's second run went red, correctly, on written_not_older_than_newest_log_entry: the
      handoff was dated 2026-09-09 and the newest LOG entry 2026-09-10, so the checker reported
      "session did not close" — of a session that was still open. Nothing was broken. The check
      is right and the placement was wrong.
    decision: >
      The standard may mark a test `scope: session`. rite-check.py gains
      --exclude-scope=SCOPE, CI's self-check gate passes --exclude-scope=session, and every
      excluded test is reported as NA naming the exclusion. Exactly one test carries the scope
      today: written_not_older_than_newest_log_entry.
    rationale:
      - >
        THE PROTOCOL GUARANTEES THE RED. skills/log/SKILL.md says to log as work happens, not
        at the end, because a session that dies before /end must still leave a record. The
        first entry any session writes makes the handoff older than the newest log entry. So
        this test is RED for the entire working life of every session that follows the
        instructions, and only /end clears it. In CI — which runs at whatever mid-session
        moment someone pushes — that is a gate red by design, and a gate red by design is the
        gate that gets switched off within a week.
      - >
        THE QUESTION IS ANSWERABLE AT SessionStart AND NOT IN A PIPELINE. At SessionStart it
        reads "did the LAST session close?", which has a true answer. In CI it reads "has the
        session running right now closed?", which is not a defect to fix but a question with no
        meaning in that context.
      - >
        EXCLUDED IS NOT SILENT. The NA line names the scope and the flag on every run. rite's
        own rule is that a check that vanished and a check that passed must never look alike,
        and an exclusion mechanism is precisely where that rule is easiest to betray.
      - >
        SCOPE IS A CALLER'S STATEMENT, NOT A PROJECT'S. --exclude-scope is deliberately a CLI
        flag and deliberately NOT settable in .rite.yaml. It says where a check runs. Letting a
        project exclude a scope for itself would be a project switching off its own session
        discipline, which is the whole thing being enforced.
      - >
        NOT A ONE-MEMBER MECHANISM, though it has one member today.
        log_timestamps_not_in_the_future and nag_delivered_once are declared in the protocol
        and unimplemented; both are session-scoped by the same test. The scope exists ahead of
        them on purpose.
    corrected_2026_09_10: >
      THE RATIONALE ABOVE IS WRONG ABOUT log_timestamps_not_in_the_future, corrected within the
      hour and left in place rather than rewritten, per the precedent set by
      c-yaml-subset-too-narrow-for-the-wild. That test — no LOG entry may carry a timestamp
      later than the file's own mtime — holds at every moment of a session, including the
      middle. It never depends on whether the session closed, so it is NOT session-scoped and
      belongs in CI at full strength.
      Applying the actual test for the scope — does the verdict depend on whether the session
      running right now has closed? — only nag_delivered_once joins written_not_older_than_
      newest_log_entry. session_end_decision_recorded also fails the test: it reads front
      matter that is already there mid-session.
      So the tier has one member today and one future member, not two. That is thinner than
      claimed and the claim should not have been made without applying the test to each name.
    consequences:
      - "The five implemented completion tests are ALL end-of-session tests. Nothing in the standard checks anything mid-session — the `during` phase has no enforcement and waits on the PostToolUse watcher layer. Recorded in the protocol's honest_limits, replacing a line that had gone false."
      - "SessionStart keeps the check at full strength: no flag there, still RED, still the signal that the last session did not close."
      - "The plugin goes to 0.4.0. A new field in the standard plus a new flag on the checker is not a patch, on the same reasoning that made a new rule 0.3.0."
      - "main was left red between the log push and this fix, because the gate result was not read before pushing. The failure was real and CI reported it correctly."
    chosen_by_user: true
    proposed_by: claude

  - id: d-stage-is-the-gating-axis
    date: "2026-09-10"
    title: "Every artifact declares required_from_stage; tier stops deciding what is required"
    context: >
      d-stage-gates-the-standard accepted on 2026-09-09 that stage should gate the standard, and
      left the mapping unspecified — the real work. Measured on 2026-09-10, an empty project
      declaring `stage: idea` scored 9 RED and 0 GREEN. Declaring the stage changed NOTHING,
      because stage gated exactly one artifact (LICENSE) while tier gated the other twelve.
    decision: >
      Each artifact declares `required_from_stage`. The engine gates on it, so an artifact the
      project has not reached is NA naming the stage rather than RED. `tier` becomes a grouping
      label. The mapping: idea -> LOG, HANDOFF. spec -> README, CLAUDE.md, MISSION, ROADMAP.
      build -> ARCHITECTURE, CONVENTIONS, DECISIONS. shipped -> LICENSE. PLAN, CONCERNS and the
      memory mirror declare nothing and stay optional forever.
    rationale:
      - >
        NOTHING WAS INVENTED. required_from_stage already existed as an artifact field and an
        implemented rule, used by LICENSE alone. This generalises the mechanism that was already
        there rather than adding a second one beside it.
      - >
        `idea` STILL REQUIRING LOG AND HANDOFF IS THE ONE OPINIONATED CALL, and it is deliberate:
        it says even a day-old project closes its sessions, which is Rite's entire claim. The
        alternative — requiring literally nothing at idea — would make the plugin inert exactly
        when a habit is being formed. Both files are created by the scaffolding, so day one
        opens GREEN rather than on two REDs.
      - >
        THE OBJECTION THAT KILLED STAGE-GATING IS VOID. On 2026-09-08 Tier 1 was moved off stage
        onto the marker because stage was "a stage Rite has no reliable way to read". The marker
        now declares it, and the project is the only honest source there could be.
    no_stage_declared: >
      THE ANTI-LOOPHOLE, and the load-bearing half. A marker with no `stage` keeps the old
      tier-based behaviour in full. Absence is not a claim: if a missing declaration meant
      "require nothing", deleting one line would switch the standard off — a hole straight
      through the product. Declaring `idea` is an act and earns the leniency. This also keeps
      --force runs against projects that never opted in scoring exactly as before.
    consequences:
      - "Day one goes from 9 required artifacts to 2. Verified: an empty project at `idea` carrying only LOG and HANDOFF scores 0 RED."
      - "Rite's own verdict does not move — `build` requires tier 0+1, all present, still 0 RED. The mapping must not grade its author on a curve."
      - "stage_vocabulary.committed_from was DELETED. It claimed to be the stage at which Tier 1 becomes required while the Tier 1 artifacts recorded that rule as replaced — dead metadata contradicting a live rule, on the axis being redesigned."
      - "The rule `required_from_stage` was deleted from the checker: the engine gate supersedes it, and two implementations of one decision is how they drift. LICENSE's standalone test became a plain file_present, like every other artifact."
      - "A DECLARATION BEATS TIER, and getting that backwards was caught by a fixture rather than by review: an earlier gate asked `tier >= 2 or ...`, which let tier short-circuit the stage, so LICENSE stayed optional at EVERY stage — a project could publish with no licence, the exact failure the field exists to prevent. The stage-progression fixture expected 8 RED at `shipped` and saw 7."
    chosen_by_user: true
    proposed_by: claude

  - id: d-standard-version-declared-never-honoured
    date: "2026-09-10"
    title: "A project may declare which standard it targets; a mismatch is reported, never honoured"
    context: >
      c-standard-version-policy, open since 2026-09-07 at severity low, asked how a project
      declares WHICH version of the standard it targets and what happens on a bump. Its own text
      said it "only bites after the first external user exists" — and publishing is precisely
      what manufactures that user, so it blocked publish-github.
    decision: >
      `.rite.yaml` may declare `standard_version`. Absent means current, and is silent. A
      mismatch against `schema_version` in spec/project-standard.yaml is YELLOW, naming both
      versions. Rite NEVER runs an old rule set.
    rationale:
      - >
        PINNING IS A PROMISE THIS PROJECT CANNOT KEEP. Running the rules a project pinned to
        would mean shipping and maintaining every past standard forever. A one-person project
        cannot honour that, and a compatibility promise that is not honoured is worse than none
        — it converts a visible gap into a silent wrong answer.
      - >
        YELLOW RATHER THAN RED because the project is not broken; it is out of step, which is
        information rather than a defect. RED would also make a standard bump retroactively fail
        every project that had done nothing wrong.
      - >
        NO NEW VERSION SOURCE. The standard already carries schema_version. Adding a second
        version field to describe the same document is how two sources of truth start.
      - "Unrelated to the schema_version in document front matter, which versions the shape of that document, not the standard."
    consequences:
      - "c-standard-version-policy is retired as settled, with this as its outcome."
      - "Clears one of the two blocked_on lines under publish-github."
      - "The severity was wrong while it was open: `low` was true only until publication, and publication was the event that made it bite."
    chosen_by_user: true
    proposed_by: claude

  - id: d-stage-advances-when-the-repo-goes-public
    date: "2026-09-10"
    title: "Rite declares `shipped` in the same commit that makes the repository public"
    context: >
      .rite.yaml declares `build`, and LICENSE is required_from_stage: shipped — so the LICENSE
      check reports NA on the one project that actually ships a LICENSE. That left an open
      question about what stage a published Rite declares, blocking publish-github.
    decision: >
      Stage advances to `shipped` in the SAME commit that flips the repository to public. Not
      before. Rite stays `build` until then.
    rationale:
      - >
        IT MAKES THE LICENSE CHECK FIRE EXACTLY WHEN IT MATTERS. A project that publishes without
        a licence is the failure the rule exists for, and that moment is publication — not some
        earlier point chosen to make a check go green.
      - >
        A STAGE IS A CLAIM ABOUT REALITY, NOT A DIAL. d-stage-gates-the-standard says the user
        advances the stage when the project genuinely changes. Declaring `shipped` while private
        would be lying to our own checker to turn a verdict green, which is the failure mode this
        project exists to prevent — and .rite.yaml already says so in as many words.
    consequences:
      - "No code, and nothing changes today. Clears the second blocked_on line under publish-github."
      - "The commit that publishes is therefore not a one-line visibility flip: it also moves stage and turns the LICENSE check live."
    chosen_by_user: true
    proposed_by: claude

  - id: d-scaffold-only-what-can-be-honest
    date: "2026-09-10"
    title: "/rite:init seeds a project to stage `idea` and refuses to write documents nobody has written"
    context: >
      Stage gating landed the same day and took a day-one project from 9 RED to 2. The last two
      are LOG.md and HANDOFF.md, which a newcomer still had to hand-write correctly before the
      tool would stop complaining. setup-hook-scaffolding is the other half.
    decision: >
      `/rite:init` writes exactly three files — .rite.yaml at `stage: idea`, LOG.md with one real
      entry, HANDOFF.md with `genre: none` — and stops. It seeds nothing for `spec` or beyond.
      It never overwrites, and is safe to re-run.
    rationale:
      - >
        `idea` IS THE ONLY STAGE A MACHINE CAN SATISFY HONESTLY. A log carrying one true entry
        is a complete log. A `genre: none` handoff is a complete handoff — the standard says so
        outright: a real answer, the assertion that none is needed, made by someone who
        considered the question. Both are finished documents, not placeholders.
      - >
        EVERY OTHER ARTIFACT FAILS THAT TEST. A seeded MISSION.md that nobody has written is a
        lie that passes file_present, and the `populated` tests cannot distinguish a filled
        template from an unfilled one — give it enough headings and it scores. Seeding prose
        would manufacture the confidently-wrong document this project exists to attack, and
        would do it at first contact, which is the worst possible moment.
      - >
        SO THE REFUSAL IS THE FEATURE. Advancing past `idea` stays a human act, and the checker
        already names precisely which files it wants. A tool that says "you must write this
        yourself" is more useful than one that fabricates a document to turn a verdict green.
      - >
        THE SEED CONTENT LIVES IN template/, NOT IN STRING LITERALS. It is config a human should
        be able to read and edit, and hardcoding it in the scaffolder would be exactly the kind
        of buried value this project forbids.
    the_templates_cannot_be_literal: >
      Both seeded files carry load-bearing dates: LOG.md is checked by
      newest_entry_within_days_of_activity (30) and HANDOFF.md by not_expired. A template with a
      baked date starts that clock the day it is COMMITTED and ships already stale, so the
      templates carry substitution tokens read from the machine clock at scaffold time. Note the
      inversion of the usual trap: generated output must never carry a timestamp, while
      scaffolded output must — and the difference is when the clock is read.
    consequences:
      - "Verified: an empty directory scaffolded and checked reports 0 RED, 0 YELLOW, 8 GREEN."
      - "template/ is NOT a 14th artifact. d-inventory-frozen-at-13 governs what a PROJECT carries; this is plugin content, in the same family as skills/. Stated here because the freeze exists precisely to stop additions being absorbed without argument."
      - "scripts/test-scaffold.py is gate 9, and it exists because the roadmap's requirement that each seed be a 'valid smallest instance' was untestable where it was written — template/LOG.md is not at a canonical path, so the checker never looks at it. Scaffolding into a temp directory and checking the RESULT is the form of that claim that can fail."
      - "It failed immediately and usefully: the first template/LOG.md carried a prose preamble explaining the log format, and entries_parse counted those nine lines as broken entries. Every project Rite scaffolded would have opened on a YELLOW produced by Rite's own seed file. Prose also has no business in an append-only file, where it becomes a header nobody can ever tidy."
    chosen_by_user: true
    proposed_by: claude

  - id: d-stage-deferred-checks-are-collapsed
    date: "2026-09-10"
    title: "Checks a project's stage has not reached are collapsed into a counted line, never dropped"
    context: >
      Found while writing an honest README example, and only because the example was generated
      rather than invented. A project at stage `idea` printed 54 lines to convey ONE finding —
      46 of them saying "not required before stage X". Rite's own report is 5 lines. Stage
      gating had taken the RED count from 9 to 0 and replaced a wall of RED with a wall of NA.
    decision: >
      The report prints one counted line per deferred stage, naming the artifacts waiting there.
      54 lines becomes 15. The findings stay in the list and in the NA total; only their
      DISPLAY changes.
    rationale:
      - >
        IT IS HALF A FIX OTHERWISE. d-stage-gates-the-standard exists because a tool that opens
        by listing everything you have not done yet gets uninstalled the next day. Lowering the
        severity while keeping the volume answers the letter of that and not the point.
      - >
        COLLAPSED, NOT DROPPED, and the distinction is the whole reason this is safe. The count
        and the artifact names are both still printed, so a check that is waiting and a check
        that passed still do not look alike — the rule that governs NA everywhere else in this
        checker. Dropping them would have been simpler and would have broken it.
      - >
        THE TOTALS ARE UNTOUCHED. Collapsing is a display choice; the moment it changes a count
        it has become a verdict change wearing a formatting disguise. The fixture asserts the NA
        total explicitly for that reason.
    consequences:
      - "A new fixture in test-checker-verdicts.py asserts the line count, the summary's own count, that every deferred artifact is still named, and that the NA total is unchanged. Proved red by disabling the collapse: 68 lines, fixture fails."
      - "It caught two of my errors immediately — numbers copied from the wrong fixture, and an older case that assumed ARCHITECTURE prints its own lines."
      - "Finding gained a `deferred_to` field. It carries display grouping only and never affects a verdict."
    chosen_by_user: true
    proposed_by: claude

  - id: d-one-home-for-the-stage-mapping
    date: "2026-09-10"
    title: "The stage mapping is generated into hand-written files, and a guard stops new copies"
    context: >
      On 2026-09-10 the stage->artifact mapping was hand-copied into README.md,
      template/.rite.yaml and CLAUDE.md on the same day the mechanism it describes was built —
      c-stage-table-duplicated-in-three-places. Building the fix found a FOURTH copy the concern
      had not counted, in ROADMAP.current_state.
    decision: >
      BOTH halves, not one. (1) spec/project-standard.yaml gains `generated_blocks`, and
      `render-standard.py --blocks` fills a marker-fenced region inside README.md and
      template/.rite.yaml from artifacts[].required_from_stage; `--blocks --check` is a gate.
      (2) scripts/test-stage-table-guard.py fails when three stage names appear near three
      artifact names outside such a block, in the live rewrite-only documents.
      CLAUDE.md's copy and ROADMAP's were DELETED rather than generated.
    rationale:
      - >
        GENERATION AND A GUARD ANSWER DIFFERENT QUESTIONS, which is why one alone was not
        enough. Generation removes drift from the copies that EXIST. It is structurally blind to
        a copy that does not exist yet: a new paragraph enumerating the stages is not drift from
        anything, so --blocks --check would never look at it. Four copies appeared in one day
        by exactly that route.
      - >
        REMOVING A COPY BEATS MECHANISING ONE. CLAUDE.md stated the mapping as a prose sentence
        mid-bullet; a marker block there would have forced a table into a document that is
        dense prose by design. Fewest copies wins, and the bullet now describes the mechanism
        instead of restating the data.
      - >
        THE GUARD READS ONLY WHAT MAY LEGALLY BE EDITED. LOG.md, DECISIONS.yaml and ROADMAP's
        milestones zone are append-only records of what was true then. A gate that fails on a
        file nobody may fix is a gate that gets switched off within a week, which is the same
        argument that keeps a clock out of generated output.
      - >
        THE TARGET LIST LIVES IN THE YAML, not in the renderer. A path list that exists only in
        code is a hardcoded value with no human-visible home, and this file is already the
        authority for what is generated.
    evidence:
      - "The README table generated BYTE-IDENTICAL on the first run. template/.rite.yaml did not: its hand-written copy abbreviated `docs/MISSION.md` to `MISSION`. The copies had already begun to diverge."
      - "Both gates were proved to FAIL before being trusted — a row was added to the README table, and a fifth copy was pasted into docs/MISSION.md. Each was restored from a file copy, never `git checkout`."
      - "The guard found the fourth copy nobody had counted, in ROADMAP.current_state."
    corrects: >
      A FALSE PREMISE IN d-stage-advances-when-the-repo-goes-public, recorded here because that
      entry is append-only and stays as written. Its context says LICENSE "reports NA on the one
      project that actually ships a LICENSE". It does not, and did not then. Verified 2026-09-10
      by running the checker against a `stage: shipped` copy of this tree: LICENSE is GREEN at
      `build` and GREEN at `shipped`, because `required_from_stage` gates whether an artifact is
      DEMANDED, not whether it is CHECKED when present. The stage decides only whether a MISSING
      LICENSE is RED or NA. CLAUDE.md carried the same error and, being rewrite-only, was
      corrected in place. The DECISION that entry reached is unaffected — advancing the stage on
      publication is still right, for the reasons it gives.
    chosen_by_user: true
    proposed_by: claude

  - id: d-attribution-is-authorship-not-mention
    date: "2026-09-10"
    title: "A plan belongs to the session that WROTE it, proved from the transcript, or to nobody"
    context: >
      c-plan-attribution blocked port-mirror-memory since 2026-09-07, calling itself "the only
      genuinely hard part" and proposing mtime correlation or content inspection.
    decision: >
      Attribution reads session transcripts at ~/.claude/projects/<slug>/*.jsonl and accepts
      exactly two proofs of authorship: a Write whose input.file_path is the plan, or an
      ExitPlanMode whose input.planFilePath is. Anything else — a Bash command, prose, a path in
      tool OUTPUT — is a mention and attributes nothing. A plan with no proof is reported
      unattributable and skipped. Two sessions claiming the same plan is reported as a conflict,
      never resolved by picking one.
    rationale:
      - >
        MENTION IS NOT AUTHORSHIP, and the cost of conflating them was measured rather than
        imagined. The first implementation matched the plan's path anywhere in a transcript and
        mis-attributed FIVE of thirteen plans. The contamination was self-inflicted: the session
        building the attributor ran `ls ~/.claude/plans/`, so rite's own transcript came to
        mention every plan on the machine. The act of measuring changed what was measured.
      - >
        IT WAS CAUGHT ONLY BY DISAGREEMENT. The new numbers contradicted a shell measurement
        taken twenty minutes earlier; nothing about the wrong answer looked wrong on its own.
        That is the argument for writing a measurement down before trusting the tool that
        replaces it — and the reason the regression test uses synthetic fixtures, so it can fail
        for a reason about the code.
      - >
        REFUSE RATHER THAN GUESS, the rule riteyaml already lives by. Placing a plan by mtime
        proximity would produce an attribution indistinguishable from a correct one after the
        fact, which is worse than leaving it uncopied and saying so.
      - >
        IT MAKES watcher-plan-copy-on-create AN OPTIMISATION, not a prerequisite. That item
        exists to copy a plan at creation because attribution "is only hard retroactively".
        Retroactive attribution now works, so the watcher buys latency and nothing else.
    limits:
      - >
        ATTRIBUTION NAMES THE SESSION'S PROJECT, NOT THE PLAN'S SUBJECT, and this repo holds the
        counterexample: docs/PLAN-2026-09-07-project-standard.md is rite's founding plan, written
        from a claude-persistent session because rite did not exist yet. Transcript attribution
        says claude-persistent and the human who filed it under rite was right. An existing copy
        therefore always wins, and the copier never moves or rewrites one.
      - "Dedupe is keyed on CONTENT, not source filename: ~/.claude/plans/<name>.md is REUSED across sessions. calm-tinkering-kahan.md held this repo's publishing plan in the morning and its copier plan in the afternoon."
    chosen_by_user: true
    proposed_by: claude

  - id: d-pattern-paths-and-declared-name-shapes
    date: "2026-09-10"
    title: "An artifact with many instances declares a glob for presence and a regex for shape"
    context: >
      plan_copy declared path "docs/PLAN-YYYY-MM-DD-<slug>.md" and rite-check.py compared it with
      exists_exactly, a literal case-sensitive test. No file can be named YYYY-MM-DD, so the
      artifact was absent on every project forever and filename_matches_canonical — the test
      whose job is to check a plan copy's NAME — had never run against one.
    decision: >
      Artifacts may declare `path_pattern` (a glob) for presence and `canonical_name_pattern`
      (a regex over the repo-relative path) for shape. `path` remains the canonical display
      name. Renaming the artifact to a literal path was rejected: there are legitimately many
      plan copies per project, and one filename would be a worse lie than the silence.
    rationale:
      - "Glob hits are re-verified through ritefs.exists_exactly, because Path.glob matches case-insensitively on macOS and Windows — the same repo would otherwise give two verdicts."
      - >
        THE SECOND KEY CAME OUT OF BUILDING THE FIRST. filename_matches_canonical initially held
        the PLAN regex inside the checker. That is a hardcoded value with no human-visible home,
        and it was silently wrong for the very next artifact to declare the rule — script_copy,
        whose leaf is an arbitrary filename under a dated directory. Caught because the artifact
        went YELLOW with all 20 instances "wrong" the moment it was declared.
    chosen_by_user: true
    proposed_by: claude

  - id: d-session-scripts-are-the-fourteenth-artifact
    date: "2026-09-10"
    title: "The scratchpad scripts a session writes are archived, and the inventory goes to 14"
    context: >
      The inventory was FROZEN at 13 on 2026-09-07, a 14th requiring a decision, with
      script-produced files outside the freeze only until their producers exist. rite_copy.py is
      that producer, so the entry is due.
    decision: >
      script_copy is the 14th artifact: docs/session-scripts/<ISO date>/<name>, write_once,
      tier 3, layer local. Sources are *.py and *.sh at the root of
      /tmp/claude-<uid>/<slug>/<session>/scratchpad.
    rationale:
      - >
        THE SCRATCHPAD IS IN /tmp AND DOES NOT SURVIVE A REBOOT. The scripts that performed a
        commit's edits are the only record of HOW it was made, and today four commits came out
        of twenty such scripts. Late is the same as never, so this runs from SessionEnd as well
        as /rite:end.
      - >
        GROUPED BY DATE, unlike plan_copy which is flat. One session produced twenty files; a
        few such sessions would bury docs/ under machinery and make the documents harder to
        find, which is the opposite of what docs/ is for.
      - "Attribution is free, unlike plans: the scratchpad path already contains the project slug."
      - "Narrow on purpose about what counts. The session that built this had a README.md.bak and a shipped-probe/ tree in the same directory; neither is a script."
    chosen_by_user: true
    proposed_by: claude

  - id: d-git-bash-required-on-windows
    date: "2026-09-10"
    title: "Git Bash is required on Windows; the PowerShell hook path is withdrawn, not built"
    context: >
      The spec's coverage list promised four rows, the fourth being "Windows without Git for
      Windows -> PowerShell -> the .ps1 shim". hooks.json named `bash rite.sh` for every event
      and never referenced the .ps1, so that row described an intent nothing implemented. CI
      passed the .ps1 throughout by invoking it directly.
    decision: >
      Git Bash is REQUIRED on Windows. Every hooks.json entry declares `shell: bash`. The fourth
      coverage row now says hooks do not run without Git Bash. hooks/rite.ps1 is kept as a
      manual entry point and is not a hook target.
    rationale:
      - >
        A HOOK ENTRY SUPPORTS NO PER-PLATFORM CONDITIONAL — the hooks reference says so
        outright. One command string must serve every platform, and none does: `bash X` fails
        under PowerShell, a bare .sh path fails under PowerShell, a bare .ps1 path fails under
        sh. Exec form skips the shell entirely and would solve it, except it needs one
        executable name resolving everywhere — the exact problem the shim exists for, and this
        development machine has no bare `python` on PATH at all.
      - >
        DECLARING `shell: bash` MAKES THE REQUIREMENT VISIBLE. It changes nothing where Git Bash
        exists; where it does not, it removes a silent fallback to a PowerShell that could only
        fail at our command string. A stated requirement beats an implied one.
      - >
        NARROWING A FALSE CLAIM IS A FIX. The row cost nothing to write and would have cost a
        Windows user their whole install, silently. Withdrawing it is not a retreat from
        portability — CI still runs all three platforms — it is the difference between what
        Rite does and what it once hoped to.
    not_taken: >
      Two hook entries with explicit `shell:` fields, one per platform. The docs do not specify
      what a hook declaring an unavailable shell does — skip, error, or fall back — and building
      on undocumented behaviour is guessing, which is the rule riteyaml and the plan attributor
      both already live by. Revisit if it is ever specified.
    evidence: >
      Answered without a Windows machine, from the vendor docs, after the shipped binary proved
      inconclusive — the authority order that memory rule already prescribes. The binary's
      "hooks.*win32" hits were minified JS spanning long lines, not hook-platform code.
    chosen_by_user: true
    proposed_by: claude

  - id: d-one-home-for-the-gate-count
    date: "2026-09-10"
    title: "The gate count is generated where it earns its place and deleted where it does not"
    context: >
      .github/gates.yaml is the authority for the gate list, and the COUNT was hand-copied into
      README, CLAUDE.md, docs/ARCHITECTURE.md and ROADMAP.current_state. It went 9 -> 11 -> 12
      -> 13 in a single day; each move falsified four or five sentences, and the last also moved
      a second derived number, the skip count. On the final pass README still opened "Nine gates
      run on every push" above a corrected total.
    decision: >
      Two rite:generated blocks fed from .github/gates.yaml — `gate-counts` into README and
      `gate-list` into ARCHITECTURE. CLAUDE.md's and ROADMAP.current_state's copies are DELETED
      and point at the file. `generated_blocks` gains `source_file`, so a block may generate
      from something other than the standard.
    rationale:
      - >
        GENERATE WHERE THE NUMBER EARNS ITS PLACE, DELETE WHERE IT DOES NOT. A stranger reading
        the README is deciding whether to care and a count helps. An agent reading CLAUDE.md and
        a session reading current_state need to know WHERE the gates are declared, which is more
        durable than how many there are. Fewest copies wins, exactly as with the stage table.
      - >
        THE SKIPPED COUNT NEEDS NO SECOND SOURCE. A gate declaring `skip_short` is a gate that
        can skip, so both numbers and every reason come from one file. `skip_short` was added
        beside the existing `skip_means` — the same fact in one clause, for prose.
      - >
        `source_file` IS THE GENERAL FIX. Every block until today generated from the standard,
        which would have forced the gate list into spec/project-standard.yaml to be readable —
        recreating the copy the block exists to remove. Blocks are now source-agnostic.
    evidence: >
      Proved by adding a fictional 14th gate to .github/gates.yaml. Both documents were flagged
      stale, the count moved 13 -> 14 and 3 -> 4, and "10 of 13" became "10 of 14" — with no
      document edited by hand. Restored byte-identical afterwards.
    chosen_by_user: true
    proposed_by: claude

  - id: d-checkpoint-is-not-an-ending
    date: "2026-09-10"
    title: "/rite:update brings the record back to true mid-session and deliberately cannot close it"
    context: >
      The protocol has declared a `during` phase since 2026-09-08, and honest_limits said it had
      no enforcement at all — mirror_memory, log_continuously and clock_per_entry were
      disciplines an agent must remember, "the exact category this project exists to abolish".
      Measured cost on 2026-09-10: ROADMAP.current_state read "Stage `build` ... version 0.8.1"
      for hours while the repository was public and the plugin eleven versions on.
    decision: >
      A fourth `during` step, `checkpoint`, reachable as /rite:update. It takes the end phase's
      RECORD steps — distil the log, bring the docs true, close anything that finished, copy what
      was written outside, run the checks — and deliberately omits the handoff decision and the
      memory write.
    rationale:
      - >
        A LONG SESSION IS NOT ONE EVENT. Every implemented completion test is an end-of-session
        test, so a document can stay false all afternoon and the standard stays green. /rite:end
        caught current_state at the close; nothing could have caught it sooner.
      - >
        OMITTING THE HANDOFF IS WHAT KEEPS /rite:end THE CONTRACT. A checkpoint that wrote a
        handoff would be an ending under a gentler name, and /rite:end's single weakest link is
        already that it only fires if the user types it (c-status-line-presence). The mitigation
        is naming and framing: `update` reads as incomplete, and the command says outright which
        steps it is not doing.
      - >
        IT IS VERIFIED BY THE CORRECTION /rite:end HAS TO MAKE, and by nothing else. If
        checkpoints kept the docs true, update_what_changed finds little; if it rewrites
        current_state, they lapsed. No stamp file and no fifteenth artifact — the same reasoning
        that rejected an /end stamp, and that lets did_the_last_session_close work from two files
        which already exist.
      - >
        REPORTED, NEVER GRADED. /rite:end records the magnitude of its correction and does not
        score it. Any pass/fail threshold would be a guessed number, which is
        c-freshness-thresholds-are-guesses repeating itself one level up.
    also_recorded: >
      The during phase is now HALF-BUILT rather than absent: mirror_memory runs on the
      PostToolUse hook added the same day, checkpoint is /rite:update, and log_continuously and
      clock_per_entry remain discipline waiting on the watcher layer. honest_limits was corrected
      to say two of four rather than none.
    chosen_by_user: true
    proposed_by: claude

  - id: d-preflight-ported-engine-and-command-checks
    date: "2026-09-10"
    title: "The session POST is Rite's engine; personal checks live in config as `command:` entries"
    context: >
      d-preflight-is-config-not-fork settled the shape on 2026-09-07 and waited three days:
      "Rite is the upstream engine. Costin's preflight shrinks to his own checks.yaml plus
      checks too personal to publish."
    decision: >
      scripts/rite_preflight.py is a PORT of preflight.py — check bodies carried verbatim where
      behaviour is unchanged. It ships ELEVEN checks. Config lives at
      ${CLAUDE_PLUGIN_DATA}/checks.yaml and is not a project artifact. A check whose config
      carries `command:` runs an external program, its exit code mapping 0/1/2/3 to
      GREEN/YELLOW/RED/NA. SessionStart emits ONE verdict covering the POST and the project
      standard, guarded by a ported dedup.
    rationale:
      - >
        A PORT, NOT A REIMPLEMENTATION. 748 lines proven over months are worth more than tidier
        code, so the transformation was surgical: swap the parser, name every encoding, guard
        the platform-specific bits, drop what is superseded. Parity is a gate, not a claim.
      - >
        `command:` IS WHAT MAKES THE 2026-09-07 DECISION EXECUTABLE. Without it, tracker_registered
        forces project-tracker's file format into the published engine, which
        d-project-tracker-stays-separate forbids. With it, anything too personal to publish
        lives in the user's config and the engine never learns about it. It is also the only
        extension point a stranger gets.
      - >
        THREE CHECKS ARE NOT PORTED, and restoring them is a regression: mirror_drift is
        superseded by mirror_not_stale, which reads a sync stamp through a predicate shared with
        the copier rather than comparing mtimes; last_log_age by
        newest_entry_within_days_of_activity; tracker_registered belongs in config.
      - >
        ONE VERDICT, NOT TWO. Costin has had one line from preflight and one from Rite,
        describing one session. The port folds them, and carries hookdedup — which guarded only
        the two hooks in settings.json and never covered Rite's own.
    corrections_forced_during_the_work:
      - "The AST gate caught a subprocess.run arriving without encoding/errors. The port was written against a rule the original predates, and the rule did its job."
      - >
        The POST was briefly made to run regardless of the .rite.yaml marker. The hook-shape gate
        rejected it inside a minute and the gate was right — `participation` is not negotiable by
        a port. Reverted and raised as c-session-post-is-gated-by-participation.
      - "Cutting the three unported checks by span also removed a helper that a KEPT check used. The engine still ran: the per-check exception guard reported it as a YELLOW naming the missing name, which is exactly the failure mode that guard exists for."
    chosen_by_user: true
    proposed_by: claude

  - id: d-write-discipline-watcher
    date: "2026-09-10"
    title: "The first watcher reports append-only rewrites and future timestamps as they happen"
    context: >
      The protocol's honest_limits said every implemented completion test is an end-of-session
      test, so a session could rewrite an append-only file at 14:00 and the standard stayed green
      until it closed. Eight watchers sat in mid_term; this is the first built.
    decision: >
      scripts/rite_watch.py runs on PostToolUse for Write|Edit|MultiEdit. It reports two things
      and nothing else: an existing line changed in a file the standard declares append_only,
      measured against git HEAD; and a LOG entry dated later than now. It is SILENT otherwise
      and always exits 0.
    rationale:
      - >
        CHOSEN FIRST BECAUSE IT IS THE ONLY ONE WITH A MEASURED HIT RATE — 100% on this
        project's own real failures, as the roadmap item already recorded. The other seven rest
        on plausible rationales, and two have since lost their premise.
      - >
        SILENCE ON SUCCESS IS A CONTRACT, not politeness. It fires on every write. A watcher
        that speaks when nothing is wrong is one the user disables within a day, and a disabled
        watcher catches nothing at all.
      - >
        IT MEASURES AGAINST git HEAD, so it holds no state of its own and cannot be fooled by a
        second write to the same file. It also means the predicate is the one the checker
        already uses.
      - >
        ONE PREDICATE, TWO CONSUMERS. scripts/riterules.py was extracted so the watcher and the
        checker ask the same question the same way. Two copies of "was this rewritten?" or of
        "what counts as the future?" would be free to disagree — the drift the mirror and
        preflight parity gates exist to catch, except self-inflicted.
    absorbed: >
      c-log-timestamps-must-be-machine-read, open since 2026-09-08 with nowhere for its check to
      run. The check is NARROWER than that concern's title, deliberately: an invented timestamp
      in the PAST is indistinguishable from a real one afterwards and nothing can catch it. A
      timestamp in the FUTURE is provable, and it is exactly what extrapolation produces when it
      overshoots — which is what happened on 2026-09-07.
      The concern proposed comparing against the file's own mtime. Rejected as weaker: at
      PostToolUse the file was just written, so its mtime IS now, and `now` needs no filesystem
      round-trip and no assumption that mtime survived a copy.
    also_settled: >
      The verdicts fixture stopped pinning a literal NA count. It broke three times in one day —
      59, then 60, then nearly 61 — every time an artifact or rule was added, and every break was
      noise rather than a finding. It now asserts the invariant it always meant: every declared
      check lands in exactly one bucket, so collapsing cannot quietly drop one. Raised twice
      before as brittle; fixed while editing the same file for a third time.
    chosen_by_user: true
    proposed_by: claude

  - id: d-finish-the-half-built
    date: "2026-09-10"
    title: "Delete the unreachable, wire the unwired, implement the last rule"
    context: >
      Three pieces of the codebase were half-built and one was newly dead. Found by looking for
      remaining WORK rather than remaining FEATURES, which is a different question and turned out
      to be the more productive one.
    decision: >
      rite_preflight's --hook path is DELETED. required_any_of_sections is DECLARED on
      ARCHITECTURE and now honours section_aliases. deleted_ids_appear_in_milestones is
      IMPLEMENTED, taking the checker to 64 of 64 declared tests. watcher-cwd-changed is built.
    rationale:
      - >
        THE --hook PATH HAD NEVER RUN IN THIS CODEBASE. It came over with the port hours earlier;
        SessionStart routes through rite_session_start.py calling local_verdict(). Kept, it would
        be untested code presenting as supported, plus a second dedup implementation beside
        ritededup — the drift this project attacks, self-inflicted.
      - >
        required_any_of_sections WAS IMPLEMENTED AND INVOKED BY NOTHING. The spec declared its
        DATA under `structure:` and no artifact listed the rule under `tests:`. Wiring it found a
        second defect immediately: it compared against primary section names only, ignoring the
        `section_aliases` declared beside them, so a document doing exactly what the spec permits
        would have been reported as missing everything. Never noticed, because it had never run.
      - >
        deleted_ids_appear_in_milestones IS WHAT MAKES THE DELETION CONVENTION SAFE. Closing an
        item by deleting it is only sound if the item is promoted rather than erased, and until
        today that was a rule with no completion test. A DELETION IS NOT ALWAYS A CLOSURE: items
        legitimately move between lists, so an id leaving near_term is satisfied by a milestone
        OR by appearing elsewhere. Proved both ways on a throwaway git fixture.
      - >
        watcher-cwd-changed's value is not its code. Rite ASSUMES ONE PROJECT PER SESSION and had
        never said so; every artifact resolves from one root. CwdChanged has no matcher support
        and fires on every cd, so all the discrimination is the hook's — it speaks only on a move
        between two marked projects, once.
    also_settled: >
      The verdicts fixture's SECOND pinned literal was removed. "46" broke the moment a test was
      declared on a build-stage artifact. Both assertions now check the invariant they meant.
    chosen_by_user: true
    proposed_by: claude

  - id: d-tests-folders-never-committed
    date: "2026-09-11"
    title: "tests/<name>/ folders are internal and short-lived, and are never committed"
    context: >
      tests/peugeot307sw/ was made to carry field notes and reproductions from the first non-code
      adoption into this repository, so a session here could see what Rite got wrong. It was
      untracked, and whether to commit it to a repository with a public remote was asked.
    user_ruling: "NO. no folders in the tests folder will ever be commited. this is internal only and short lived"
    decision: >
      No folder under tests/ is ever committed. Each is working material for one harvest.
      Whatever is worth keeping goes into docs/CONCERNS.yaml or LOG.md, which are committed, and
      the folder is then disposable.
    rationale:
      - "Stated by the user: internal only, short lived."
      - >
        MEASURED, the day after it was written: verifying tests/peugeot307sw found two of its
        numbers already wrong (28 commits for 27, three scripts for four) and one reproduction
        filtering out the very line that answered its own finding. Material that stale is a
        source for a harvest, not a record.
    consequences:
      - "/tests/*/ is in .gitignore, so the rule is a check rather than a thing to remember. `git add -f` still bypasses it, and nothing gates that."
      - "A harvest must be finished before a tests folder is deleted, because the folder is not the record."
    stated_by_user: true
    proposed_by: claude

  - id: d-project-yaml-checked-against-declared-subset
    date: "2026-09-12"
    title: "Rite checks every YAML file a project carries, against a subset the standard declares"
    context: >
      peugeot307sw committed broken YAML twice during the first outside adoption, and `rite check`
      scored it 0 RED both times: docs/WORKLIST.yaml and docs/FAULTS.yaml are not in the artifact
      inventory, and parse_failure() only ever ran on artifacts. The finding written at the time
      blamed the missing commit gate; verifying it showed a gate would have passed both commits.
      c-project-yaml-is-not-checked.
    user_ruling: "2026-09-11 — check them. Either extend the parser, or limit the YAML Rite accepts by declaring it."
    decision: >
      BOTH halves of the ruling, because either alone is wrong. The parser now refuses in two
      kinds — YamlInvalid for text that is not YAML, YamlUnsupported for valid YAML outside the
      subset — and the subset is DECLARED in spec/project-standard.yaml under `yaml_subset`, with
      every construct id, an example and a reason. Two rules run over every YAML file in scope:
      `yaml_parses` (RED) and `yaml_within_subset` (YELLOW). Scope is the documentation directory
      by default, plus globs a project declares in `.rite.yaml`; a file an artifact already covers
      is never reported twice.
    rationale:
      - >
        THE KINDS ARE THE WHOLE DESIGN. Judging files Rite does not own means it will meet valid
        YAML it cannot read — an anchor in a compose file, `on:` in a GitHub workflow. Calling
        those broken is a false accusation, and passing over a genuinely corrupt document because
        the parser cannot tell the difference is a silent wrong answer. One error class could not
        express the difference, so the verdicts could not either.
      - >
        MEASURED BEFORE AND AFTER, across all 478 YAML files on this machine with PyYAML as the
        oracle. Before: 12 files the parser ACCEPTED that PyYAML rejects, ten of them a plain
        scalar containing ": " read as text; 6 valid files refused for a quoted scalar continued
        onto a second line; 29 multi-document files silently merged into one. After: false accepts
        ZERO, and every remaining refusal of a PyYAML-valid file is one of the declared constructs.
      - >
        THE DECLARATION IS NOT A SECOND COPY. The parser reads nothing from the spec at runtime;
        scripts/test-riteyaml.py asserts that every construct the parser raises is declared and
        every construct declared is raised, and that assertion needs no oracle — so it runs in CI
        where PyYAML is absent. A gate, not a convention.
      - >
        THE ORACLE DECIDES THE KIND, not the author of the test. Each case asserts PyYAML's verdict
        too: invalid cases must be rejected by PyYAML, unsupported cases must be accepted. A
        snippet filed under the wrong heading fails the test instead of shipping a wrong verdict.
      - >
        SCOPE IS DECLARED RATHER THAN TOTAL. 62 of 65 ambiguous-boolean refusals on this machine
        are `on:` in .github/workflows — GitHub's dialect, which Rite has no standing to grade.
        The documentation directory is the ground this standard covers; anything beyond it is the
        project's own declaration, reported as a counted line so a narrowed scope is never silent.
      - >
        NOT STAGE-GATED. Broken YAML is broken at `idea`. Stage decides which documents a project
        is ASKED for, never whether the ones it has may be corrupt.
    verified:
      - "The two broken revisions from peugeot307sw's history score RED yaml_parses; both current versions are clean."
      - "A fixture with a broken docs/WORKLIST.yaml went from 0 RED to 1 RED, and the same file excluded in .rite.yaml reports a counted NA instead."
      - "An unparseable ARTIFACT is still exactly one RED — no double reporting, asserted as a fixture."
      - "rite dogfoods it: spec/*.yaml and .github/gates.yaml are declared in its own marker, and 15 gates still pass bar installed-copy."
    consequences:
      - "Coverage is 66 of 66 declared tests; the two new rules are counted like any other, and one declared but unimplemented would read as a gap rather than be hidden."
      - "A non-UTF-8 file is RED as `not_utf8` rather than a crash — Ctx.read only ever guarded OSError."
      - "riteyaml is 775 lines, up from 502. The differential test carries 35 in-subset constructs, 13 unsupported and 25 invalid snippets."
      - "Two honest limits are declared rather than fixed: a file that is one bare scalar, and a %YAML directive, are both valid YAML reported invalid. Neither shape appears in this standard."
    not_done: >
      The silent MISREADS the same measurement found are untouched and recorded in
      c-project-yaml-is-not-checked's successor notes: YAML 1.1 octal read as decimal, date and
      number-shaped keys kept as strings, three block literals differing from PyYAML. They change
      what a value MEANS, never whether a file parses, so they are a separate piece of work.
    stated_by_user: true
    proposed_by: claude

  - id: d-watcher-reports-invalid-yaml
    date: "2026-09-12"
    title: "The watcher reports a write that leaves a checked YAML file unparseable — invalid only"
    context: >
      d-write-discipline-watcher said the watcher reports two things and nothing else, and that
      restraint is why it survives. This adds a third, on measured evidence rather than because it
      was available: BOTH broken files in the first outside adoption were produced by in-session
      edits and committed before anything looked at them.
    decision: >
      On PostToolUse, a write that leaves a YAML file in the checked scope unreadable is reported
      once, naming the construct and the line. INVALID only — a construct merely outside the
      declared subset is never reported here.
    rationale:
      - >
        THE WRITE IS THE CHEAPEST MOMENT. The checker catches it at the next session start, which
        is after the commit; the watcher catches it while the edit is still in hand. That is the
        gap the protocol's honest_limits named — every completion test is an end-of-session test.
      - >
        INVALID ONLY, AND THAT LINE MATTERS. An out-of-subset construct is something the project
        wrote deliberately; interrupting that write is how a watcher earns the reputation that gets
        it switched off. A file that has stopped being YAML is not a matter of taste.
      - >
        ONE PREDICATE, THREE CONSUMERS NOW. riterules.yaml_verdict is what the checker calls, so
        the watcher cannot disagree with it about what "invalid" means. Scope is asked only for a
        .yaml or .yml path, so an ordinary edit costs one string test rather than a git call.
    verified:
      - "A broken write produces exactly one note naming file and construct; a valid file, an anchor, and a YAML file outside the scope all produce silence."
    chosen_by_user: true
    proposed_by: claude
