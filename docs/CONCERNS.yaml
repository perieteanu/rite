# What is proposed, worrying, or open — but NOT settled.
# The staging area that keeps DECISIONS.yaml honest. Without it, an unsettled proposal either
# pollutes DECISIONS (where a later session reads it as settled) or vanishes entirely.
#
# WRITE DISCIPLINE — this file is MIXED, and the line falls here:
#   mutable     : every entry. `status`, `severity`, `proposal` change as thinking moves.
#   append-only : retired_ids. An id is NEVER reused, even after the concern is gone.
#
# LIFECYCLE — a concern leaves this file in exactly one of three ways:
#   settled  -> a DECISIONS.yaml entry is appended; the id moves to retired_ids as `settled`
#   dropped  -> no longer a concern; id moves to retired_ids as `dropped`, with why
#   promoted -> it was really a task; it moves to ROADMAP near_term; id retired as `promoted`
# Nothing is deleted silently. A concern that just disappears is indistinguishable from one
# that was forgotten, which is the failure this file exists to prevent.
---
schema_version: "1.0.0"
as_of: "2026-09-07"
status: current

concerns:

  - id: c-session-post-is-gated-by-participation
    title: "The machine/agent POST is silent in a project that has not opted in — should it be?"
    status: open
    severity: medium
    opened: "2026-09-10"
    what: >
      `participation` says Rite prints nothing without a .rite.yaml marker. That now covers the
      session POST too, so a disk filling up or a second interactive session goes unreported in
      any directory that has not opted in — which is most of them.
    how_it_surfaced: >
      The port briefly ran the POST regardless of the marker, on the reasoning that a machine
      fact is true whether or not this directory opted in. The hook-shape gate rejected it
      within the minute, and the gate was right: quietly carving an exception into a settled
      rule is how the rule stops being one. Reverted, and raised here instead.
    the_argument_each_way: >
      FOR exempting it: the POST reports on the machine and the agent, not on the project. Opt-in
      is a promise not to judge someone's REPOSITORY, and a full disk is not a judgement about
      their repository. Costin's preflight has run everywhere for months and that is the
      behaviour he is used to.
      AGAINST: "silent where not invited" is the whole of participation, and a user who declined
      Rite did not decline it selectively. An exception also needs a rule for WHICH checks are
      exempt, and `side: machine` is a per-check declaration a user's own config can set — so
      the exemption would be user-controllable, which is worse.
    why_it_is_not_urgent: >
      Costin's own preflight hook still runs beside the port and covers every directory, so
      nothing is lost today. It becomes real when he retires it.
    widened_2026_09_12: >
      THE TITLE UNDERSTATES THE GATE. It is not only the POST: rite_copy.py, rite-check.py and
      rite_watch.py all return 0 silently on the same marker test, so `copy --all` and `check`
      no-op in an unadopted project too. That was measured in the hwprivacy session — see
      c-end-ritual-runs-where-its-tools-are-silent.
      AND why_it_is_not_urgent ABOVE DOES NOT TRANSFER TO THE COPIER. It rests on Costin's
      preflight covering every directory as a fallback; nothing is a fallback for the copier,
      because no other tool on this machine rescues a session scratchpad from /tmp. The POST half
      of this concern can wait for him to retire preflight. The copy half cannot, and the stake is
      files rather than a report.
      The severity is left at medium deliberately: the argument recorded above is about whether the
      GATE is right, and widening the evidence does not settle it. What changes is that a ruling
      that keeps the gate must then say what /rite:end prints instead.
    do_not: "Resolve it by editing the hook. It is a DECISIONS entry either way."

  - id: c-readme-sample-output-is-a-copy
    title: "The README's sample checker run restates the stage mapping, and nothing regenerates it"
    status: settled
    severity: low
    opened: "2026-09-10"
    settled: "2026-09-12 — d-readme-sample-is-generated. Retired below."
    what: >
      README.md quotes a real run of the checker whose tail reads "46 checks not required at
      stage 'idea', waiting on: spec README.md, CLAUDE.md ... build ... shipped LICENSE". That
      is the stage mapping again, in the first document a stranger reads.
    why_it_matters: >
      It is the fifth copy, and it survived the fix that removed the other three. The
      stage-table guard deliberately exempts fenced blocks, because a guard that fires on quoted
      output would be switched off before it was fixed — so this copy is exempt by design, not
      by oversight, and it will go stale the day an artifact changes stage.
    proposal:
      - "Generate the sample by running the checker against a scratch project at render time, the way the table is generated from the spec."
      - "Or accept it and add a line to the README saying the sample is illustrative, which is cheap and honest but is a rule with no completion test."
    note: "Opened 2026-09-10 by the guard that found it. Low because the sample being slightly stale misleads nobody about what Rite does — unlike a wrong table, which someone would act on."

  - id: c-freshness-thresholds-are-guesses
    title: "The staleness windows are guesses, and degenerate on docs-only projects"
    status: open
    severity: medium
    opened: "2026-09-07"
    what: >
      The spec says 60 days for ROADMAP and 90 for ARCHITECTURE. Both are guesses, never
      calibrated against the 50-project corpus. And `activity` has no definition for a project
      whose only artifacts ARE documents: when the checker finds no source, both freshness rules
      report NA, so such a project's documents are never measured against anything.
    why_it_matters: >
      It lands hardest on non-code projects (plumbing, plan-evacuare) — the exact category
      d-noncode-first-class exists to protect.
    proposal: "Calibrate the windows against the corpus, and define `activity` for a project whose only artifacts ARE documents."
    partially_resolved_2026_09_08: >
      The MECHANISM half is settled (d-verdicts-and-participation): the three windows are
      per-project overridable via .rite.yaml, and overrides are reported rather than silent.
      The CALIBRATION half is untouched — the defaults are still guesses.
    corrected_2026_09_11: >
      This entry said a documents-only project "compares its docs against themselves and passes
      forever". Against the checker today that is false: it reports NA, "documents-only project
      — no source to measure against". Measuring that NA found a worse problem than the one
      described here, and it is its own concern because it is about what SOURCE means, not about
      the windows: c-source-is-filesystem-mtime. The HANDOFF written 2026-09-10 repeats
      "pass forever"; it is write-once and is superseded by the next one, not edited.
    corrected_2026_09_12: >
      The sentence above said "almost no real project reaches the NA, because a .gitignore alone
      counts as source". That was true when written and is now false: the source half was settled
      the next day (d-source-is-recorded-change-not-file-timestamps), so a documents-only project
      reaches the NA again, and reaches it for the right reason — nothing non-documentary has ever
      been committed.
      WHAT REMAINS HERE IS THE CALIBRATION, which is the half this concern has always been about:
      30, 60 and 90 days are still uncalibrated guesses, never measured against the corpus. The
      other half of the original proposal — "define `activity` for a project whose only artifacts
      ARE documents" — is answered: such a project has no activity to measure against, and the
      finding now says so in those words rather than passing silently.

  - id: c-ai-collab-interaction-boundary
    title: "Is ai-collab-interaction/session-frame.yaml usable as the basis for the start-session protocol?"
    status: resolved_pending_decision
    severity: high
    opened: "2026-09-07"
    blocks: [session-protocol-spec]
    what: >
      A drafted, never-wired start-session frame: goal, constraints, non_goals,
      context.start_here, context.do_not_touch, trust_level, session_budget, first_action.
      It sits in the same family as the profiling corpus that d-profiling-never-integrated
      permanently excludes, but it is collaboration TECHNIQUE, not personal data.
    user_ruling: >
      2026-09-07 — cleared for use as a starting point ("is pretty old.. but read it as a
      starting point"). Read and assessed: it is a blank paste-in template, unfilled since
      2026-04-11. The one idea worth carrying forward is `trust_level`
      (discuss / plan / implement-and-review / just-do-it) — declared collaboration intent,
      distinct from tool permission, which nothing else ships.
    remaining: "Needs a DECISIONS entry to close it properly, which is why it is not yet retired."

  - id: c-log-has-no-item-ids
    title: "LOG entries cannot be linked to the roadmap items they close"
    status: open
    severity: medium
    opened: "2026-09-07"
    what: >
      The LOG line format is `DD-MM-YYYY HH:MM | DDD | short | [TYPE] desc` and carries no
      field for a near_term id. The new milestones mechanism links a deleted item to a
      milestone entry, and the milestone carries a `log_ref` timestamp — but the link is
      one-directional and by hand.
    why_it_matters: "deleted_ids_appear_in_milestones is checkable; the LOG side of the same link is not."
    proposal: "Either accept the one-directional link, or allow an optional trailing `(#id)` in the log description."

  - id: c-status-line-presence
    title: "A static command-reference popup — discoverability for /end, which only fires if typed"
    status: open
    severity: medium
    opened: "2026-09-08"
    what: >
      A status-bar presence whose hover shows STATIC information: which Rite commands exist and
      how to use them. Explicitly not live data, "at least for the moment".
    the_problem_it_solves: >
      /end only fires if the user types it. That is the single unreliable link in the whole
      protocol — the harness fires SessionStart whether or not anyone remembers, but the
      judgement half depends entirely on the user knowing the command exists. If nobody learns
      /end is there, Rite is preflight with extra documents. This is the mitigation, and no
      cheaper one is obvious.
    claude_corrections_recorded:
      - "Claude first argued the content should be the VERDICT rather than a command list, and called a command list 'wallpaper by day two'. WRONG: that argument came from the timer-reminder discussion and applies to things that PUSH. A hover tooltip is PULL — it appears only when asked and costs nothing when ignored. Different failure profile entirely."
      - "Claude also framed it as 'should we build a status bar', which the user corrected: one already exists in claude-persistent. Both framings are recorded so neither is re-floated."
    why_static_is_right_for_v1: >
      No dependency on the status file, no multi-window bug, no stale data. It cannot be wrong —
      which is more than the existing tooltip's Session section manages.
    the_one_requirement: >
      GENERATE it from the command definitions (commands/*.md frontmatter: name plus
      description), never hand-write it. That panel is a document describing the product, and
      this project exists because such documents rot. Hand-written, the first renamed command
      makes it a lie — inside the tool whose entire argument is that unchecked docs go stale.
      Same treatment and same reason as PROJECT-STANDARD.md.
    content_notes:
      - "Say WHEN to use each command, not just its name: '/end — run before closing; records the handoff decision'."
      - "Say what happens if you do not. That sentence is the product."
    what_would_close_this: >
      A ruling on where it lives — the existing claude-persistent tooltip (which would revive
      the viewer earlier than d-plugin-is-the-product assumed) or a plugin-native statusLine,
      which renders text only and has no hover.

  # ── harvested 2026-09-11 from the first non-code adoption (peugeot307sw, 2026-09-10) ──
  # Harvested with the whole list in view, one entry per ROOT CAUSE rather than per finding, and
  # each finding falsified before it was kept. The field notes were never committed
  # (d-tests-folders-never-committed), so these entries are the record. Finding 1 was not
  # harvested: the report already answers it. Why is in LOG.md.

  - id: c-source-is-filesystem-mtime
    title: "Source means every file on disk, dated by mtime — so no real project is documents-only, and freshness follows the clock on a file"
    status: settled
    severity: high
    opened: "2026-09-11"
    settled: "2026-09-12 — d-source-is-recorded-change-not-file-timestamps. Retired below."
    what: >
      newest_source_mtime() in scripts/rite-check.py walks root.rglob("*") and takes filesystem
      mtimes, skipping only .git, docs, a root-level __pycache__, .rite.yaml and four named
      Markdown files. Both freshness rules, newest_entry_within_days_of_activity and
      as_of_within_days_of_activity, measure against it, and both report NA "documents-only
      project" only when it finds nothing at all.
    measured: >
      On a synthetic documents-only fixture, each of these ALONE turns both rules from NA to
      YELLOW (253d) with no document changed: a .gitignore; one untracked sources/x.pdf that git
      excludes and git status does not show; one shell script. Backdating that script's mtime to
      the documents' date, content unchanged, silences both again. The verdict follows the clock
      on a file, not the content of the tree.
    how_it_surfaced: >
      Finding 2 of the adoption blamed the project's own tools/ scripts. Falsifying it showed the
      cause is wider. The adopting project also has gitignored sources/, media/ and secrets/ and
      a .gitignore, every one of which counts as source, and every real git repository has a
      .gitignore — so the documents-only branch is effectively unreachable.
    why_it_matters: >
      This is the mtime theatre CLAUDE.md warns would hollow out the freshness tests, arriving
      through the definition of source rather than the definition of as_of. Two consequences are
      INFERRED and not yet measured: a fresh clone sets every mtime to clone time, so CI and any
      new clone turn YELLOW once a window passes with nothing changed; and a project that improves
      the tools policing its own documents makes those documents look stale.
    proposal:
      - "Source = files git tracks, outside the documentation paths, dated by the last commit that touched them. Fall back to mtime only where there is no repository, per d-git-is-a-capability-not-a-prerequisite, and say so in the finding."
      - "Let .rite.yaml declare source exclusions — tools that only police the documents — reported the way threshold overrides are, never silently."
      - "Skip __pycache__ at any depth. Today only a root-level one is skipped."
    edge_cases:
      - "A shallow checkout (actions/checkout defaults to depth 1) dates every file by the one commit it holds. Detect a shallow repository and report NA with that reason rather than a date the checker cannot know."
      - "Uncommitted edits to source carry no commit date. Decide whether a dirty working tree counts as activity today."
    related: [c-freshness-thresholds-are-guesses]

  - id: c-commit-is-not-gated
    title: "The checker reports, and nothing consults it before a commit"
    status: open
    severity: medium
    opened: "2026-09-11"
    what: >
      rite check runs at SessionStart and on request. A commit never consults it, so a failing
      check and a successful commit can sit on adjacent shell lines — which is a discipline that
      has to be remembered, in the project whose thesis is that such disciplines fail.
    how_it_surfaced: >
      Finding 3 of the adoption. The adopting project committed broken YAML twice, then wrote its
      own .git/hooks/pre-commit.
    corrected_before_harvest: >
      The finding implied a Rite gate would have stopped both commits. It would not have. Both
      broken files, docs/WORKLIST.yaml and then docs/FAULTS.yaml, sit outside Rite's artifact
      inventory, and the checker scores a fixture with a broken docs/WORKLIST.yaml at 0 RED. The
      adopting project's hook runs its own tools, not rite check. The incident is evidence for
      c-project-yaml-is-not-checked first and for this concern second.
    edge_cases:
      - "session_closed is RED by design for the whole working life of a session that logs as it works. A gate running the full check refuses every mid-session commit; it needs --exclude-scope=session, exactly as CI does."
      - "d-never-instruct-installation forbids modifying the environment. .git/hooks/pre-commit is inside the project, not the machine, but it is still a write the user did not make, and hooks are per clone and untracked."
      - "core.hooksPath would version the hook, but it is git config, which that decision names outright."
    do_not: "Install a hook from /rite:init by default. Offering one is a DECISIONS entry either way."

  - id: c-yaml-values-are-misread-in-ways-that-still-parse
    title: "Five silent misreads survive: the file parses, and the value is wrong"
    status: open
    severity: medium
    opened: "2026-09-12"
    what: >
      Found by the same 478-file measurement that settled c-project-yaml-is-not-checked, and
      deliberately left out of that work because they are a different defect: both parsers accept
      the file and disagree about what it CONTAINS. An unquoted 0600 is 600 where YAML 1.1 means
      octal 384. Date-shaped and number-shaped KEYS stay strings. Three block literals differ from
      PyYAML in ways not yet diagnosed. Unquoted date VALUES stay strings, which is the known and
      harmless case — the freshness rules parse dates themselves.
    why_it_matters: >
      Validity is now checked and these do not affect it. They affect every rule that READS a
      field, and a wrong value read confidently is the failure class this project exists to
      attack. The three block literals are the part worth fearing, because nobody knows yet what
      they are.
    proposal: "Diagnose the three block literals first — an undiagnosed difference is not a known limitation. Then decide per case: fix, or declare in yaml_subset.honest_limits."
    do_not: "Widen the subset for these without a differential case each. The test is the correctness claim."

  - id: c-project-yaml-is-not-checked
    title: "Rite checks that its own artifacts parse, and no other YAML in the project"
    status: settled
    severity: high
    opened: "2026-09-11"
    settled: "2026-09-12 — d-project-yaml-checked-against-declared-subset. Retired below; kept here until the next rewrite of this file so the measurement stays beside its outcome."
    what: >
      parse_failure() runs on the inventory's YAML artifacts only. Every other YAML file in a
      project is invisible to Rite: a fixture with a broken docs/WORKLIST.yaml scores 0 RED at
      every stage.
    how_it_surfaced: >
      Finding 3 of the adoption, re-read. Broken YAML was committed twice there, and both files
      were outside the inventory, so no gate Rite could have offered would have caught either.
    user_ruling: "2026-09-11 — check them. Either extend the parser or limit the YAML Rite accepts by declaring it; find the solution that way."
    measured: >
      riteyaml against PyYAML as oracle, over all 478 YAML files on this machine, 302 of them
      under a docs*/ directory.
      THE TWO REAL BREAKS are both refused with syntax reasons, and the valid third file is
      accepted. The parser can do this job.
      22 FILES ARE INVALID YAML TODAY, all under docs-yaml/, across ten projects, and riteyaml
      rejects every one.
      12 FALSE ACCEPTS, where PyYAML rejects and riteyaml accepts. Ten are one construct: a plain
      scalar containing ': ', which YAML forbids and riteyaml reads as text. One is `- *.log`, an
      invalid alias that riteyaml's alias pattern does not match. One is a sequence indentation
      error.
      7 GAPS, where valid YAML is refused with a syntax-shaped reason. Six are quoted scalars
      continued onto a second line, which YAML allows.
      77 REFUSALS OF DECLARED CONSTRUCTS, ambiguous booleans and flow sets. 62 of them are `on:`
      in .github/workflows, a dialect GitHub owns rather than the project.
      SILENT MISREADS were also found, where both parsers accept and the values differ. They do
      not affect validity, but they are riteyaml bugs for anything that READS a field: an
      unquoted 0600 read as 600 where YAML 1.1 means octal 384; unquoted date and number-shaped
      KEYS kept as strings; block literals differing in three files, not yet diagnosed. Unquoted
      date values returned as strings (40 files) are the known, harmless case, and multi-document
      files (29) differ only because the measurement read them as lists.
    what_a_solution_must_settle:
      - "RiteYamlError must say WHICH kind it is: invalid YAML, or valid YAML outside the declared subset. One class carries both today, and the two deserve different verdicts."
      - "The subset must be DECLARED in the spec, so that refusing a construct is the standard speaking rather than the parser's limit showing."
      - "False accepts must reach zero before this ships. A validity check that can say GREEN about a broken file is worse than none."
      - "Scope. Checking all tracked YAML would flag rite's own workflow for `on:`. The standard's documentation directory plus globs a project declares avoids a dialect the project does not own."
    related: [c-commit-is-not-gated]

  - id: c-copier-ignores-the-project-it-writes-into
    title: "The copier writes the memory mirror into docs/ unasked, and prints every other project's plans"
    status: open
    severity: medium
    opened: "2026-09-11"
    what: >
      One root, two symptoms: scripts/rite_copy.py behaves identically in every project. The
      mirror path is a constant (MIRROR_NAME, under docs/) with no .rite.yaml opt-out, and
      SessionEnd runs the copier automatically, so the file arrives without any command being
      typed. And --plans prints one `elsewhere` line per plan belonging to another project — 14
      of 17 output lines on a brand-new fixture, naming other projects' slugs on every run.
    how_it_surfaced: >
      Findings 5 and 6 of the adoption. The adopting project's CLAUDE.md declares that docs/ holds
      only files the user and Claude write, and the mirror is neither.
    stale_claim_found: >
      spec/project-standard.yaml still says memory_mirror is generated_by claude-mirror-memory.py
      as a PostToolUse hook. The producer is scripts/rite_copy.py, and the global hook is retired.
    widened_2026_09_12: >
      A THIRD SYMPTOM OF THE SAME ROOT, from the hwprivacy corpus. The constant is not merely
      "under docs/" — it is `DOCS = "docs"` at rite_copy.py:69, consumed unconditionally at :308,
      :328, :403 and :515, so on a project whose documents live in docs-yaml/ the copier creates a
      SECOND documentation directory rather than writing into the one that exists.
      THE INCONSISTENCY IS INSIDE RITE, which is what makes this cheap. rite-check.py:168 already
      resolves the directory through local.docs_dir — default plus every superseded alternative —
      with a comment at :157 naming this exact situation. The checker learned and the copier did
      not, so one tool grades docs-yaml/ARCHITECTURE.yaml while the other cannot find the folder
      it is in. The fix is to read the same spec key, not to add a second constant.
      LATENT, NOT PROXIMATE. It did not cause the silent copy the corpus reported — the
      participation gate returns before DOCS is read — so it is invisible until a docs-yaml/
      project adopts, and then it is a wrong write rather than a missing one. Diagnosis corrected
      in c-end-ritual-runs-where-its-tools-are-silent.
      AND IT SHOULD REFUSE RATHER THAN GUESS where the directory is genuinely ambiguous, per the
      rule rite_copy.py:33 states about itself. Refusing is a third behaviour, distinct from
      succeeding and from silently doing nothing.
    partially_resolved_2026_09_12: >
      THE DIRECTORY HALF IS SETTLED — d-documentation-paths-are-never-literals. DOCS, MIRROR_NAME
      and SCRIPTS_SUBDIR are gone; all three destinations resolve through riterules.artifact_path,
      which honours a declared legacy_layout, and the copier refuses rather than guessing when the
      spec declares no path for an artifact. A docs-yaml project no longer gets a second
      documentation directory created beside the one it has.
      THIS CONCERN IS NOT RETIRED, and the plan that fixed the directory half assumed it would be.
      Two of its three symptoms are untouched: there is still no .rite.yaml opt-out for the mirror
      arriving unasked, and --plans still prints one `elsewhere` line per plan belonging to another
      project. Retiring it here would have buried both, so the entry stays open with its proposal
      list intact minus the third item.
    proposal:
      - "A .rite.yaml key for the mirror, a path or off, reported when set like a threshold override."
      - "Collapse `elsewhere` into one counted line, listed only on request."
      - "Resolve the documentation directory through local.docs_dir, the way the checker already does, and refuse where it is ambiguous."
    tension: >
      The mirror is how a user audits what the agent remembers about the project. Since
      d-agent-copies-default-untracked that audit happens on disk, not in the repository: the copy
      is untracked by default, and this repo's own .gitignore says auditability is served by the
      copy EXISTING, never by its being pushed. So a path setting trades nothing away, and only
      `off` removes the one copy there is. That is still the project's call, which is the point of
      making it a declaration. Until 2026-09-25 this note said the .gitignore argued the opposite,
      which stopped being true on 2026-09-19.
    recurred_2026_09_25: >
      The `elsewhere` half, unchanged, in four adoptions: 21 to 23 lines per run naming other
      projects' plans, which agents in manga and pdf-filler filtered out with grep to read the
      result.

  - id: c-memory-has-no-cross-project-lane
    title: "/rite:end files every lesson under the project, and never asks whether it belongs to the user"
    status: open
    severity: medium
    opened: "2026-09-11"
    what: >
      Claude Code keeps memory per project slug, and /rite:end step 5 writes there without asking
      whether a lesson is about the project or about the user. The storage for the second kind
      already exists — ~/.claude/CLAUDE.md loads in every project — so the gap is not a lane. It is
      that nothing prompts the promotion.
    evidence: >
      Finding 4 of the adoption: two general lessons about editing files safely sat in rite's
      project memory, and the adoption notes report the adopting session damaging two files in
      exactly that way. Verifying it found the failure repeating in the session that reported it:
      BOTH memories that session wrote are preferences about how Costin wants to work
      (feedback-report-findings-flat-not-dramatised, feedback-teach-do-not-silently-cure), and both
      are filed under the adopting project, where no other project will read them.
    proposal: >
      One question in /rite:end step 5: is this lesson about the project, or about the user? If the
      user, PROPOSE the user-level destination and write nothing without consent.
    constraint: "MISSION: never silently mutate ~/.claude. Recommend, and require consent."

  - id: c-roadmap-vocabulary-assumes-building
    title: "ROADMAP's vocabulary invites confusing work ON the repository with work the repository is ABOUT"
    status: open
    severity: low
    opened: "2026-09-11"
    what: >
      current_state, near_term and milestones describe software being built. A project that
      accumulates knowledge about an external subject keeps its own ranked queue of work on that
      subject, and the two lists look alike: things to do, ranked, with costs.
    how_it_surfaced: "Finding 7 of the adoption. Keeping them apart took a deliberate decision there."
    proposal: "One sentence on the ROADMAP artifact in spec/project-standard.yaml saying it describes work on the repository, not work the repository is about. Then regenerate."

  - id: c-watcher-cannot-see-shell-writes
    title: "The write-discipline watcher matches Write|Edit|MultiEdit, and the damage it exists to catch arrives by Bash"
    status: open
    severity: high
    opened: "2026-09-12"
    what: >
      hooks/hooks.json registers the watcher on `Write|Edit|MultiEdit`, and rite_watch.py reads
      the target from `tool_input.file_path`. A Bash tool call has neither — its input is a
      `command` string — so an append made with `cat >>` or `python3 - <<PY` is invisible to the
      only mid-session enforcement Rite has. The gate is not participation this time; it is the
      matcher, and a marker would not have helped.
    evidence: >
      MEASURED over the hwprivacy session transcript, counting writes to the artifacts the watcher
      polices (LOG.md, HANDOFF.md, CLAUDE.md, docs-yaml/*.yaml): 22 by Bash against 15 by
      Write/Edit, inside 168 Bash calls to 47 Write+Edit overall. ALL FOUR damaging appends were
      Bash — the three malformed ones that failed loudly, and the section-merge that silently
      promoted ten deferred items into near-term work. The watcher observed none of them.
      This is not one project's habit. skills/log/SKILL.md warns against writing log entries
      through a shell precisely because agents reach for a shell to append structured text, so the
      class of write most likely to damage an append-only file is the class the watcher cannot see.
      d-watcher-reports-invalid-yaml therefore shipped 2026-09-12 into a hook that cannot observe
      the writes which produce invalid YAML.
    proposal:
      - "FileChanged, if it fires for writes inside the project root regardless of which tool made them. That is the shape the watcher actually wants — it asks what changed, not who changed it."
      - "If FileChanged cannot serve, write the hole into the protocol's honest_limits rather than leaving the coverage implied. A watcher believed to cover writes and covering 40% of them is worse than one whose limit is stated."
    rejected: >
      Adding `Bash` to the matcher and deriving the target from the command string. Finding the
      written path in an arbitrary shell command means parsing shell, which is guessing, and
      riteyaml's rule — refuse rather than guess — is not suspended because the caller is a hook.
      A watcher that misses a redirect it did not understand reports silence, and silence here
      reads as a pass.
    verified_2026_09_16: >
      Against the hooks reference (code.claude.com/docs/en/hooks.md) and the 2.1.273 binary.
      FileChanged DETECTS every writer — "no matter what changed the file: an Edit or Write tool
      call, a script Claude runs with Bash, or a process outside Claude Code entirely"; payload
      `file_path` and `event` (change/add/unlink). It CANNOT REPORT: only `watchPaths` and
      `systemMessage` are read from its output, systemMessage is a terminal notification, stderr
      goes to the user only, and FileChanged is absent from the events whose additionalContext
      reaches Claude. On this machine systemMessage reaches nobody either (extension 2.1.273,
      extension.js: 0 refs). Its watch list is named files only — literal names in the cwd, or
      absolute `watchPaths` — so a newly created file is not seen. Proposal 1 is therefore
      detection without a channel.
      PostToolBatch is the trigger that fits: once per batch, no matcher (Bash, PowerShell and MCP
      writers included), additionalContext injected before the next model call. The existing
      predicate needs only a path (measured against git HEAD), so the watcher can find changed
      files from the filesystem rather than from the command string, which is not the rejected
      approach.
    open_ruling: >
      How "changed during this batch" is known: (a) a per-session content-hash snapshot in
      ${CLAUDE_PLUGIN_DATA} — catches outside and mtime-preserving writes, needs a DECISIONS entry
      narrowing d-write-discipline-watcher's "no state of its own" to the verdict baseline, which
      stays HEAD; or (b) stateless mtime >= batch start from the transcript — misses outside
      writes between batches, and assumes the transcript is flushed first (unverified). Claude
      leans (a). Either way: retire the PostToolUse watch entry (double reports), seed at
      SessionStart, reword "the file just written", test a Bash append first.
    unverified: "whether PostToolBatch fires inside subagents and whose context gets the reminder; whether watchPaths accepts a directory."
    measured_again_2026_09_25: >
      Four adoptions, same method: writes to LOG, HANDOFF, DECISIONS, CONCERNS and ROADMAP,
      counted by a pattern over the transcripts that may overcount Bash slightly. pdf-filler, 22
      by Bash against 1 by Write/Edit in one session; manga's second session, 11 against 0; the
      legacy-layout project, 7 against 8. Where the watcher could see, it worked: it caught two
      future-dated LOG entries in manga before they were committed.

  - id: c-copier-has-no-read-only-preview
    title: "check has --force and copy has none, so nothing can show what adoption would rescue"
    status: open
    severity: medium
    opened: "2026-09-12"
    what: >
      rite-check.py takes --force to score a project with no marker, and that is the documented
      way to evaluate Rite before adopting it. rite_copy.py has no equivalent. Its -n exists but
      sits BEHIND the participation gate, so it is unreachable in exactly the situation a preview
      is for.
    evidence: >
      Passing --force to the copier answers
      "rite_copy.py: error: unrecognized arguments: --force".
      The asymmetry is inverted against the stakes. The checker only reports, and it has the
      preview; the copier is the one holding a session's scratchpad in /tmp, which does not
      survive a reboot, and it has none. In the hwprivacy session four harness scripts — the
      evidence that 14 new tests were verified against their reintroduced defect — were rescued
      by hand because nothing could say they were there.
    proposal: "`copy --force`, implying -n and never writing."
    constraint: >
      --force MUST NOT mean the same thing on a writer that it means on a reader. On the checker
      it means "read anyway", which participation permits. On the copier the literal reading is
      "write into a project that did not opt in", which participation forbids outright. The only
      honest form is preview-only, and the flag has to refuse to write rather than document that
      it does not.

  - id: c-directory-marketplace-serves-the-working-tree
    title: "On this machine every project runs Rite from the repository, so 'test the installed copy' cannot be done here"
    status: open
    severity: medium
    opened: "2026-09-16"
    what: >
      known_marketplaces.json registers the rite marketplace with source `directory` at
      ~/projects/rite. In the haircut session of 2026-09-16 the skill's
      allowed-tools was substituted to `Bash(bash "~/projects/rite/hooks/rite.sh" *)`
      — the working tree, not plugins/cache/rite/rite/0.26.0. The 2026-09-13 handoff assumed the
      opposite: that inside rite the tree is served and elsewhere the install is. Its
      verify-first item therefore tested the working tree a second time, from another project.
    evidence: "The command_permissions attachment of haircut transcript 527d65ff…, 2026-09-16T16:38:49Z."
    consequence: >
      test-installed-current.py compares the cache to the tree and passes, but on a directory
      source the cache may not be what runs at all — unverified whether hooks, as opposed to
      skills, execute from the cache. Until a git-sourced install is exercised (CI or another
      machine), "a user gets what the tree says" is still inference.
    also_found: >
      The two permission prompts Costin saw in that close are NOT evidence the allowed-tools
      pattern failed to match: all three Bash calls chained rite.sh with other commands (git
      status, tail, cp, rm -rf, git commit), and a prefix rule does not cover the rest of a
      compound command. The skills could say "run the resolver on its own" — not done.
    unverified: "whether a directory-source plugin's hooks run from the cache or the source; whether the pattern matches when rite.sh is run alone."
    update_2026_09_19: >
      UNCHANGED BY THE MIGRATION, but now TESTABLE for the first time. The marketplace is still a
      directory source at ~/projects/rite, so 0.28.0 installing green today proves nothing about
      a stranger. What changed is that the public repository exists and is clean, so a git-sourced
      install of `perieteanu/rite` can finally be exercised. It must be sequenced AFTER a close,
      never during one: the two marketplaces collide on the name `rite`, so testing means removing
      the directory source — and with it /rite:log, /rite:end and /rite:preflight, the commands
      that close a session. Costin's plan is to test it once and revert to the directory source,
      because a git source would make test-installed-current.py compare the cache against pushed
      commits and go RED on every uncommitted edit, which is a gate switched off within a week.
    update_2026_10_28: >
      MORE EVIDENCE, same direction, and the consequence is now sharper than testing. Every skill
      loaded by an adopting session since 2026-09-25 reported its base directory in the working
      tree, and the latest session of one adopter called the tree's rite.sh 27 times and the
      cache's 0 times. So an uncommitted edit in this repository is live in every adopting project
      at once — and this concern was REDISCOVERED on 2026-10-28 by a session that had not read
      this file, while ROADMAP current_state still said "the running checker reads the INSTALLED
      copy" (rewritten the same day). Still unverified for hooks, as opposed to skill-substituted
      commands.

  - id: c-log-redaction-has-no-completion-test
    title: "The public LOG's redaction rule is discipline, in a project whose thesis is that discipline fails"
    status: open
    severity: medium
    opened: "2026-09-19"
    what: >
      LOG.md is public again and stays full-granularity by Costin's ruling, with sensitive detail
      edited as entries are written. CONVENTIONS forbids an absolute home path, a key filename on
      this machine, a host alias, a second account or a client's project name. Nothing checks it.
      This is the first rule in the repository that is explicitly a rule with no completion test —
      the exact class the project exists to convert into a check that fails.
    measured: >
      NOT HYPOTHETICAL, and not alarming either. Of the 537 entries archived at the re-founding,
      3 carried something sensitive: usage telemetry, a client path, and the ssh config layout
      with a host alias. One line in 180; roughly one every four working days at the pace those
      entries were written. The third is the one that reached a public repository.
    proposal: >
      A PATTERN-based report in the PostToolUse watcher, which already inspects every write to
      LOG.md for future timestamps and append-only violations. Shapes rather than secrets — an
      absolute home path, a default key filename, an ssh config path, a host-alias prefix — so
      nothing private enters the tracked config, which was the objection that killed the
      declared-string version. It would live in the watcher, not the rule set, so the frozen
      inventory and the 66-of-66 coverage count are untouched, and it fires at the moment an
      entry is typed rather than at the next session start.
    status_note: >
      OFFERED AND DECLINED, twice, on the day it was designed. Costin chose discipline alone.
      Recorded as his decision rather than an oversight — see CONVENTIONS, which states the rule
      with its measure and its cost. Reopen only if an entry actually leaks.
    consequence: >
      The cost of being wrong RISES with time. Today a leak could be removed by rewriting every
      commit, which is how the identity strings were redacted at the re-founding. Once the
      community marketplace pins the repository to a commit SHA and CI bumps the pin, a history
      rewrite breaks the pin — so the cheap remedy expires at submission, not at some later date.
    first_test: "The first entry written by a session that was not present for this decision."

  # ── harvested 2026-09-25 from four adoptions, 2026-09-17 to 2026-09-23 ──
  # manga (from an empty directory), pdf-filler (existing code, raised idea -> build), a
  # legacy-layout project and a document project adopted mid-session. None exported field notes,
  # so these were reconstructed from the session transcripts: one entry per ROOT CAUSE, each
  # checked against the code before it was kept. The last two are work projects and are
  # described rather than named. What was checked and dropped, and what Rite got right, is in
  # LOG.md. Two findings were already open here and were added to instead:
  # c-watcher-cannot-see-shell-writes and c-copier-ignores-the-project-it-writes-into.

  - id: c-copy-checks-see-stale-never-missing
    title: "The copy checks can report a stale copy, never a missing one"
    status: open
    severity: high
    opened: "2026-09-25"
    what: >
      Two causes in one block of rite-check.py (around lines 1050 to 1095), one effect: the
      checker's verdict on the copied artifacts never says "missing".
      PRESENCE IS DECIDED BEFORE THE RULE RUNS. An artifact with no instance, and no stage that
      requires it, is "optional and absent", and its rules are skipped with NA "not present —
      optional". source_plans_all_copied is the rule that knows a plan exists without a copy — it
      asks rite_copy.uncopied_plans with the project's own marker — and it is never called while
      no copy exists. mirror_not_stale returns NA "file absent" by itself, whatever the memory
      folder holds.
      THE PRESENCE TEST FOR A PATTERN ARTIFACT IGNORES legacy_layout. plan_copy and script_copy
      are found by globbing their literal path_pattern under docs/, and resolve() is skipped for
      them by design. The copier resolves through riterules.artifact_path, which honours the
      declared directory. So under legacy_layout the copier writes into docs-yaml/ and the checker
      looks only in docs/.
    measured: >
      pdf-filler has 2 plan copies in docs-yaml/ and the legacy-layout project has 4; both report
      plan_copy and script_copy "not present — optional". In manga on 2026-09-19 the check at
      20:42 UTC said the same while a plan that session had written at 20:06 sat uncopied; the
      rule produced its first YELLOW only the next morning, after /rite:end had made a first copy.
      The document project had a memory written before its marker existed and no mirror, and
      nothing said so until the close copied it.
      NOTHING HAS BEEN MISSED YET. uncopied_plans returns empty for all six adopted projects on
      this machine today, because every close ran copy --all. The check is blind, not yet wrong.
    contradicts: >
      d-legacy-layout-is-declared-not-tolerated, whose verified list says artifact_path resolves
      all three copies into the declared directory "so the checker cannot accept a file the copier
      never wrote". For the two pattern artifacts the failure runs the other way: the checker
      cannot see a file the copier DID write.
    why_it_matters: >
      The checker states its own rule beside yaml_check: a check that found nothing to read and a
      check that passed must not look alike. NA "not present" while copies sit on disk is that
      failure, one layer further in than c-pattern-paths-are-matched-literally, which fixed the
      glob and did not reach the directory.
    proposal:
      - "Resolve path_pattern through riterules, as artifact_path resolves a single path, so the checker and the copier cannot disagree about where a copy lives."
      - "Let a rule whose question is whether an instance SHOULD exist run when none does. source_plans_all_copied and mirror_not_stale are exactly those rules."
      - "One fixture per cause: a legacy_layout project with copies present, and a project with an authored plan and no copy. Both score NA today."
    related: [c-pattern-paths-are-matched-literally, c-copier-ignores-the-project-it-writes-into]

  - id: c-init-assumes-a-newborn-project
    title: "/rite:init writes and skips as if every project were born that minute"
    status: open
    severity: medium
    opened: "2026-09-25"
    what: >
      Three of the four adoptions harvested here were not births, and init said something untrue
      in two of them.
      THE SEEDED HANDOFF ASSERTS HISTORY. template/HANDOFF.md says "The project has just adopted
      Rite and no session has done work in it." The document project adopted mid-session, after
      that session had built a model, a template and a generator, so the seed was false on arrival
      and the session had to replace it.
      AN EXISTING FILE IS SKIPPED WITHOUT BEING READ. rite_init.py prints "skipped HANDOFF.md —
      already present, left untouched" and never looks inside. pdf-filler's HANDOFF had no front
      matter, so its first preflight after init carried 2 RED and 2 YELLOW from that file alone,
      after a command whose description promises "opens on green". The legacy-layout project,
      adopted 2026-09-17, had to hand-add the same front matter.
    tests_a_premise: >
      d-scaffold-only-what-can-be-honest rests on "idea is the only stage a machine can satisfy
      honestly". That holds at birth. At adoption, the more common case, the seed states a fact
      init cannot know, and the skip hides a failure init could have named.
    proposal:
      - "Seed only what init can know: the date of adoption, and that no handoff has been written since. Or detect prior work (files beyond the seed, existing commits) and word the seed to match."
      - "When a seed file is skipped, run the idea-stage checks on it and print their verdict beside the skip, naming the command that fixes it: /rite:handoff for a HANDOFF with no close record."
      - "Scope 'opens on green' in the skill description to a new project, or keep the promise and make the two lines above true."
    do_not: "Overwrite or edit an existing file. Never-overwrite is right; what is missing is saying what the untouched file will score."

  - id: c-init-skill-states-the-seed-set-by-hand
    title: "The init skill enumerates its seed files by hand, and has said three since init began writing four"
    status: open
    severity: low
    opened: "2026-09-25"
    what: >
      skills/init/SKILL.md says "Three files ... Nothing else, deliberately", and its description
      says init "writes .rite.yaml, LOG.md and HANDOFF.md". Init has written a fourth, .gitignore,
      since 0.28.0. d-agent-copies-default-untracked listed what had to say four, "README, the
      module docstring and the scaffold gate", and the one prompt an agent reads at the moment of
      adoption was not on the list. .gitignore appears nowhere in the skill.
    measured: "Reported by the agent adopting the document project, which counted four files where the skill promised three."
    why_it_matters: >
      The rot class of c-gate-count-restated-in-prose and c-stage-table-duplicated-in-three-places:
      a fact restated in prose and falsified by the next change to what it describes. In a prompt
      it is worse than in a README, because the reader acts on it.
    proposal: "Delete the enumeration and let init's own output say it, since it already lists every file it wrote; or generate it from the seed list the scaffold gate reads."

  - id: c-stages-have-names-and-no-meanings
    title: "Seven stages are declared and one has a stated meaning, so 'the stage moved' cannot be checked"
    status: open
    severity: low
    opened: "2026-09-25"
    what: >
      stage_vocabulary lists idea, spec, build, polish, shipped, maintain and archived, and defines
      none of them. The only stated meaning is the one d-stage-advances-when-the-repo-goes-public
      gives `shipped`. polish, maintain and archived gate no artifact at all.
    measured: >
      Each adoption improvised. pdf-filler mapped onto the portfolio registry's stage field, which
      exists on one machine. manga reasoned that code which exists and runs means `build`. The
      legacy-layout project still declares `idea` while a test instance of it runs on a server, so
      its ROADMAP and DECISIONS are checked when present and never demanded.
    why_it_matters: >
      The same decision calls a stage "a claim about reality, not a dial". A claim with no stated
      meaning cannot be wrong, which the spec's own words for claims_declared call worse than a
      false one, because it cannot be caught either.
    proposal: "One `means:` line per value in stage_vocabulary, rendered into the generated stage table. Descriptive, not enforced: the stage stays the project's declaration."
    related: [c-roadmap-vocabulary-assumes-building]

  - id: c-shapes-are-learned-by-grepping-the-spec
    title: "Adopting agents learn a document's shape by grepping the 2,000-line spec, never from the readable standard"
    status: open
    severity: low
    opened: "2026-09-25"
    what: >
      In every adoption session harvested here, the agent learned a required shape (ROADMAP keys,
      HANDOFF front matter and genres, DECISIONS and CONCERNS entry keys) by reading
      spec/project-standard.yaml in line ranges or walking it with an ad-hoc script. None opened
      spec/PROJECT-STANDARD.md, which exists for that reader, and nothing they were shown points at
      it: not a finding, not /rite:preflight, not init's output. required_frontmatter_present on a
      HANDOFF with no front matter says "no front matter" and does not name the keys.
    why_it_matters: >
      Every adoption paid the cost, and one agent searched a directory that does not exist before
      finding the spec. Sending them to the rendered standard is only half the fix: it omits the
      ROADMAP item shapes entirely (c-no-done-markers-assumes-an-undeclared-shape).
    proposal:
      - "Name the rendered section in every finding that asks for a missing key, section or front matter."
      - "List the required keys when there is no front matter at all, as the rule already does when some are present."
      - "Render every shape the spec declares, so the readable standard is complete enough to be the thing to point at."
    update_2026_10_28: >
      The third proposal is DONE for the shapes nested in an artifact's structure: the renderer
      prints every one that declares required_keys, chosen by form rather than by name, so
      near_term_item, milestone_entry and inception now reach PROJECT-STANDARD.md. The first two
      proposals are untouched, and they are the ones that would send an agent there.

  - id: c-yaml-check-says-no-yaml-in-scope
    title: "yaml_check says 'no YAML files in scope' in projects whose only YAML is their artifacts"
    status: open
    severity: low
    opened: "2026-09-25"
    what: >
      rite-check.py prints "no YAML files in scope — yaml_parses and yaml_within_subset read
      nothing" whenever nothing is left after the artifact-covered files are removed. manga has
      three YAML files in docs/, all artifacts and all parsed by their own rules, and is told it
      has none.
    why_it_matters: "The line exists so that reading nothing and passing do not look alike. It says something false instead, and a reader concludes YAML is not being checked."
    proposal: "Say what is true: no YAML beyond the N artifact files, which their own rules parse."

  - id: c-shim-actions-are-not-the-skill-names
    title: "/rite:preflight runs the shim's `check`, so the obvious guess fails"
    status: open
    severity: low
    opened: "2026-09-25"
    what: >
      The skill is /rite:preflight and the shim action it runs is `check`. manga's agent ran
      `rite.sh preflight`, got "no such action 'preflight'", and wrote the trap into manga's
      CLAUDE.md so the next session would not repeat it. pdf-filler's agent ran `rite.sh` with no
      action and got "no such action ''" instead of a usage line.
    proposal: "Name the action after the skill, or have the unknown-action error say which action the skill runs; print the usage line when no action is given."

  # ── opened 2026-10-28 from the transcripts of every adopting session since the 09-25 harvest ──
  # Ten adopting projects, four of them new. Work projects are described rather than named.

  - id: c-close-record-is-a-date
    title: "`closed:` is a day, so a close that crosses midnight reads as a session that did not close"
    status: open
    severity: medium
    opened: "2026-10-28"
    what: >
      closed_not_older_than_newest_log_entry compares two DATES: riterules.handoff_close_date reads
      `closed:` as a day and riterules.newest_log_date reduces every entry to its day. A session
      that closes at 23:50 and then writes one more line, or commits its close at 00:01, leaves a
      LOG entry dated the next day, and the next session opens RED "session did not close".
    measured: >
      spare: the close commit of the 2026-10-22 session landed at 2026-10-23 00:01:53, and the next
      session's agent cleared "this morning's RED, the date mismatch from my after-midnight log
      line". The sessions on this machine routinely end between 23:50 and 00:05, so this is the
      common case, not the edge.
    why_it_matters: >
      A false RED on the one rule that asks whether the ritual ran teaches the user that the rule
      cries wolf. c-log-has-writers-outside-the-session makes it worse: an imported line for an
      after-midnight commit does the same thing without any session writing at all.
    proposal:
      - "Let `closed:` carry a time ('2026-10-22 23:58') and compare it with entry timestamps; a date-only `closed:` keeps today's end-of-day reading, so nothing gets more lenient by omission."
    related: [c-log-has-writers-outside-the-session]

  - id: c-log-has-writers-outside-the-session
    title: "LOG.md is written by tooling and by other projects' sessions, and Rite reads every line as this project's session"
    status: open
    severity: medium
    opened: "2026-10-28"
    what: >
      project-tracker's seed-projects imports one `[work] commit:` line per git commit into the
      LOG.md of every registered project, appended at the end and out of date order, and in one
      adopter replaced the log's header. On 2026-10-20 it ran from a session in a project that
      does not participate, and appended 74 such lines to this repository's LOG.md. Sessions also
      log into projects they are not in. Rite assumes one project per session: the cwd watcher
      reports a MOVE between projects, never a write from elsewhere, and no watcher sees a write
      made through a shell (c-watcher-cannot-see-shell-writes).
    effects:
      - "Date rules read a commit line as session activity — the after-midnight false RED of c-close-record-is-a-date, arriving without any session writing."
      - "d-log-ownership-split gave project-tracker the CREATION of LOG.md at registration. Importing commits for the file's whole life goes further than that, and nothing recorded the change."
    user_note: >
      Costin, 2026-10-28, offered the narrow fix (stop the import for projects with a marker):
      "i think the issues is deeper". Recorded as said, not interpreted.
    route: >
      Its own dedicated session, per d-project-tracker-stays-separate: integration between the two
      tools is never arrived at incrementally. Deliberately not designed here.
    related: [c-close-record-is-a-date, c-watcher-cannot-see-shell-writes, c-memory-has-no-cross-project-lane]

  - id: c-near-term-alias-includes-milestones
    title: "The standard lists `milestones` as a former name of `near_term` while declaring it as a key of its own"
    status: open
    severity: low
    opened: "2026-10-28"
    what: >
      ROADMAP's key_aliases maps near_term to [next_up, milestones], and PROJECT-STANDARD.md
      renders that as "the names it replaces". But milestones is a recommended key with its own
      shape, and it is where a near_term item goes when it closes, not an older name for the list.
      The checker reads no alias, so no verdict is affected; the misleading part is what a reader
      is told.
    corrected_before_commit: >
      First written as "key_aliases lets milestones satisfy a required near_term". A fixture with
      milestones and no near_term disproved it in one run: required_keys_present still says
      "missing: near_term".
    proposal: "Drop `milestones` from near_term's aliases, unless the corpus that produced the list shows a project where it really did mean the queue."

retired_ids:
  # ── harvested 2026-09-13 from the haircut adoption, the first from an empty directory ──
  # Opened and settled the same day. The field notes are gitignored (d-tests-folders-never-committed),
  # so these two entries and the decision they name are the record.
  - id: c-session-skills-abort-at-load
    retired: "2026-09-13"
    how: settled
    outcome: d-session-skills-never-inject-at-load
    why: >
      /rite:end, /rite:handoff, /rite:log and /rite:update injected the resolver at load time, and
      an injected command that is not pre-allowed or exits non-zero aborts the whole skill. The
      command that closes a session could not start for any user without a bash allow rule. It
      also retroactively answers the 2026-09-12 handoff, which asked for this exact delivery path to
      be exercised: it was, by an outside adoption, and it failed.

  - id: c-interpreter-rule-bans-one-name
    retired: "2026-09-13"
    how: settled
    outcome: d-session-skills-never-inject-at-load
    why: >
      python_invocation_differs banned python3 only, so its gate certified bare python — missing on
      pyenv, on Debian without python-is-python3, and on macOS without a shim. /rite:init's one
      command failed with exit 127 on the first command of adoption, and it also named a relative
      path that exists only inside the plugin. Settled by the rule rewrite and an init shim action,
      recorded as a consequence of the decision above rather than a decision of its own, because it
      corrects a spec rule rather than choosing between designs.
  - id: c-end-ritual-runs-where-its-tools-are-silent
    retired: "2026-09-12"
    how: settled
    outcome: d-documentation-paths-are-never-literals
    why: >
      Opened and settled the same day, from the hwprivacy corpus. /rite:end is a Markdown prompt
      and runs anywhere, while every tool it calls returns 0 silently without a marker — so the
      judgement half ran in full and the mechanical half did nothing, indistinguishably from
      success.
      SETTLED BY A MECHANISM RATHER THAN A REMINDER, which is the only kind of fix this project
      accepts. scripts/rite_paths.py prints participation and the resolved document set, and the
      four judgement skills inject its output BEFORE Claude reads them. A project that has not
      opted in now says so above step 1, in those words, with the --force preview named.
      IT CLOSED THE OTHER HALF TOO. The same block hands over the project's real document paths,
      so the four mid-ritual translations the corpus reported — docs-yaml/ARCHITECTURE.yaml for
      docs/ARCHITECTURE.md, a DECISIONS sequence rather than a mapping, an absent CONCERNS.yaml, a
      HANDOFF with no front matter — are done before the ritual starts rather than improvised
      during it. Improvisation is where that session corrupted a file.
      THE LIMIT, stated: an environment with disableSkillShellExecution set gets an empty block and
      falls back to the canonical names, which is today's behaviour rather than a broken prompt.
      The GATE half of it is untouched and stays in c-session-post-is-gated-by-participation: the
      tools are still silent, the ritual merely stops reporting their silence as success.

  - id: c-installed-spec-is-not-compared
    retired: "2026-09-12"
    how: settled
    outcome: d-documentation-paths-are-never-literals
    why: >
      Its own proposal named the fix — "Add spec/ to COMPARED. Smallest change, and honest: a
      stale spec is not untidy, it is wrong" — and it was one list entry, because the installed
      plugin already ships spec/.
      WHAT MADE IT URGENT rather than tidy: the same day, the spec started carrying per-project
      POLICY. local.docs_dir.formats and the whole legacy_layout contract live there, and the
      running checker reads the INSTALLED copy. A stale installed spec would therefore change what
      a project is asked for, silently, while every other gate showed green — which is the
      "equal version, unequal bytes" failure the test was written for, arriving through the one
      directory it did not look at.
      Verified by the gate going FAIL on a spec-only divergence and PASS after `claude plugin
      update rite` at 0.25.0.

  - id: c-source-is-filesystem-mtime
    retired: "2026-09-12"
    how: settled
    outcome: d-source-is-recorded-change-not-file-timestamps
    why: >
      Opened 2026-09-11 from the first outside adoption at high severity, and settled the next day.
      Source is now what the project last RECORDED as changed — the newest commit date among
      tracked, non-documentation files — with the definition declared in the spec rather than
      hardcoded in a function body.
      ITS THREE MEASUREMENTS ALL HELD, and each became a test case: a .gitignore alone, an
      untracked git-excluded PDF, and a backdated mtime. The first two now report documents-only
      and the third changes nothing at all.
      WHAT THE CONCERN DID NOT SEE, found while building the fix: the answer can be unknowable in
      THREE distinct ways, not one. A shallow clone returns a date that describes the fetch rather
      than the project — and this repository's own CI checks out shallow, so that case was live
      rather than hypothetical. A repository with no commits yet exits non-zero rather than
      returning nothing, and a project scaffolded by /rite:init and checked before its first
      commit lands there. Each says so in its own words.
      The CALIBRATION half stays open where it belongs, in
      c-freshness-thresholds-are-guesses: this changed what the windows measure against, not
      whether 30, 60 and 90 days are the right numbers.

  - id: c-readme-sample-output-is-a-copy
    retired: "2026-09-12"
    how: settled
    outcome: d-readme-sample-is-generated
    why: >
      Opened 2026-09-10 at severity low, on the argument that a slightly stale sample misleads
      nobody. TWO DAYS LATER it printed 61 checks and 57 of 64 against a real 67 and 66 of 66 —
      and severity was the wrong lens: what mattered was that it was the last hand-maintained
      copy in a repository arguing that such copies rot. It is now the fifth generated block,
      run against a fixture declared in the spec.
      ITS OWN `do_not` WAS HONOURED, and the cheap half of its proposal declined: labelling the
      sample "illustrative" would have been a rule with no completion test.
      THE FIX NEEDED A FIX WITHIN THE HOUR, which is the part worth keeping. The first fixture
      expired in 2026-03, so the generated sample carried "expired 176d ago" — a day count
      measured from today, which would have rewritten the block every morning and failed the gate
      for nobody's change. Caught by reading the output; the two --check runs that passed proved
      nothing, because they ran in the same minute.

  - id: c-project-yaml-is-not-checked
    retired: "2026-09-12"
    how: settled
    outcome: d-project-yaml-checked-against-declared-subset
    why: >
      Opened 2026-09-11 from the first outside adoption and settled the next day, with the user's
      ruling — "check them" — already recorded in it. Rite now checks every YAML file in scope
      against a subset the standard declares, in two kinds: invalid is RED, outside-the-subset is
      YELLOW.
      WHAT THE CONCERN GOT RIGHT was insisting on the measurement before the mechanism. The
      parser could not have shipped this check as it stood: it ACCEPTED twelve files PyYAML
      rejects and refused six it should have read, and neither number was visible from reading
      the code. Probing the oracle afterwards found six more defects, including a BOM read into
      the first key and a mid-file document marker merging two documents into one.
      ITS OWN MEASUREMENT SETTLED THE HARDEST QUESTION, which was scope: 62 of 65
      ambiguous-boolean refusals on this machine are `on:` in GitHub workflow files, a dialect
      Rite has no standing to grade. That is why the default stops at the documentation directory.
      The MISREADS it recorded are not covered and did not quietly vanish with it:
      c-yaml-values-are-misread-in-ways-that-still-parse.

  - id: c-log-timestamps-must-be-machine-read
    retired: "2026-09-10"
    how: settled
    outcome: d-write-discipline-watcher
    why: >
      Open since 2026-09-08 with, in its own words, nowhere for its check to run. It now runs in
      two places from one predicate: as the `no_future_timestamps` rule at session start, and in
      the PostToolUse watcher the instant a write lands.
      The check is NARROWER than the concern's title and deliberately so. An invented timestamp
      in the PAST is indistinguishable from a machine-read one afterwards; nothing can catch it.
      What is provable is a timestamp in the FUTURE — and that is precisely what extrapolation
      produces when it overshoots, which is what happened on 2026-09-07: thirty entries
      extrapolated from a single 22:11 reading, some ahead of real time, found only when the
      clock was re-read at 00:02 against entries claiming 00:13.
      The concern also proposed comparing against the file's own mtime. Rejected as weaker: at
      PostToolUse the file was just written, so its mtime IS now, and `now` needs no filesystem
      round-trip and no assumption that mtime survived a copy.
      The do_not stands and was honoured: the existing entries are append-only and were not
      backfilled.

  - id: c-coverage-counts-optional-as-unimplemented
    retired: "2026-09-10"
    how: settled
    outcome: "fixed in scripts/rite-check.py — MARKER_RULES is excluded from the denominator"
    why: >
      Opened and fixed the same day, and it needed no decision: `optional` is a marker meaning
      the artifact is not required, handled by its own branch and deliberately absent from RULES.
      Counting it as an unimplemented rule understated the checker by four instances. Coverage
      now reads 61 of 62, and the one genuinely missing rule is deleted_ids_appear_in_milestones.
      Recorded as settled rather than dropped because the DOCUMENTS were the damage: four of them
      repeated "seven declared tests unimplemented" for days, reading that line as a to-do list
      it never was. A metric wrong in the flattering direction gets fixed; one wrong in the
      modest direction just quietly misinforms, which is why a low-severity counter bug was
      worth an entry at all.
      NOTE: the milestones entry for port-mirror-memory says "from 57 of 64 to 61 of 66". It is
      append-only and stays as written — it was true under the old denominator.

  - id: c-gate-count-restated-in-prose
    retired: "2026-09-10"
    how: settled
    outcome: d-one-home-for-the-gate-count
    why: >
      Opened and settled the same day, hours apart, on the evidence of its own failure: the
      count went 9 -> 11 -> 12 -> 13 within one day and each move falsified four or five
      sentences. Settled the same way as c-stage-table-duplicated-in-three-places — generate
      where the number earns its place, DELETE where it does not.
      README and ARCHITECTURE now carry rite:generated blocks fed from .github/gates.yaml.
      CLAUDE.md's and ROADMAP.current_state's copies were deleted and point at the file instead,
      because neither reader needs a count — they need to know where the gates are declared,
      which is the more durable fact.
      The block mechanism gained `source_file` to make this possible; until today every block
      generated from the standard alone. A generator reaching into the spec for the gate list
      would have recreated the copy it exists to remove.
      Proved by adding a fictional 14th gate to the authority: both documents were flagged
      stale, the count moved 13 -> 14 and 3 -> 4 and "10 of 14" adjusted itself, with no
      document edited by hand.

  - id: c-rite-ps1-unreachable-in-production
    retired: "2026-09-10"
    how: settled
    outcome: d-git-bash-required-on-windows
    why: >
      Opened and settled the same day. The concern asked whether hooks.json can express a
      per-platform command; the hooks reference answers outright that it cannot, and no single
      command string serves every platform — `bash X` fails under PowerShell, a bare .sh path
      fails under PowerShell, a bare .ps1 path fails under sh, and exec form needs one
      executable name that resolves everywhere, which is the problem the shim exists for.
      SETTLED BY NARROWING THE CLAIM RATHER THAN WIDENING THE CODE. Git Bash is required on
      Windows, hooks.json says `shell: bash` outright, and the spec's coverage row that promised
      a PowerShell path now says hooks do not run there. rite.ps1 stays as a manual entry point.
      The idea NOT taken, recorded so it is not re-proposed as new: two entries with explicit
      `shell:` fields. The docs do not say what a hook declaring an unavailable shell does, and
      building on undocumented behaviour is guessing. Revisit only if that is specified.

  - id: c-pattern-paths-are-matched-literally
    retired: "2026-09-10"
    how: settled
    outcome: d-pattern-paths-and-declared-name-shapes
    why: >
      Opened and settled the same day, and it was a PREREQUISITE rather than a neighbour: until
      an artifact could declare a glob, both of plan_copy's tests reported "not present" with
      two real plan copies on disk, so the port that needed them could not have been verified.
      Artifacts now declare `path_pattern` for presence and `canonical_name_pattern` for shape.
      The second key came out of building the first: filename_matches_canonical initially held
      the PLAN regex inside the checker, which was a hardcoded value with no human-visible home
      AND was silently wrong for the next artifact to declare the rule.

  - id: c-plan-attribution
    retired: "2026-09-10"
    how: settled
    outcome: d-attribution-is-authorship-not-mention
    why: >
      Open since 2026-09-07 as the blocker on port-mirror-memory, described as "the only
      genuinely hard part" and proposing mtime/session correlation or content inspection.
      NEITHER WAS NEEDED. Session transcripts are filed under the project slug and record the
      plan as a TOOL INPUT — a Write naming it as file_path, or an ExitPlanMode naming it as
      planFilePath. That is authorship, and it is exact.
      THE FIRST IMPLEMENTATION WAS STILL WRONG, which is the part worth keeping. Searching for
      the plan's path as a string mis-attributed five of thirteen plans, because the session
      BUILDING the attributor had run `ls ~/.claude/plans/` and its own transcript therefore
      mentioned every plan on the machine. The act of measuring changed what was measured, and
      the only reason it was caught is that the numbers disagreed with a measurement taken
      twenty minutes earlier. Nothing about the wrong answer looked wrong.
      Its narrowness is now written down rather than assumed: attribution names the project
      whose SESSION wrote the file, not the project the file is ABOUT. This repo already
      contains the counterexample — PLAN-2026-09-07-project-standard.md is rite's founding plan,
      written from a claude-persistent session because rite did not exist yet. So an existing
      copy always wins over a fresh attribution.
  - id: c-stage-table-duplicated-in-three-places
    retired: "2026-09-10"
    how: settled
    outcome: d-one-home-for-the-stage-mapping
    why: >
      Opened and settled the same day it was opened. Its own `do_not` named the outcome to
      avoid — "leave all three hand-maintained and rely on remembering, the rule with no
      completion test, in the repository whose thesis is that such rules fail" — and both
      halves of the proposal were taken rather than one.
      GENERATION removed the drift: README.md and template/.rite.yaml now carry a
      rite:generated block filled from artifacts[].required_from_stage, and
      `render-standard.py --blocks --check` is the gate. CLAUDE.md's copy was DELETED rather
      than generated, because it was a prose sentence mid-bullet and removing a copy beats
      mechanising it.
      A GUARD stops the next one, which generation could never do: a fresh enumeration in some
      other document is not drift from anything, so --blocks --check would never look at it.
      scripts/test-stage-table-guard.py fails when three stage names appear near three artifact
      names outside a generated block.
      TWO THINGS WERE FOUND BY BUILDING IT, both of which argue the concern understated itself.
      The count was wrong: it said three places and there were FOUR — ROADMAP.current_state
      carried the mapping too, and no one had noticed. And the README table generated
      BYTE-IDENTICAL on the first run while template/.rite.yaml did not, because the template's
      hand-written copy abbreviated `docs/MISSION.md` to `MISSION`. The copies had already
      begun to diverge.
  - id: c-standard-version-policy
    retired: "2026-09-10"
    how: settled
    outcome: d-standard-version-declared-never-honoured
    why: >
      Open since 2026-09-07 at severity `low`, and the severity was the interesting part: its
      own text said it "only bites after the first external user exists" — and publishing is
      exactly what manufactures that user, so it was low right up until the moment it became
      blocking. It was found blocking publish-github while the pre-publication list was being
      written, three days later.
      Settled by declining the expensive half. A project may declare `standard_version` and a
      mismatch is reported as YELLOW, but Rite never runs an old rule set: keeping every past
      standard runnable is a promise a one-person project cannot honour, and an unhonoured
      compatibility promise converts a visible gap into a silent wrong answer.

  - id: c-unimplementable-tests
    retired: "2026-09-09"
    how: settled
    outcome: d-claim-surface
    why: >
      Opened 2026-09-07 with SIX tests that could not run under MISSION's no-inference
      constraint. It reached ZERO. Two were resolved by `git init`, one by narrowing the spec
      to match practice, one by a route that closes c-plan-attribution, one was dropped as
      redundant (d-drop-claims-match-stage), and the last — claims_match_filesystem, the
      highest-value test in the standard — is implemented as of today via the declared claim
      surface. The concern was right that the unimplementable tier was the differentiated tier.
      What it could not have known is that the rule was also declared on the WRONG ARTIFACT:
      CLAUDE.md alone, catching none of the four failures that motivated the work.

  - id: c-prior-art-ai-floppy
    retired: "2026-09-09"
    how: dropped
    outcome: d-audience-is-the-author-not-a-market
    why: >
      Opened and dropped the same day. It was raised as a competitive threat, and the user ruled
      that competition is not the frame: "i am not competing. this mostly auto running plugin is
      done for me and other that think like me or adhere to this way of thinking AND as an
      artifact for portfolio."
      The technical reading stands and is kept in LOG — ai-floppy ships no hooks, its own spec
      defers a SessionStart hook on token cost, and Cursor support is why. What is dropped is
      the framing that any of that requires a response from Rite.

  - id: c-na-conflates-absent-with-unparseable
    retired: "2026-09-09"
    how: settled
    outcome: d-unparseable-is-red-absent-is-na
    why: >
      Opened and settled the same day, by the user's ruling. The symptom had already gone when
      the widened parser stopped refusing real files — which is exactly why it was worth fixing
      anyway: a defect whose symptom disappears is the kind that comes back silently.

  - id: c-yaml-subset-too-narrow-for-the-wild
    retired: "2026-09-09"
    how: settled
    outcome: d-stdlib-only-yaml-subset
    why: >
      Opened and settled the same day, by the user's ruling to widen. Recorded as a dated
      correction inside the original decision rather than as a new one: the decision's
      REASONING is unchanged and still right — stdlib only, refuse rather than guess. Only its
      measurement was wrong, and a measurement taken on one repo and generalised to a standard
      is the error worth naming.

  - id: c-installed-copy-can-be-stale
    retired: "2026-09-09"
    how: settled
    outcome: d-installed-copy-checked-by-test-not-by-rule
    why: >
      Opened and settled within a day. Ruled by the user 2026-09-09. The answer was a check
      that fails (scripts/test-installed-current.py), not a documented release step — the
      documented-step option was rejected as a rule with no completion test.
  - id: c-marker-lookup-not-case-exact
    retired: "2026-09-09"
    how: settled
    outcome: d-one-implementation-of-a-portability-rule
    why: >
      Opened and settled within a day. Ruled by the user 2026-09-09: a bug, not an exemption.
      The predicate now has one implementation in scripts/ritefs.py and three consumers.

  - id: c-vendor-pyyaml
    retired: "2026-09-07"
    how: settled
    outcome: d-stdlib-only-yaml-subset
    why: >
      Superseded by a stronger answer to the same question. Vendoring PyYAML would have cut one
      install step; a stdlib-only subset parser cuts the dependency entirely. Opened and
      retired the same day, roughly an hour apart.
  - id: c-python-chosen-by-inheritance
    retired: "2026-09-07"
    how: settled
    outcome: d-python-is-the-runtime
    why: >
      Opened and closed the same day. It asked for a rationale, and measurement supplied one:
      the counter-argument it rested on — that Node is guaranteed present because Claude Code
      is a Node application — was verified FALSE against the binary on disk. Successor concern
      for the part that survived: c-vendor-pyyaml.

  - id: c-carried-forward-is-unrecordable
    retired: "2026-09-16"
    how: settled
    outcome: d-handoff-close-record-is-its-own-field
    why: >
      Opened and settled the same day, from the haircut adoption's /rite:end — the first close
      anywhere to choose carried_forward. `written:` held both the text's date and the close's,
      so a session that logged could record carried_forward only by moving `written:` over text
      it did not write. The close now has its own key. Appended here at the END, as the header
      declares; the two 2026-09-13 entries above were inserted at the top of this list.

  - id: c-no-done-markers-assumes-an-undeclared-shape
    retired: "2026-10-28"
    how: settled
    outcome: d-roadmap-items-are-a-list-and-crashes-are-loud
    why: >
      Costin chose the list. One helper now reads every roadmap list and names a shape it cannot
      read; list_items_have_keys enforces near_term_item and milestone_entry; the renderer prints
      them; Rite's own ROADMAP changed shape. Between the harvest and the fix the crash was
      re-diagnosed four more times by adopting sessions, which is the measured cost of a known
      defect left open.

  - id: c-rule-crash-reads-as-na
    retired: "2026-10-28"
    how: settled
    outcome: d-roadmap-items-are-a-list-and-crashes-are-loud
    why: >
      A crash is YELLOW on the claude side and counted on its own in the summary, so it reaches
      the SessionStart line. Every verdict fixture now fails on any crash, and a planted crash is
      tested in-process rather than through a real bug that a fix would remove.
