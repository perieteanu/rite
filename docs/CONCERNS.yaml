# What is proposed, worrying, or open — but NOT settled.
# The staging area that keeps DECISIONS.yaml honest. Without it, an unsettled proposal either
# pollutes DECISIONS (where a later session reads it as settled) or vanishes entirely.
#
# WRITE DISCIPLINE — this file is MIXED, and the line falls here:
#   mutable     : every entry. `status`, `severity`, `proposal` change as thinking moves.
#   append-only : retired_ids. An id is NEVER reused, even after the concern is gone.
#
# LIFECYCLE — a concern leaves this file in exactly one of three ways:
#   settled  -> a DECISIONS.yaml entry is appended; the id moves to retired_ids as `settled`
#   dropped  -> no longer a concern; id moves to retired_ids as `dropped`, with why
#   promoted -> it was really a task; it moves to ROADMAP near_term; id retired as `promoted`
# Nothing is deleted silently. A concern that just disappears is indistinguishable from one
# that was forgotten, which is the failure this file exists to prevent.
---
schema_version: "1.0.0"
as_of: "2026-09-07"
status: current

concerns:

  - id: c-gate-count-restated-in-prose
    title: "The gate count has one true home and is hand-copied into four documents"
    status: open
    severity: high
    opened: "2026-09-10"
    what: >
      .github/gates.yaml is the authority — the runner reads it, and it says so in its own
      preamble. The COUNT of gates, and the count that can skip on a runner, are then written
      out as prose in README.md, CLAUDE.md, docs/ARCHITECTURE.md and ROADMAP.current_state.
    evidence: >
      It went 9 -> 11 -> 12 -> 13 in a single day, and every change falsified four or five
      sentences at once. The last round also moved the SKIP count 2 -> 3, which is a second
      derived number in the same sentences. On the final pass README.md still opened "Nine
      gates run on every push" directly above a corrected total, three edits after the number
      first moved.
    why_it_matters: >
      THIS IS NOW THE MOST-REPEATED FAILURE IN THIS REPOSITORY'S HISTORY, and it is the same
      shape as c-stage-table-duplicated-in-three-places, which was settled today: a value with
      one true home, hand-copied into prose that nobody re-checks. The claim surface cannot
      catch it — claims_match_filesystem checks PATHS, not values, and said so while every
      number around it was wrong. The stage-table guard cannot either; it guards one specific
      mapping.
    proposal:
      - "Generate the counts into a rite:generated block fed from .github/gates.yaml, the way the stage table is fed from the spec. The mechanism already exists and this is what it is for."
      - "The skip count comes free from the same source: a gate declaring skip_means is a gate that can skip."
      - "Or widen the claim surface from paths to VALUES, which is the more general fix and a much larger one."
    do_not: >
      Rely on remembering to grep for the number. That was the practice all day and it failed
      three times out of three, in the repository whose thesis is that such practices fail.

  - id: c-readme-sample-output-is-a-copy
    title: "The README's sample checker run restates the stage mapping, and nothing regenerates it"
    status: open
    severity: low
    opened: "2026-09-10"
    what: >
      README.md quotes a real run of the checker whose tail reads "46 checks not required at
      stage 'idea', waiting on: spec README.md, CLAUDE.md ... build ... shipped LICENSE". That
      is the stage mapping again, in the first document a stranger reads.
    why_it_matters: >
      It is the fifth copy, and it survived the fix that removed the other three. The
      stage-table guard deliberately exempts fenced blocks, because a guard that fires on quoted
      output would be switched off before it was fixed — so this copy is exempt by design, not
      by oversight, and it will go stale the day an artifact changes stage.
    proposal:
      - "Generate the sample by running the checker against a scratch project at render time, the way the table is generated from the spec."
      - "Or accept it and add a line to the README saying the sample is illustrative, which is cheap and honest but is a rule with no completion test."
    note: "Opened 2026-09-10 by the guard that found it. Low because the sample being slightly stale misleads nobody about what Rite does — unlike a wrong table, which someone would act on."

  - id: c-freshness-thresholds-are-guesses
    title: "The staleness windows are guesses, and degenerate on docs-only projects"
    status: open
    severity: medium
    opened: "2026-09-07"
    what: >
      The spec says 60 days for ROADMAP and 90 for ARCHITECTURE. Both are guesses, never
      calibrated against the 50-project corpus. Worse, `as_of_within_days_of_activity` is
      measured against SOURCE mtime — and a docs-only project has no source, so the docs are
      compared against themselves and pass forever.
    why_it_matters: >
      That is mtime theatre arriving through a different door than the one the spec guards,
      and it lands hardest on non-code projects (plumbing, plan-evacuare) — the exact category
      d-noncode-first-class exists to protect. rite itself is currently in that category.
    proposal: "Calibrate the windows against the corpus, and define `activity` for a project whose only artifacts ARE documents."
    partially_resolved_2026_09_08: >
      The MECHANISM half is settled (d-verdicts-and-participation): the three windows are
      per-project overridable via .rite.yaml, and overrides are reported rather than silent.
      The CALIBRATION half is untouched — the defaults are still guesses, and the degeneracy
      stands: as_of_within_days_of_activity measures against SOURCE mtime, so a documents-only
      project compares its docs against themselves and passes forever. rite is currently such a
      project and deliberately takes NO override, so the defect surfaces here rather than being
      tuned away locally.
    no_longer_self_demonstrating_2026_09_08: >
      "rite itself is currently in that category" has gone FALSE. scripts/ now holds real
      source, so this project has a source mtime and no longer compares its docs against
      themselves. The defect is untouched — it simply stopped biting the one project positioned
      to notice it. That makes calibration MORE urgent, not less: the remaining victims
      (plumbing, plan-evacuare) are projects nobody is actively developing, which is exactly
      where a silent pass goes unnoticed.

  - id: c-ai-collab-interaction-boundary
    title: "Is ai-collab-interaction/session-frame.yaml usable as the basis for the start-session protocol?"
    status: resolved_pending_decision
    severity: high
    opened: "2026-09-07"
    blocks: [session-protocol-spec]
    what: >
      A drafted, never-wired start-session frame: goal, constraints, non_goals,
      context.start_here, context.do_not_touch, trust_level, session_budget, first_action.
      It sits in the same family as the profiling corpus that d-profiling-never-integrated
      permanently excludes, but it is collaboration TECHNIQUE, not personal data.
    user_ruling: >
      2026-09-07 — cleared for use as a starting point ("is pretty old.. but read it as a
      starting point"). Read and assessed: it is a blank paste-in template, unfilled since
      2026-04-11. The one idea worth carrying forward is `trust_level`
      (discuss / plan / implement-and-review / just-do-it) — declared collaboration intent,
      distinct from tool permission, which nothing else ships.
    remaining: "Needs a DECISIONS entry to close it properly, which is why it is not yet retired."

  - id: c-log-has-no-item-ids
    title: "LOG entries cannot be linked to the roadmap items they close"
    status: open
    severity: medium
    opened: "2026-09-07"
    what: >
      The LOG line format is `DD-MM-YYYY HH:MM | DDD | short | [TYPE] desc` and carries no
      field for a near_term id. The new milestones mechanism links a deleted item to a
      milestone entry, and the milestone carries a `log_ref` timestamp — but the link is
      one-directional and by hand.
    why_it_matters: "deleted_ids_appear_in_milestones is checkable; the LOG side of the same link is not."
    proposal: "Either accept the one-directional link, or allow an optional trailing `(#id)` in the log description."

  - id: c-log-timestamps-must-be-machine-read
    title: "A model-written LOG entry can carry an invented timestamp indistinguishable from a real one"
    status: open
    severity: medium
    opened: "2026-09-08"
    what: >
      During the 2026-09-07 session Claude read the machine clock at 22:11 and then wrote
      roughly thirty further LOG entries with extrapolated times, some of them AHEAD of real
      time — verified when the clock was finally re-read at 00:02 against entries claiming
      00:13. CONVENTIONS already forbids this ("the machine clock. Never invent, round, or
      approximate") and the rule failed exactly the way this project says rules fail: nothing
      checked it.
    why_it_matters: >
      It is the project's own thesis landing on the project. A plausible invented timestamp is
      indistinguishable from a real one after the fact, so the corpus's 1808 LOG entries cannot
      be assumed to be clock-accurate either. Timestamps are also the ONLY ordering key —
      CONVENTIONS says file order may differ from chronological order and consumers must sort
      by parsed timestamp.
    proposal:
      - "A shipped /log reads the clock itself, per entry, and never accepts a model-supplied time."
      - "A check that fails: no LOG entry may carry a timestamp later than the file's own mtime."
      - "That check is cheap, needs no revision history, and would have caught this immediately — so it does NOT belong in c-unimplementable-tests."
    do_not: "Backfill or correct the existing entries. They are append-only, and the correction is already logged."

  - id: c-status-line-presence
    title: "A static command-reference popup — discoverability for /end, which only fires if typed"
    status: open
    severity: medium
    opened: "2026-09-08"
    what: >
      A status-bar presence whose hover shows STATIC information: which Rite commands exist and
      how to use them. Explicitly not live data, "at least for the moment".
    the_problem_it_solves: >
      /end only fires if the user types it. That is the single unreliable link in the whole
      protocol — the harness fires SessionStart whether or not anyone remembers, but the
      judgement half depends entirely on the user knowing the command exists. If nobody learns
      /end is there, Rite is preflight with extra documents. This is the mitigation, and no
      cheaper one is obvious.
    claude_corrections_recorded:
      - "Claude first argued the content should be the VERDICT rather than a command list, and called a command list 'wallpaper by day two'. WRONG: that argument came from the timer-reminder discussion and applies to things that PUSH. A hover tooltip is PULL — it appears only when asked and costs nothing when ignored. Different failure profile entirely."
      - "Claude also framed it as 'should we build a status bar', which the user corrected: one already exists in claude-persistent. Both framings are recorded so neither is re-floated."
    why_static_is_right_for_v1: >
      No dependency on the status file, no multi-window bug, no stale data. It cannot be wrong —
      which is more than the existing tooltip's Session section manages.
    the_one_requirement: >
      GENERATE it from the command definitions (commands/*.md frontmatter: name plus
      description), never hand-write it. That panel is a document describing the product, and
      this project exists because such documents rot. Hand-written, the first renamed command
      makes it a lie — inside the tool whose entire argument is that unchecked docs go stale.
      Same treatment and same reason as PROJECT-STANDARD.md.
    content_notes:
      - "Say WHEN to use each command, not just its name: '/end — run before closing; records the handoff decision'."
      - "Say what happens if you do not. That sentence is the product."
    what_would_close_this: >
      A ruling on where it lives — the existing claude-persistent tooltip (which would revive
      the viewer earlier than d-plugin-is-the-product assumed) or a plugin-native statusLine,
      which renders text only and has no hover.

retired_ids:
  - id: c-rite-ps1-unreachable-in-production
    retired: "2026-09-10"
    how: settled
    outcome: d-git-bash-required-on-windows
    why: >
      Opened and settled the same day. The concern asked whether hooks.json can express a
      per-platform command; the hooks reference answers outright that it cannot, and no single
      command string serves every platform — `bash X` fails under PowerShell, a bare .sh path
      fails under PowerShell, a bare .ps1 path fails under sh, and exec form needs one
      executable name that resolves everywhere, which is the problem the shim exists for.
      SETTLED BY NARROWING THE CLAIM RATHER THAN WIDENING THE CODE. Git Bash is required on
      Windows, hooks.json says `shell: bash` outright, and the spec's coverage row that promised
      a PowerShell path now says hooks do not run there. rite.ps1 stays as a manual entry point.
      The idea NOT taken, recorded so it is not re-proposed as new: two entries with explicit
      `shell:` fields. The docs do not say what a hook declaring an unavailable shell does, and
      building on undocumented behaviour is guessing. Revisit only if that is specified.

  - id: c-pattern-paths-are-matched-literally
    retired: "2026-09-10"
    how: settled
    outcome: d-pattern-paths-and-declared-name-shapes
    why: >
      Opened and settled the same day, and it was a PREREQUISITE rather than a neighbour: until
      an artifact could declare a glob, both of plan_copy's tests reported "not present" with
      two real plan copies on disk, so the port that needed them could not have been verified.
      Artifacts now declare `path_pattern` for presence and `canonical_name_pattern` for shape.
      The second key came out of building the first: filename_matches_canonical initially held
      the PLAN regex inside the checker, which was a hardcoded value with no human-visible home
      AND was silently wrong for the next artifact to declare the rule.

  - id: c-plan-attribution
    retired: "2026-09-10"
    how: settled
    outcome: d-attribution-is-authorship-not-mention
    why: >
      Open since 2026-09-07 as the blocker on port-mirror-memory, described as "the only
      genuinely hard part" and proposing mtime/session correlation or content inspection.
      NEITHER WAS NEEDED. Session transcripts are filed under the project slug and record the
      plan as a TOOL INPUT — a Write naming it as file_path, or an ExitPlanMode naming it as
      planFilePath. That is authorship, and it is exact.
      THE FIRST IMPLEMENTATION WAS STILL WRONG, which is the part worth keeping. Searching for
      the plan's path as a string mis-attributed five of thirteen plans, because the session
      BUILDING the attributor had run `ls ~/.claude/plans/` and its own transcript therefore
      mentioned every plan on the machine. The act of measuring changed what was measured, and
      the only reason it was caught is that the numbers disagreed with a measurement taken
      twenty minutes earlier. Nothing about the wrong answer looked wrong.
      Its narrowness is now written down rather than assumed: attribution names the project
      whose SESSION wrote the file, not the project the file is ABOUT. This repo already
      contains the counterexample — PLAN-2026-09-07-project-standard.md is rite's founding plan,
      written from a claude-persistent session because rite did not exist yet. So an existing
      copy always wins over a fresh attribution.
  - id: c-stage-table-duplicated-in-three-places
    retired: "2026-09-10"
    how: settled
    outcome: d-one-home-for-the-stage-mapping
    why: >
      Opened and settled the same day it was opened. Its own `do_not` named the outcome to
      avoid — "leave all three hand-maintained and rely on remembering, the rule with no
      completion test, in the repository whose thesis is that such rules fail" — and both
      halves of the proposal were taken rather than one.
      GENERATION removed the drift: README.md and template/.rite.yaml now carry a
      rite:generated block filled from artifacts[].required_from_stage, and
      `render-standard.py --blocks --check` is the gate. CLAUDE.md's copy was DELETED rather
      than generated, because it was a prose sentence mid-bullet and removing a copy beats
      mechanising it.
      A GUARD stops the next one, which generation could never do: a fresh enumeration in some
      other document is not drift from anything, so --blocks --check would never look at it.
      scripts/test-stage-table-guard.py fails when three stage names appear near three artifact
      names outside a generated block.
      TWO THINGS WERE FOUND BY BUILDING IT, both of which argue the concern understated itself.
      The count was wrong: it said three places and there were FOUR — ROADMAP.current_state
      carried the mapping too, and no one had noticed. And the README table generated
      BYTE-IDENTICAL on the first run while template/.rite.yaml did not, because the template's
      hand-written copy abbreviated `docs/MISSION.md` to `MISSION`. The copies had already
      begun to diverge.
  - id: c-standard-version-policy
    retired: "2026-09-10"
    how: settled
    outcome: d-standard-version-declared-never-honoured
    why: >
      Open since 2026-09-07 at severity `low`, and the severity was the interesting part: its
      own text said it "only bites after the first external user exists" — and publishing is
      exactly what manufactures that user, so it was low right up until the moment it became
      blocking. It was found blocking publish-github while the pre-publication list was being
      written, three days later.
      Settled by declining the expensive half. A project may declare `standard_version` and a
      mismatch is reported as YELLOW, but Rite never runs an old rule set: keeping every past
      standard runnable is a promise a one-person project cannot honour, and an unhonoured
      compatibility promise converts a visible gap into a silent wrong answer.

  - id: c-unimplementable-tests
    retired: "2026-09-09"
    how: settled
    outcome: d-claim-surface
    why: >
      Opened 2026-09-07 with SIX tests that could not run under MISSION's no-inference
      constraint. It reached ZERO. Two were resolved by `git init`, one by narrowing the spec
      to match practice, one by a route that closes c-plan-attribution, one was dropped as
      redundant (d-drop-claims-match-stage), and the last — claims_match_filesystem, the
      highest-value test in the standard — is implemented as of today via the declared claim
      surface. The concern was right that the unimplementable tier was the differentiated tier.
      What it could not have known is that the rule was also declared on the WRONG ARTIFACT:
      CLAUDE.md alone, catching none of the four failures that motivated the work.

  - id: c-prior-art-ai-floppy
    retired: "2026-09-09"
    how: dropped
    outcome: d-audience-is-the-author-not-a-market
    why: >
      Opened and dropped the same day. It was raised as a competitive threat, and the user ruled
      that competition is not the frame: "i am not competing. this mostly auto running plugin is
      done for me and other that think like me or adhere to this way of thinking AND as an
      artifact for portfolio."
      The technical reading stands and is kept in LOG — ai-floppy ships no hooks, its own spec
      defers a SessionStart hook on token cost, and Cursor support is why. What is dropped is
      the framing that any of that requires a response from Rite.

  - id: c-na-conflates-absent-with-unparseable
    retired: "2026-09-09"
    how: settled
    outcome: d-unparseable-is-red-absent-is-na
    why: >
      Opened and settled the same day, by the user's ruling. The symptom had already gone when
      the widened parser stopped refusing real files — which is exactly why it was worth fixing
      anyway: a defect whose symptom disappears is the kind that comes back silently.

  - id: c-yaml-subset-too-narrow-for-the-wild
    retired: "2026-09-09"
    how: settled
    outcome: d-stdlib-only-yaml-subset
    why: >
      Opened and settled the same day, by the user's ruling to widen. Recorded as a dated
      correction inside the original decision rather than as a new one: the decision's
      REASONING is unchanged and still right — stdlib only, refuse rather than guess. Only its
      measurement was wrong, and a measurement taken on one repo and generalised to a standard
      is the error worth naming.

  - id: c-installed-copy-can-be-stale
    retired: "2026-09-09"
    how: settled
    outcome: d-installed-copy-checked-by-test-not-by-rule
    why: >
      Opened and settled within a day. Ruled by the user 2026-09-09. The answer was a check
      that fails (scripts/test-installed-current.py), not a documented release step — the
      documented-step option was rejected as a rule with no completion test.
  - id: c-marker-lookup-not-case-exact
    retired: "2026-09-09"
    how: settled
    outcome: d-one-implementation-of-a-portability-rule
    why: >
      Opened and settled within a day. Ruled by the user 2026-09-09: a bug, not an exemption.
      The predicate now has one implementation in scripts/ritefs.py and three consumers.

  - id: c-vendor-pyyaml
    retired: "2026-09-07"
    how: settled
    outcome: d-stdlib-only-yaml-subset
    why: >
      Superseded by a stronger answer to the same question. Vendoring PyYAML would have cut one
      install step; a stdlib-only subset parser cuts the dependency entirely. Opened and
      retired the same day, roughly an hour apart.
  - id: c-python-chosen-by-inheritance
    retired: "2026-09-07"
    how: settled
    outcome: d-python-is-the-runtime
    why: >
      Opened and closed the same day. It asked for a rationale, and measurement supplied one:
      the counter-argument it rested on — that Node is guaranteed present because Claude Code
      is a Node application — was verified FALSE against the binary on disk. Successor concern
      for the part that survived: c-vendor-pyyaml.
